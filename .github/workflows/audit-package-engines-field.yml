name: Audit Package Engines Field

on:
  push:
    paths:
      - 'package.json'
  pull_request:
    paths:
      - 'package.json'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Check engines field
        run: |
          grep "\"engines\":" package.json || (echo "package.json should specify engines field" && exit 1)
