name: Audit Package Engines Field

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Package Engines Field
        run: bash scripts/repo_audit.sh --check package_engines_field
        shell: bash
