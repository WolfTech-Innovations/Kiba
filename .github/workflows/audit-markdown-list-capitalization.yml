name: Audit Markdown List Capitalization

on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run Markdown Audit
        shell: bash
        run: |
          if grep -rnE "^[ \t]*[-*+] [a-z]" . --include="*.md"; then
            echo "Error: List items should start with a capital letter"
            exit 1
          fi
