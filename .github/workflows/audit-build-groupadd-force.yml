name: Audit Build Groupadd Force

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for groupadd force
        run: |
          # Robust check for groupadd without --force or -f
          grep -rnE "^[^#]*groupadd" scripts/ | grep -vE "(\-f|\-\-force)" && (echo "Use --force with groupadd for idempotency" && exit 1) || exit 0
