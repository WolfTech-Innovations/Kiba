name: Audit Workflow Heredoc Quoted
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check heredoc terminators
        run: |
          # Matches << followed by space and then a word, but only if the word is NOT quoted
          if grep -rnE "<< [A-Z_]+" .github/workflows/; then
            echo "Error: Shell heredocs in workflows must use quoted terminators (e.g., << 'EOF')."
            exit 1
          fi
          # Also check for <<EOF style
          if grep -rnE "<<[A-Z_]+" .github/workflows/; then
             echo "Error: Shell heredocs in workflows must use quoted terminators."
             exit 1
          fi
