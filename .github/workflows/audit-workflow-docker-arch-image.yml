name: Audit Workflow Docker Arch Image
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker image
        run: |
          if ! grep -q "archlinux:latest" .github/workflows/kiba.yml; then
            echo "Error: Build environment must use archlinux:latest Docker image."
            exit 1
          fi
