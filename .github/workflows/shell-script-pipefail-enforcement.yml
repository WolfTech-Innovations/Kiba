name: Shell Script Pipefail Enforcement
on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for pipefail
        run: |
          for f in $(find . -name "*.sh"); do
            if grep -q "|" "$f"; then
              grep -q "set -o pipefail" "$f" || { echo "Pipe usage found in $f without set -o pipefail"; exit 1; }
            fi
          done
