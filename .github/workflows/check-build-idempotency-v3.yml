name: Check Build Idempotency
on:
  push:
    paths:
      - scripts/kibatv_build.sh
  pull_request:
    paths:
      - scripts/kibatv_build.sh
jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: tr""ue
    - name: Check Idempotency
      run: grep "mkdir" scripts/kibatv_build.sh | grep -v "-p" && exit 1 || exit 0
    timeout-minutes: 5
