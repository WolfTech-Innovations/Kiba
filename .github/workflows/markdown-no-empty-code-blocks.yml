name: Markdown No Empty Code Blocks
on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for empty code blocks
        run: |
          grep -Pzn "(?s)\`\`\`\w*\n\`\`\`" . --include="*.md" && { echo "Empty code blocks found"; exit 1; } || echo "No empty code blocks found"
