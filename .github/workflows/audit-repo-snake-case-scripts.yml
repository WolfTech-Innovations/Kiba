name: Audit Repo Snake Case Scripts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Repo Snake Case Scripts
        run: bash scripts/repo_audit.sh --check repo_snake_case_scripts
        shell: bash
