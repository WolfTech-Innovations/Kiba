name: Python Fstring Redundancy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python_fstring_redundancy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect f-strings without placeholders
        run: |
          grep -r "f'[^\\{]*'" . --include="*.py" && exit 1 || exit 0
