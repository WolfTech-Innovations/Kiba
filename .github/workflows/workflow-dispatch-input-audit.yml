name: Workflow Dispatch Input Audit
on:
  pull_request:
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  audit-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan for Unsafe Input Expansion
        run: |
          echo "### Workflow Dispatch Security Audit" >> $GITHUB_STEP_SUMMARY

          # Look for github.event.inputs expanded directly in 'run' blocks
          UNSAFE=$(grep -r "github.event.inputs" .github/workflows/*.yml | grep "run:" || true)

          if [ -n "$UNSAFE" ]; then
             echo ":warning: Potential shell injection risk! Inputs should be mapped to environment variables instead of expanded directly in 'run' blocks:" >> $GITHUB_STEP_SUMMARY
             echo '```yaml' >> $GITHUB_STEP_SUMMARY
             echo "$UNSAFE" >> $GITHUB_STEP_SUMMARY
             echo '```' >> $GITHUB_STEP_SUMMARY
             exit 1
          else
             echo ":white_check_mark: No direct input expansions found in 'run' blocks." >> $GITHUB_STEP_SUMMARY
          fi
