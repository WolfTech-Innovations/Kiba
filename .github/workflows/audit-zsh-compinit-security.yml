name: Audit Zsh Compinit Security

on:
  push:
    paths:
      - '**/zshrc'
      - '**.zsh'
  pull_request:
    paths:
      - '**/zshrc'
      - '**.zsh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run Zsh Audit
        shell: bash
        run: |
          if grep -rn "\bcompinit\b" . | grep -v "\-u"; then
            echo "Error: Use 'compinit -u' for security"
            exit 1
          fi
