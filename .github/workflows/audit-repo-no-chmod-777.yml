name: "Audit Repo No Chmod 777"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          ! grep -rE 'chmod (0?777|777)' . --exclude-dir=.git --exclude-dir=node_modules --exclude=repo_audit.sh --exclude=generate_45_workflows.py --exclude='audit-*.yml' || (echo "::error::Dangerous chmod 777 found" && exit 1)
