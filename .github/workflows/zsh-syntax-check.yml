name: Check Zshrc Performance
on: [push, pull_request]

jobs:
  zsh-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Syntax check
        run: |
          for f in branding/*.zsh; do
            [ -e "$f" ] || continue
            zsh -n "$f"
          done
