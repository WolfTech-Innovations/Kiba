name: "Audit Repo No Nested Git"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check nested .git
        run: |
          [ -z "$(find . -mindepth 2 -name '.git' -type d)" ]
        shell: bash
