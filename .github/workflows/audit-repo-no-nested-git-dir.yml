name: Audit Repo No Nested Git Dir
on:
  push:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check nested .git
        run: |
          if find . -mindepth 2 -name ".git" -type d | grep -q "."; then
            echo "Error: Found nested .git directories."
            exit 1
          fi
        shell: bash
