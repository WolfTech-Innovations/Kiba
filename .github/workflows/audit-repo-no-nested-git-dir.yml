name: Audit Repo No Nested Git Dir
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          ! find . -mindepth 2 -name ".git" -type d | grep .
