name: Audit Repo No Nested Git Dir
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          NESTED_GIT=$(find . -mindepth 2 -name ".git" -type d)
          if [ -n "$NESTED_GIT" ]; then
            echo "ERROR: Found nested .git directories"
            exit 1
          fi
