name: Monitor Starship
on:
  schedule:
    - cron: '0 1 * * *'
permissions:
  issues: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-starship:
    runs-on: ubuntu-latest
    steps:
      - name: Get
        run: curl -s https://api.github.com/repos/starship/starship/releases/latest | jq -r .tag_name
