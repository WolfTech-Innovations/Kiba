name: Audit Build No Sudo

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for sudo usage
        run: |
          # Robust check for sudo, ignoring comments
          grep -rnE "^[^#]*sudo " scripts/ && (echo "Avoid using 'sudo' inside build scripts; the script should be run with proper privileges" && exit 1) || exit 0
