name: Audit Build Curl Max Time

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
        with:
          persist-credentials: false
      - name: Check for curl max-time
        run: |
          # Robust check for curl without --max-time or -m
          grep -rnE "^[^#]*curl " scripts/ | grep -vE "(\-\-max\-time|\-m)" && (echo "Use --max-time or -m with curl to prevent hung builds" && exit 1) || exit 0
