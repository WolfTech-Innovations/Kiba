name: ISO Build Duration Tracker
on:
  workflow_run:
    workflows: ["KibaOS Build"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log Duration
        shell: bash
        env:
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: echo "Build took $UPDATED_AT - $STARTED_AT"
