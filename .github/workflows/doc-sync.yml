name: Doc Sync
on:
  push:
    paths:
      - 'README.md'
      - 'docs/**'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Sync documentation
        run: |
          if [ -d docs ]; then
            echo "Documentation directory found. Syncing..."
          fi
