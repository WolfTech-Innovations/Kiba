name: Audit Plymouth Set Default
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify Plymouth theme activation
        run: |
          grep -q 'plymouth-set-default-theme kibaos' build.sh
