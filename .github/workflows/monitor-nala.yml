name: Monitor Nala
on:
  schedule:
    - cron: '0 2 * * *'
permissions:
  issues: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-nala:
    runs-on: ubuntu-latest
    steps:
      - name: Get
        run: curl -s https://api.github.com/repos/volitank/nala/releases/latest | jq -r .tag_name
