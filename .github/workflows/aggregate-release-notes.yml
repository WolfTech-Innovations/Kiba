name: Aggregate Release Notes

on:
  push:
    paths:
      - "Notes/**"
  pull_request:
    paths:
      - "Notes/**"

jobs:
  audit:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Aggregate Release Notes
        run: |
          cat Notes/NTE-*.md > RELEASE_SUMMARY.md 2>/dev/null || true
