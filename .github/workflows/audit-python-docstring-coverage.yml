name: Audit Python Docstring Coverage

on:
  push:
    paths:
      - '**.py'
  pull_request:
    paths:
      - '**.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check docstring coverage
        run: |
          grep -rnE "^\s*def .+\(" . --include="*.py" -A 1 | grep -vE "def |\"\"\"" && (echo "Functions should have docstrings" && exit 1) || exit 0
