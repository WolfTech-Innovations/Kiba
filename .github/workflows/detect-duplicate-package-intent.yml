name: Detect Duplicate Package Intent
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for Conflicts
        run: |
          PACKAGES=$(grep -A 200 "PACKAGES" .github/workflows/kiba.yml | grep -v "PACKAGES" | sed '/^$/q')
          if echo "$PACKAGES" | grep -q "nano" && echo "$PACKAGES" | grep -q "micro"; then
            echo "Both nano and micro installed - choose one"
            exit 1
          fi
