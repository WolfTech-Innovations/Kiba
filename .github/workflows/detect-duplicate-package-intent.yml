name: Detect Duplicate Package Intent
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for Conflicts
        run: |
          PACKAGES=$(grep -A 200 "PACKAGES" .github/workflows/kiba.yml | grep -v "PACKAGES" | sed '/^$/q')
          echo "$PACKAGES" | grep -q "nano" && echo "$PACKAGES" | grep -q "micro" && (echo "Both nano and micro installed - choose one" && exit 1) || echo "No obvious duplicates"
