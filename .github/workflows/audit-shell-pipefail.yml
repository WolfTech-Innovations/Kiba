name: "Audit Shell Pipefail"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check set -o pipefail
        run: |
          grep -r 'set -e' . --include='*.sh' | cut -d: -f1 | xargs grep -L 'pipefail' | grep 'sh' && false || true
        shell: bash
