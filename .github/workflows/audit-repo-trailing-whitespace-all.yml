name: "Audit Repo trailing whitespace"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Audit Repo trailing whitespace
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          ! grep -rI "[[:blank:]]$" . --exclude-dir=.git --exclude="pnpm-lock.yaml" || (echo "Trailing whitespace found" && exit 1)
