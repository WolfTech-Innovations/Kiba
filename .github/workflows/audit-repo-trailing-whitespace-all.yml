name: Audit Repo Trailing Whitespace All

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Repo Trailing Whitespace All
        run: bash scripts/repo_audit.sh --check repo_trailing_whitespace_all
        shell: bash
