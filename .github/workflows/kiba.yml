#!/bin/bash
set -ex

pacman -Syu --noconfirm archiso base-devel git \
  squashfs-tools libisoburn mtools dosfstools

cd /w
ISO="kibaos-v${RUN_NUM}"

# 1. Create profile FIRST (fixes the ordering bug)
cp -r /usr/share/archiso/configs/releng/ kiba-profile
cd kiba-profile

# 2. Packages — UKUI replaces cutefish entirely
cat > packages.x86_64 << 'PACKAGES'
archlinux-keyring
base
linux
linux-firmware
mkinitcpio
grub
efibootmgr
syslinux
memtest86+
networkmanager
git wget curl sudo
zsh zsh-autosuggestions zsh-syntax-highlighting
starship fastfetch eza bat btop ripgrep fd tealdeer duf ncdu micro nano fzf yt-dlp
xorg-server xorg-xinit
ukui
lightdm lightdm-gtk-greeter
ukui-control-center
calamares
inter-font ttf-jetbrains-mono noto-fonts-emoji
discover flatpak xdg-desktop-portal
chromium vlc gparted
peony bionic-terminal spectacle ark
plymouth ntfs-3g exfatprogs cryptsetup
nextcloud-client erofs-utils
PACKAGES

# 3. Enable lightdm on the live image
mkdir -p airootfs/etc/systemd/system/multi-user.target.wants
ln -sf /usr/lib/systemd/system/lightdm.service \
  airootfs/etc/systemd/system/multi-user.target.wants/lightdm.service

# 4. mkinitcpio for live env
cat > airootfs/etc/mkinitcpio.conf << 'MKINIT'
MODULES=(erofs)
BINARIES=()
FILES=()
HOOKS=(base udev memdisk archiso_shutdown archiso archiso_loop_mnt archiso_kms block filesystems keyboard)
MKINIT

# 5. Calamares (unchanged from your original)
mkdir -p airootfs/etc/calamares/modules
cat > airootfs/etc/calamares/settings.conf << 'CALA'
---
modules-search: [ local ]
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader
  - umount
- show:
  - finished
branding: kibaos
prompt-install: false
dont-chroot: false
CALA

# 6. Nextcloud autostart
mkdir -p airootfs/etc/skel/.config/autostart
cat > airootfs/etc/skel/.config/autostart/nextcloud.desktop << 'CLOUD'
[Desktop Entry]
Type=Application
Name=Nextcloud Sync
Exec=nextcloud --background
CLOUD

# 7. Welcome script — ukui-control-center replaces cutefish-settings
mkdir -p airootfs/usr/local/bin
cat > airootfs/usr/local/bin/kiba-welcome << 'WELCOME'
#!/bin/bash
while true; do
  CHOICE=$(zenity --list --title="Welcome to KibaOS" \
    --text="Welcome to KibaOS! What would you like to do?" \
    --column="Tag" --column="Action" --column="Description" \
    "install"    "Install KibaOS"     "Install permanently to disk" \
    "browser"    "Web Browser"        "Browse the internet" \
    "store"      "Software Center"    "Discover and install apps" \
    "terminal"   "Open Terminal"      "Use Meta+T to launch" \
    "files"      "File Manager"       "Use Meta+E to browse" \
    "settings"   "System Settings"    "Configure desktop and hardware" \
    "screenshot" "Screen Capture"     "Use Print to capture" \
    "info"       "System Info"        "View technical details" \
    "shortcuts"  "Shortcuts"          "View keyboard shortcuts" \
    "wiki"       "Online Wiki"        "Read the documentation" \
    --hide-column=1 --print-column=1 \
    --width=450 --height=500 --ok-label="Launch" --cancel-label="Close" 2>/dev/null)

  [ -z "$CHOICE" ] && break

  case "$CHOICE" in
    "install")    sudo calamares & break ;;
    "browser")    chromium & break ;;
    "store")      discover & break ;;
    "terminal")   bionic-terminal & break ;;
    "files")      peony & break ;;
    "settings")   ukui-control-center & break ;;
    "screenshot") spectacle & break ;;
    "info")       (fastfetch | zenity --text-info --title="System Information") & ;;
    "shortcuts")
      zenity --list --title="KibaOS Shortcuts" \
        --column="Action" --column="Shortcut" \
        "Application Menu" "Meta" \
        "Terminal" "Meta+T" \
        "Search" "Meta+Space" \
        "File Manager" "Meta+E" \
        --ok-label="Close" 2>/dev/null &
      ;;
    "wiki")
      chromium "https://github.com/WolfTech-Innovations/Kiba/blob/main/WIKI.md" & break ;;
  esac
done
WELCOME
chmod +x airootfs/usr/local/bin/kiba-welcome

# 8. Build
cd ..
mkarchiso -v -w work -o out kiba-profile/

if [ -f out/*.iso ]; then
  mv out/*.iso "${ISO}.iso"
  sha256sum "${ISO}.iso" > "${ISO}.iso.sha256"
else
  echo "ERROR: ISO not found!"
  exit 1
fi
