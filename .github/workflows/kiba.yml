name: "KibaOS Build"

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build script
        run: |
          cat > build.sh << 'BUILD_SCRIPT_EOF'
          #!/bin/bash
          set -ex

          # Install build deps + archiso + yay (still needed for calamares-git)
          pacman -Syu --noconfirm archiso base-devel git squashfs-tools libisoburn mtools dosfstools \
            cmake extra-cmake-modules qt5-base qt5-quickcontrols2 qt5-declarative qt5-tools \
            qt5-x11extras qt5-sensors kwindowsystem kwin kdecoration kconfig kguiaddons \
            kcoreaddons kconfigwidgets kwayland kio networkmanager-qt modemmanager-qt \
            polkit polkit-qt5 pkgconf libqtxdg libdbusmenu-qt5 libxcb \
            xorg-server-devel xf86-input-libinput xf86-input-synaptics \
            libxcb-icccm4 libxcb-ewmh libxcb-randr libxcb-xfixes libxcb-damage \
            libxcb-composite libxcb-shm libxcb-util libxcb-image \
            libsm libxtst libpulse libxcursor taglib freetype2 fontconfig \
            sddm ninja

          # Non-root user for AUR builds (calamares-git)
          useradd -m -s /bin/bash aurbuild
          echo "aurbuild ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers.d/aurbuild

          # Install yay for calamares-git
          cd /tmp
          sudo -u aurbuild git clone https://aur.archlinux.org/yay.git
          cd yay && sudo -u aurbuild makepkg -si --noconfirm

          # 1. Build Cutefish DE from source (in order — deps first)
          mkdir -p /tmp/cutefish && cd /tmp/cutefish

          build_cutefish() {
            local repo=$1
            git clone --depth=1 https://github.com/cutefishos/${repo}.git
            cd ${repo}
            mkdir -p build && cd build
            cmake -DCMAKE_INSTALL_PREFIX=/usr ..
            make -j$(nproc)
            make install
            cd /tmp/cutefish
          }

          build_cutefish libcutefish
          build_cutefish fishui
          build_cutefish kwin-plugins
          build_cutefish core
          build_cutefish icons
          build_cutefish launcher
          build_cutefish filemanager
          build_cutefish settings
          build_cutefish screenlocker
          build_cutefish terminal
          build_cutefish calculator
          build_cutefish screenshot
          build_cutefish statusbar
          build_cutefish wallpapers

          # Package all installed cutefish files into a local pacman package
          mkdir -p /tmp/cutefish-pkg/pkg/cutefish
          # Collect everything cutefish installed into /usr
          # We'll tar it up and create a fake package for pacman to track
          # Instead: just copy the installed files into the airootfs directly later (step 9)

          # 2. Build calamares-git from AUR
          cd /w
          sudo -u aurbuild yay -S --noconfirm calamares-git
          mkdir -p /tmp/aur-pkgs
          find /home/aurbuild/.cache/yay -name "*.pkg.tar.zst" -exec cp {} /tmp/aur-pkgs/ \;
          repo-add /tmp/aur-pkgs/aur-local.db.tar.zst /tmp/aur-pkgs/*.pkg.tar.zst

          cd /w
          ISO="kibaos-v${RUN_NUM}"

          # 2. Create profile FIRST (fixes ordering bug from original)
          cp -r /usr/share/archiso/configs/releng/ kiba-profile
          cd kiba-profile

          # 3. Write full pacman.conf — guarantees core/extra present + injects local AUR repo
          cat > pacman.conf << 'PACMAN_CONF'
          [options]
          HoldPkg = pacman glibc
          Architecture = auto
          ParallelDownloads = 5
          SigLevel = Required DatabaseOptional
          LocalFileSigLevel = Optional

          [aur-local]
          SigLevel = Never
          Server = file:///tmp/aur-pkgs

          [core]
          Include = /etc/pacman.d/mirrorlist

          [extra]
          Include = /etc/pacman.d/mirrorlist
          PACMAN_CONF

          # 4. Packages — cutefish runtime deps (DE itself copied into airootfs in step 9)
          cat > packages.x86_64 << 'PACKAGES'
          archlinux-keyring
          base
          linux
          linux-firmware
          mkinitcpio
          grub
          efibootmgr
          syslinux
          memtest86+
          networkmanager
          git
          wget
          curl
          sudo
          zsh
          zsh-autosuggestions
          zsh-syntax-highlighting
          starship
          fastfetch
          eza
          bat
          btop
          ripgrep
          fd
          tealdeer
          duf
          ncdu
          micro
          nano
          fzf
          yt-dlp
          xorg-server
          xorg-xinit
          sddm
          qt5-base
          qt5-quickcontrols2
          qt5-declarative
          qt5-x11extras
          qt5-sensors
          kwindowsystem
          kwin
          kdecoration
          kconfig
          kguiaddons
          kcoreaddons
          kconfigwidgets
          kwayland
          kio
          networkmanager-qt
          modemmanager-qt
          polkit
          polkit-qt5
          libqtxdg
          libdbusmenu-qt5
          libxcb
          libsm
          libxtst
          libpulse
          libxcursor
          taglib
          freetype2
          fontconfig
          calamares-git
          inter-font
          ttf-jetbrains-mono
          noto-fonts-emoji
          discover
          flatpak
          xdg-desktop-portal
          chromium
          vlc
          gparted
          konsole
          spectacle
          ark
          plymouth
          ntfs-3g
          exfatprogs
          cryptsetup
          nextcloud-client
          erofs-utils
          PACKAGES

          # 5. Enable lightdm on the live image
          mkdir -p airootfs/etc/systemd/system/multi-user.target.wants
          ln -sf /usr/lib/systemd/system/lightdm.service \
            airootfs/etc/systemd/system/multi-user.target.wants/lightdm.service

          # 6. mkinitcpio for live env
          cat > airootfs/etc/mkinitcpio.conf << 'MKINIT'
          MODULES=(erofs)
          BINARIES=()
          FILES=()
          HOOKS=(base udev memdisk archiso_shutdown archiso archiso_loop_mnt archiso_kms block filesystems keyboard)
          MKINIT

          # 7. Calamares config
          mkdir -p airootfs/etc/calamares/modules
          cat > airootfs/etc/calamares/settings.conf << 'CALA_SETTINGS'
          ---
          modules-search: [ local ]
          instances:
          - id: fullscreen
            module: welcome
            config: welcome_fullscreen.conf
          sequence:
          - show:
            - welcome@fullscreen
            - locale
            - keyboard
            - partition
            - users
            - summary
          - exec:
            - partition
            - mount
            - unpackfs
            - machineid
            - fstab
            - locale
            - keyboard
            - localecfg
            - users
            - displaymanager
            - networkcfg
            - hwclock
            - services-systemd
            - bootloader
            - umount
          - show:
            - finished
          branding: kibaos
          prompt-install: false
          dont-chroot: false
          CALA_SETTINGS

          cat > airootfs/etc/calamares/modules/welcome_fullscreen.conf << 'CALA_WELCOME'
          ---
          showSupportUrl: false
          showKnownIssuesUrl: false
          showReleaseNotesUrl: false
          requirements:
            requiredStorageGiB: 20
            requiredRamGiB: 2
          CALA_WELCOME

          # 8. Nextcloud autostart
          mkdir -p airootfs/etc/skel/.config/autostart
          cat > airootfs/etc/skel/.config/autostart/nextcloud.desktop << 'CLOUD'
          [Desktop Entry]
          Type=Application
          Name=Nextcloud Sync
          Exec=nextcloud --background
          CLOUD

          # 9. Welcome script
          mkdir -p airootfs/usr/local/bin
          cat > airootfs/usr/local/bin/kiba-welcome << 'WELCOME'
          #!/bin/bash
          while true; do
            CHOICE=$(zenity --list --title="Welcome to KibaOS" \
              --window-icon="/usr/share/kibaos/logo.png" \
              --text="Welcome to KibaOS! What would you like to do?" \
              --column="Tag" --column="Action" --column="Description" \
              "install"    "Install KibaOS"     "Install the system permanently to your disk" \
              "browser"    "Web Browser"         "Browse the internet" \
              "store"      "Software Center"     "Discover and install new applications" \
              "terminal"   "Open Terminal"       "Use Meta+T to launch" \
              "files"      "File Manager"        "Use Meta+E to browse" \
              "settings"   "System Settings"     "Configure your desktop and hardware" \
              "screenshot" "Screen Capture"      "Use Print to capture" \
              "info"       "System Information"  "View technical system details" \
              "shortcuts"  "Keyboard Shortcuts"  "View useful desktop shortcuts" \
              "wiki"       "Online Wiki"         "Read the technical documentation" \
              --hide-column=1 --print-column=1 \
              --width=450 --height=500 --ok-label="Launch" --cancel-label="Close" 2>/dev/null)

            [ -z "$CHOICE" ] && break

            case "$CHOICE" in
              "install")    sudo calamares & break ;;
              "browser")    chromium & break ;;
              "store")      discover & break ;;
              "terminal")   cutefish-terminal & break ;;
              "files")      cutefish-filemanager & break ;;
              "settings")   cutefish-settings & break ;;
              "screenshot") cutefish-screenshot & break ;;
              "info")
                (fastfetch | zenity --text-info --title="KibaOS System Information") &
                ;;
              "shortcuts")
                (zenity --list --title="KibaOS Shortcuts" \
                  --column="Action" --column="Shortcut" \
                  "Application Menu" "Meta" \
                  "Terminal"         "Meta + T" \
                  "Search"           "Meta + Space" \
                  "File Manager"     "Meta + E" \
                  --ok-label="Close" --cancel-label="Close" 2>/dev/null) &
                ;;
              "wiki")
                chromium "https://github.com/WolfTech-Innovations/Kiba/blob/main/WIKI.md" & break ;;
            esac
          done
          WELCOME
          chmod +x airootfs/usr/local/bin/kiba-welcome

          # 10. Build
          cd ..
          mkarchiso -v -w work -o out kiba-profile/

          if [ -f out/*.iso ]; then
            mv out/*.iso "${ISO}.iso"
            sha256sum "${ISO}.iso" > "${ISO}.iso.sha256"
          else
            echo "ERROR: ISO file not found!"
            exit 1
          fi
          BUILD_SCRIPT_EOF
          chmod +x build.sh

      - name: Run build in Docker
        run: |
          docker run --rm --privileged \
            -v "$PWD:/w" \
            -e RUN_NUM="${{ github.run_number }}" \
            archlinux:latest \
            /bin/bash /w/build.sh

      - name: Upload to SourceForge
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SF_PASS: ${{ secrets.SF_PASS }}
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SF_PASS" ]; then
            echo "SourceForge credentials not configured. Skipping upload."
            exit 0
          fi
          sudo apt update && sudo apt install -y sshpass rsync
          for iso_file in *.iso; do
            [ -f "$iso_file" ] || continue
            echo "Uploading $iso_file to SourceForge..."
            sshpass -p "$SF_PASS" rsync -avP \
              -e "ssh -o StrictHostKeyChecking=no" \
              "$iso_file" \
              "$SF_USER@frs.sourceforge.net:/home/frs/project/kibaos/"
          done
