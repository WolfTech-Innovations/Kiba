name: "KibaOS Build"

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run build in Docker
        run: |
          docker run --rm --privileged \
            -v "$PWD:/w" \
            -e RUN_NUM="${{ github.run_number }}" \
            archlinux:latest \
            /bin/bash /w/build.sh

      - name: Upload to SourceForge
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SSHPASS: ${{ secrets.SF_PASS }}
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SSHPASS" ]; then
            echo "SourceForge credentials not configured. Skipping upload."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y sshpass rsync
          mkdir -p ~/.ssh
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts
          for iso_file in *.iso; do
            [ -f "$iso_file" ] || continue
            echo "Uploading $iso_file to SourceForge..."
            sshpass -e rsync -avP \
              "$iso_file" \
              "$SF_USER@frs.sourceforge.net:/home/frs/project/kibaos/"
          done
