name: "KibaOS Build"

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build script
        run: |
          cat > build.sh << 'BUILD_SCRIPT_EOF'
          #!/bin/bash
          set -ex

          # ── Install ALL deps inside the container ────────────────────────────────
          # (pacman runs here, inside archlinux:latest, NOT on the host runner)

          # archlinux:latest ships with a stale/empty DB and an uninitialised
          # keyring. Fix both before any install — this is why packages like
          # bluez-qt5 was dropped from Arch repos (KF5 build gone, only KF6 bluez-qt remains).
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syy --noconfirm   # -yy forces full DB refresh regardless of timestamps
          pacman -Su  --noconfirm   # apply pending upgrades before adding new packages

          pacman -S --noconfirm --needed \
            archiso base-devel git squashfs-tools libisoburn mtools dosfstools \
            \
            cmake extra-cmake-modules ninja \
            \
            qt5-base qt5-declarative qt5-svg qt5-quickcontrols2 \
            qt5-graphicaleffects qt5-x11extras qt5-tools \
            qt5-quickcontrols qt5-multimedia qt5-wayland \
            \
            kwindowsystem5 kidletime5 \
            kcoreaddons kconfig ki18n kiconthemes \
            kdbusaddons kservice \
            kwin \
            \
            libxcb xcb-util xcb-util-wm xcb-util-keysyms \
            xcb-util-image xcb-util-renderutil \
            libxkbcommon xorgproto libxcursor libxtst \
            libpulse \
            xorg-server-devel xf86-input-libinput xf86-input-synaptics \
            \
            dbus pam polkit polkit-qt5 \
            gsettings-desktop-schemas networkmanager \
            bluez \
            fontconfig freetype2 icu \
            \
            appmenu-gtk-module

          # ── Setup ────────────────────────────────────────────────────────────────
          cd /w
          ISO="kibaos-v${RUN_NUM}"
          STAGING="/tmp/cutefish-staging"   # install here so later repos can find earlier ones
          AIROOTFS="/w/kiba-profile/airootfs"

          echo "=== Configuring archiso profile ==="
          cp -r /usr/share/archiso/configs/releng/ kiba-profile
          mkdir -p "${AIROOTFS}"

          # ── Compile Cutefish DE ──────────────────────────────────────────────────
          # Build order matters:
          #   1. libcutefish  (no cutefish deps)
          #   2. fishui       (needs kwindowsystem5, qt5-*)
          #   3. core, dock, launcher, statusbar, settings  (need fishui + libcutefish)
          #   4. terminal, filemanager, calculator, screenshot, wallpapers, icons
          #
          # Strategy: install each component to $STAGING so the next cmake can find it,
          # then also install into airootfs so it ends up in the ISO.

          echo "=== Compiling Cutefish DE ==="
          mkdir -p src && cd src

          build_cutefish_repo() {
            local REPO=$1
            local GITHUB_NAME=${2:-$REPO}   # github repo name if different from local dir
            git clone --depth 1 "https://github.com/cutefishos/${GITHUB_NAME}.git" "${REPO}"
            cd "${REPO}"
            mkdir -p build && cd build
            cmake -DCMAKE_INSTALL_PREFIX=/usr \
                  -DCMAKE_PREFIX_PATH="${STAGING}/usr" \
                  -GNinja ..
            ninja
            # Install to staging so subsequent builds can find headers/libs
            DESTDIR="${STAGING}" ninja install
            # Also install into airootfs for the ISO
            DESTDIR="${AIROOTFS}" ninja install
            cd ../..
          }

          # 1. libcutefish — system library, no cutefish deps
          build_cutefish_repo libcutefish libcutefish

          # 2. fishui — GUI framework; needs kwindowsystem5, qt5-declarative, qt5-graphicaleffects, qt5-quickcontrols2, qt5-svg
          build_cutefish_repo fishui fishui

          # 3. Core components — all need fishui + libcutefish
          #    core:       kidletime5, kwin-x11, libxcb, libxcursor, libxtst, polkit-qt5
          #    dock:       fishui, libcutefish, kwindowsystem5
          #    launcher:   fishui, libcutefish, kwindowsystem5
          #    statusbar:  fishui, libcutefish, kwindowsystem5
          #    settings:   fishui, libcutefish, fontconfig, freetype2, icu, libxcursor, qt5-quickcontrols
          #    (bluetooth submodule skipped: needs KF5BluezQt, dropped from Arch; bluez-qt is KF6-only)
          for REPO in core dock launcher statusbar; do
            build_cutefish_repo "${REPO}" "${REPO}"
          done

          # settings: patch out bluetooth submodule before building
          git clone --depth 1 https://github.com/cutefishos/settings.git settings
          cd settings
          sed -i '/add_subdirectory(bluez)/d'      CMakeLists.txt
          sed -i '/add_subdirectory(bluetooth)/d'  CMakeLists.txt
          mkdir -p build && cd build
          cmake -DCMAKE_INSTALL_PREFIX=/usr \
                -DCMAKE_PREFIX_PATH="${STAGING}/usr" \
                -GNinja ..
          ninja
          DESTDIR="${STAGING}" ninja install
          DESTDIR="${AIROOTFS}" ninja install
          cd ../..

          # 4. Apps — fishui + libcutefish
          for REPO in terminal filemanager calculator screenshot; do
            build_cutefish_repo "${REPO}" "${REPO}"
          done

          # 5. Wallpapers & icons — no compilation, just file installs
          for REPO in wallpapers icons; do
            build_cutefish_repo "${REPO}" "${REPO}"
          done

          cd ..  # back to kiba-profile

          # ── Package list ─────────────────────────────────────────────────────────
          cat > packages.x86_64 << 'PACKAGES'
          archlinux-keyring
          base
          linux
          linux-headers
          linux-firmware
          mkinitcpio
          grub
          efibootmgr
          networkmanager
          git
          wget
          curl
          sudo
          zsh
          zsh-autosuggestions
          zsh-syntax-highlighting
          starship
          fastfetch
          eza
          bat
          btop
          ripgrep
          fd
          tealdeer
          duf
          ncdu
          micro
          nano
          fzf
          yt-dlp
          calamares
          inter-font
          ttf-jetbrains-mono
          noto-fonts-emoji
          flatpak
          xdg-desktop-portal-kde
          xdg-desktop-portal-gtk
          chromium
          vlc
          gparted
          spectacle
          ark
          plymouth
          ntfs-3g
          exfatprogs
          cryptsetup
          nextcloud-client
          erofs-utils
          sddm
          kwin
          qt5-base
          qt5-declarative
          qt5-svg
          qt5-quickcontrols2
          qt5-graphicaleffects
          qt5-x11extras
          qt5-quickcontrols
          qt5-multimedia
          kwindowsystem5
          kidletime5
          polkit-qt5
          libxcursor
          libxtst
          libxcb
          libpulse
          bluez
          networkmanager
          appmenu-gtk-module
          PACKAGES

          # ── Immutable root (erofs + tmpfs overlays) ───────────────────────────────
          mkdir -p "${AIROOTFS}/etc"
          cat > "${AIROOTFS}/etc/fstab" << 'FSTAB'
          LABEL=KIBAOS_ROOT / erofs defaults,ro 0 0
          tmpfs /etc tmpfs defaults,noatime,mode=755 0 0
          tmpfs /var tmpfs defaults,noatime,mode=755 0 0
          FSTAB

          # ── SDDM autologin for live session ──────────────────────────────────────
          mkdir -p "${AIROOTFS}/etc/sddm.conf.d"
          cat > "${AIROOTFS}/etc/sddm.conf.d/autologin.conf" << 'SDDM'
          [Autologin]
          User=liveuser
          Session=cutefish
          SDDM

          # ── Calamares OOBE config ─────────────────────────────────────────────────
          mkdir -p "${AIROOTFS}/etc/calamares/modules"
          cat > "${AIROOTFS}/etc/calamares/settings.conf" << 'CALA_SETTINGS'
          ---
          modules-search: [ local ]
          instances:
          - id: fullscreen
            module: welcome
            config: welcome_fullscreen.conf
          sequence:
          - show:
            - welcome@fullscreen
            - locale
            - keyboard
            - partition
            - users
            - summary
          - exec:
            - partition
            - mount
            - unpackfs
            - machineid
            - fstab
            - locale
            - keyboard
            - localecfg
            - users
            - displaymanager
            - networkcfg
            - hwclock
            - services-systemd
            - bootloader
            - umount
          - show:
            - finished
          branding: kibaos
          prompt-install: false
          dont-chroot: false
          CALA_SETTINGS

          # ── Welcome script ────────────────────────────────────────────────────────
          mkdir -p "${AIROOTFS}/usr/local/bin"
          cat > "${AIROOTFS}/usr/local/bin/kiba-welcome" << 'WELCOME'
          #!/bin/bash
          while true; do
            CHOICE=$(zenity --list --title="Welcome to KibaOS" \
              --window-icon="/usr/share/kibaos/logo.png" \
              --text="Welcome to KibaOS. What would you like to do?" \
              --column="Tag" --column="Action" --column="Description" \
              "install"    "Install KibaOS"      "Install the system permanently to your disk" \
              "browser"    "Web Browser"          "Browse the internet" \
              "store"      "Software Center"      "Discover and install new applications" \
              "terminal"   "Open Terminal"        "Use Meta+T to launch" \
              "files"      "File Manager"         "Use Meta+E to browse" \
              "settings"   "System Settings"      "Configure your desktop and hardware" \
              "screenshot" "Screen Capture"       "Use Print to capture" \
              "info"       "System Information"   "View technical system details" \
              "shortcuts"  "Keyboard Shortcuts"   "View useful desktop shortcuts" \
              "wiki"       "Online Wiki"          "Read the technical documentation" \
              --hide-column=1 --print-column=1 \
              --width=450 --height=500 --ok-label="Launch" --cancel-label="Close" 2>/dev/null)

            [ -z "$CHOICE" ] && break

            case "$CHOICE" in
              install)    sudo calamares & break ;;
              browser)    chromium & break ;;
              store)      flatpak run org.kde.discover & break ;;
              terminal)   cutefish-terminal & break ;;
              files)      cutefish-filemanager & break ;;
              settings)   cutefish-settings & break ;;
              screenshot) cutefish-screenshot & break ;;
              info)
                (fastfetch | zenity --text-info --title="KibaOS System Information") &
                ;;
              shortcuts)
                (zenity --list --title="KibaOS Shortcuts" \
                  --column="Action" --column="Shortcut" \
                  "Application Menu" "Meta" \
                  "Terminal"         "Meta + T" \
                  "Search"           "Meta + Space" \
                  "File Manager"     "Meta + E" \
                  --ok-label="Close" --cancel-label="Close" 2>/dev/null) &
                ;;
              wiki)
                chromium "https://github.com/WolfTech-Innovations/Kiba/blob/main/WIKI.md" & break
                ;;
            esac
          done
          WELCOME
          chmod +x "${AIROOTFS}/usr/local/bin/kiba-welcome"

          # ── Build the ISO ─────────────────────────────────────────────────────────
          cd /w
          mkarchiso -v -w work -o out kiba-profile/

          if ls out/*.iso 1>/dev/null 2>&1; then
            mv out/*.iso "${ISO}.iso"
            sha256sum "${ISO}.iso" > "${ISO}.iso.sha256"
          else
            echo "ERROR: ISO file not found!"
            exit 1
          fi
          BUILD_SCRIPT_EOF
          chmod +x build.sh

      - name: Run build in Docker
        run: |
          docker run --rm --privileged \
            -v "$PWD:/w" \
            -e RUN_NUM="${{ github.run_number }}" \
            archlinux:latest \
            /bin/bash /w/build.sh

      - name: Upload to SourceForge
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SF_PASS: ${{ secrets.SF_PASS }}
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SF_PASS" ]; then
            echo "SourceForge credentials not configured. Skipping upload."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y sshpass rsync
          for iso_file in *.iso; do
            [ -f "$iso_file" ] || continue
            echo "Uploading $iso_file to SourceForge..."
            sshpass -p "$SF_PASS" rsync -avP \
              -e "ssh -o StrictHostKeyChecking=no" \
              "$iso_file" \
              "$SF_USER@frs.sourceforge.net:/home/frs/project/kibaos/"
          done
