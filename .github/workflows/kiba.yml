name: "KibaOS Build"

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build script
        run: |
          cat > build.sh << 'BUILD_SCRIPT_EOF'
          #!/bin/bash
          set -ex

          pacman -Syu --noconfirm archiso base-devel git squashfs-tools libisoburn mtools dosfstools \
                 cmake extra-cmake-modules ninja \
                 qt5-base qt5-declarative qt5-svg qt5-quickcontrols2 qt5-graphicaleffects qt5-x11extras qt5-tools qt5-quickcontrols qt5-multimedia \
                 kcoreaddons kconfig ki18n kiconthemes kdbusaddons kservice kwindowsystem \
                 libxcb xcb-util xcb-util-wm xcb-util-keysyms xcb-util-image xcb-util-renderutil libxkbcommon xorgproto libxcursor libxtst libpulse \
                 dbus pam polkit polkit-qt5 gsettings-desktop-schemas networkmanager

          cd /w
          ISO="kibaos-v${RUN_NUM}"

          echo "=== Configuring archiso profile ==="
          cp -r /usr/share/archiso/configs/releng/ kiba-profile
          cd kiba-profile



          # Manual Compilation of Cutefish DE
          echo "=== Compiling Cutefish DE ==="
          mkdir -p src && cd src
          for REPO in fishui libcutefish core dock launcher statusbar settings wallpapers icons terminal filemanager calculator screenshot; do
            git clone --depth 1 https://github.com/cutefishos/${REPO}.git
            cd ${REPO}
            mkdir build && cd build
            cmake -DCMAKE_INSTALL_PREFIX=/usr -GNinja ..
            ninja
            DESTDIR=../../../../airootfs ninja install
            cd ../..
          done
          cd ..

          # Update packages list (only base and necessary system tools)
          cat > packages.x86_64 << 'PACKAGES'
          archlinux-keyring
          base
          linux
          linux-headers
          linux-firmware
          mkinitcpio
          grub
          efibootmgr
          networkmanager
          git
          wget
          curl
          sudo
          zsh
          zsh-autosuggestions
          zsh-syntax-highlighting
          starship
          fastfetch
          eza
          bat
          btop
          ripgrep
          fd
          tealdeer
          duf
          ncdu
          micro
          nano
          fzf
          yt-dlp
          calamares
          inter-font
          ttf-jetbrains-mono
          noto-fonts-emoji
          discover
          flatpak
          xdg-desktop-portal-kde
          xdg-desktop-portal-gtk
          chromium
          vlc
          gparted
          kate
          dolphin
          konsole
          spectacle
          ark
          plymouth
          ntfs-3g
          exfatprogs
          cryptsetup
          nextcloud-client
          erofs-utils
          PACKAGES

          # Immutable Architecture: Read-only root with OverlayFS for /etc and /var
          mkdir -p airootfs/etc
          cat > airootfs/etc/fstab << 'FSTAB'
          LABEL=KIBAOS_ROOT / erofs defaults,ro 0 0
          tmpfs /etc tmpfs defaults,noatime,mode=755 0 0
          tmpfs /var tmpfs defaults,noatime,mode=755 0 0
          FSTAB

          # OOBE Setup
          mkdir -p airootfs/etc/calamares/modules
          cat > airootfs/etc/calamares/settings.conf << 'CALA_SETTINGS'
          ---
          modules-search: [ local ]
          instances:
          - id: fullscreen
            module: welcome
            config: welcome_fullscreen.conf
          sequence:
          - show:
            - welcome@fullscreen
            - locale
            - keyboard
            - partition
            - users
            - summary
          - exec:
            - partition
            - mount
            - unpackfs
            - machineid
            - fstab
            - locale
            - keyboard
            - localecfg
            - users
            - displaymanager
            - networkcfg
            - hwclock
            - services-systemd
            - bootloader
            - umount
          - show:
            - finished
          branding: kibaos
          prompt-install: false
          dont-chroot: false
          CALA_SETTINGS

          # Clean Welcome Script (No Emojis)
          mkdir -p airootfs/usr/local/bin
          cat > airootfs/usr/local/bin/kiba-welcome << 'WELCOME'
          #!/bin/bash
          while true; do
            CHOICE=$(zenity --list --title="Welcome to KibaOS" \
              --window-icon="/usr/share/kibaos/logo.png" \
              --text="Welcome to KibaOS. What would you like to do?" \
              --column="Tag" --column="Action" --column="Description" \
              "install" "Install KibaOS" "Install the system permanently to your disk" \
              "browser" "Web Browser" "Browse the internet" \
              "store" "Software Center" "Discover and install new applications" \
              "terminal" "Open Terminal" "Use Meta+T to launch" \
              "files" "File Manager" "Use Meta+E to browse" \
              "settings" "System Settings" "Configure your desktop and hardware" \
              "screenshot" "Screen Capture" "Use Print to capture" \
              "info" "System Information" "View technical system details" \
              "shortcuts" "Keyboard Shortcuts" "View useful desktop shortcuts" \
              "wiki" "Online Wiki" "Read the technical documentation" \
              --hide-column=1 --print-column=1 \
              --width=450 --height=500 --ok-label="Launch" --cancel-label="Close" 2>/dev/null)

            [ -z "$CHOICE" ] && break

            case "$CHOICE" in
              "install")
                sudo calamares &
                break
                ;;
              "browser")
                chromium &
                break
                ;;
              "store")
                discover &
                break
                ;;
              "terminal")
                konsole &
                break
                ;;
              "files")
                dolphin &
                break
                ;;
              "settings")
                cutefish-settings &
                break
                ;;
              "screenshot")
                spectacle &
                break
                ;;
              "info")
                (fastfetch | zenity --text-info --title="KibaOS System Information") &
                ;;
              "shortcuts")
                (zenity --list --title="KibaOS Shortcuts" \
                  --column="Action" --column="Shortcut" \
                  "Application Menu" "Meta" \
                  "Terminal" "Meta + T" \
                  "Search" "Meta + Space" \
                  "File Manager" "Meta + E" \
                  --ok-label="Close" --cancel-label="Close" 2>/dev/null) &
                ;;
              "wiki")
                chromium "https://github.com/WolfTech-Innovations/Kiba/blob/main/WIKI.md" &
                break
                ;;
            esac
          done
          WELCOME
          chmod +x airootfs/usr/local/bin/kiba-welcome

          # Finalize and Build
          cd ..
          mkarchiso -v -w work -o out kiba-profile/

          if [ -f out/*.iso ]; then
            mv out/*.iso "${ISO}.iso"
            sha256sum "${ISO}.iso" > "${ISO}.iso.sha256"
          else
            echo "ERROR: ISO file not found!"
            exit 1
          fi
          BUILD_SCRIPT_EOF
          chmod +x build.sh

      - name: Run build in Docker
        run: |
          docker run --rm --privileged \
            -v "$PWD:/w" \
            -e RUN_NUM="${{ github.run_number }}" \
            archlinux:latest \
            /bin/bash /w/build.sh

      - name: Upload to SourceForge
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SF_PASS: ${{ secrets.SF_PASS }}
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SF_PASS" ]; then
            echo "SourceForge credentials not configured. Skipping upload."
            exit 0
          fi
          sudo apt update && sudo apt install -y sshpass rsync
          for iso_file in *.iso; do
            [ -f "$iso_file" ] || continue
            echo "Uploading $iso_file to SourceForge..."
            sshpass -p "$SF_PASS" rsync -avP \
              -e "ssh -o StrictHostKeyChecking=no" \
              "$iso_file" \
              "$SF_USER@frs.sourceforge.net:/home/frs/project/kibaos/"
          done
