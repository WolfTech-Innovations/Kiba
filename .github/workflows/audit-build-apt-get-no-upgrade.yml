name: Audit Build Apt Get No Upgrade

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for apt-get upgrade
        run: |
          # Robust check for apt-get upgrade/dist-upgrade, ignoring comments
          grep -rnE "^[^#]*apt-get .*(upgrade|dist-upgrade)" scripts/ && (echo "Avoid using apt-get upgrade; it makes builds non-deterministic" && exit 1) || exit 0
