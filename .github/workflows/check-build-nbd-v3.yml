name: Check Build NBD
on:
  push:
    paths:
      - .github/workflows/kiba.yml
  pull_request:
    paths:
      - .github/workflows/kiba.yml
jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Verify Disconnect
      run: grep -q "qemu-nbd --connect" .github/workflows/kiba.yml && grep -q "qemu-nbd --disconnect" .github/workflows/kiba.yml
    timeout-minutes: 5
