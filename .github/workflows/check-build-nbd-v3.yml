name: Check Build NBD
on:
  push:
    paths:
      - scripts/kibatv_build.sh
  pull_request:
    paths:
      - scripts/kibatv_build.sh
jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Verify Disconnect
      run: grep -q "qemu-nbd --connect" scripts/kibatv_build.sh && grep -q "qemu-nbd --disconnect" scripts/kibatv_build.sh
    timeout-minutes: 5
