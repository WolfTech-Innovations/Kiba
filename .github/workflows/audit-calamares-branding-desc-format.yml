name: Audit Calamares Branding Desc Format
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate Branding Desc
        run: |
          sed -n "/cat > config\/includes\.chroot\/etc\/calamares\/branding\/kibaos\/branding\.desc << 'BRANDING'/,/BRANDING/p" .github/workflows/kiba.yml | grep -v "BRANDING" > branding.desc
          [ -s branding.desc ] || (echo "branding.desc not found" && exit 1)
          grep -q "productName: \"KibaOS\"" branding.desc || (echo "Invalid product name in branding.desc" && exit 1)
