name: Audit Calamares Branding Desc Format
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Branding Desc
        run: |
          sed -n "/cat > config\/includes\.chroot\/etc\/calamares\/branding\/kibaos\/branding\.desc << 'BRANDING'/,/BRANDING/p" .github/workflows/kiba.yml | grep -v "BRANDING" > branding.desc
          if [ ! -s branding.desc ]; then
            echo "branding.desc not found"
            exit 1
          fi
          if ! grep -q "productName: \"KibaOS\"" branding.desc; then
            echo "Invalid product name in branding.desc"
            exit 1
          fi
