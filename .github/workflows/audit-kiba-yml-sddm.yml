name: Audit Kiba YML SDDM
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check SDDM service
        run: |
          if ! grep -q "sddm.service" .github/workflows/kiba.yml; then
            echo "Error: .github/workflows/kiba.yml must enable sddm.service."
            exit 1
          fi
