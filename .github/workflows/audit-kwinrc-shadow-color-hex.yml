name: Audit KWinRC Shadow Color Hex
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify Dracula Shadow Color
        run: |
          grep -q "ShadowColor=189,147,249" .github/workflows/kiba.yml || (echo "ShadowColor must be Dracula Purple (189,147,249)" && exit 1)
