name: Audit Repo Forbidden Filenames

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check forbidden files
        run: |
          find . -iname "Thumbs.db" -o -iname ".DS_Store" | grep . && exit 1 || exit 0
