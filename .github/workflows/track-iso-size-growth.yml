name: Track ISO Size Growth
on:
  workflow_run:
    workflows: ["KibaOS Build"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  track-size:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Log
        run: echo "Tracking ISO size..."
