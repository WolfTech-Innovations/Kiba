name: "KibaOS ISO Label Enforcement"
on:
  pull_request:
    paths: [ 'build.sh' ]

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check ISO label
        run: "grep -q 'iso_label=\"KIBAOS\"' build.sh"
