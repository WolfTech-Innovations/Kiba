name: Audit Calamares Module YAML Syntax
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate Module YAML
        run: |
          grep -oP "cat > /etc/calamares/modules/\K[^ ]+\.conf" .github/workflows/kiba.yml | while read -r conf; do
            sed -n "/cat > \/etc\/calamares\/modules\/$conf << '.*'/,/^[A-Z_]\+$/p" .github/workflows/kiba.yml | grep -vE "^cat |^[A-Z_]+\$" > "$conf"
            [ -s "$conf" ] || (echo "$conf not found or empty" && exit 1)
            python3 -c "import yaml; yaml.safe_load(open('$conf'))" || (echo "Invalid YAML in $conf" && exit 1)
          done
