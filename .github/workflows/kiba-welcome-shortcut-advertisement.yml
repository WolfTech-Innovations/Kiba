name: Kiba Welcome Shortcut Ads

on:
  push:
    paths:
      - "scripts/kibaos_build.sh"
  pull_request:
    paths:
      - "scripts/kibaos_build.sh"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Kiba Welcome Shortcut Ads
        run: |
          grep -q "kiba-welcome" scripts/kibaos_build.sh && ! grep -q "Meta+T" scripts/kibaos_build.sh && { echo "Warning: Meta+T not advertised"; } || true
