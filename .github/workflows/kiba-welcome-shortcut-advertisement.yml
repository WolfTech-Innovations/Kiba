name: Kiba Welcome Shortcut Ads

on:
  push:
    paths:
      - "scripts/kibatv_build.sh"
  pull_request:
    paths:
      - "scripts/kibatv_build.sh"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
heckout@11bd71901bbe5b1630ceea73d27597364c9af683/a         with:
          persist-credentials: false

      - name: Kiba Welcome Shortcut Ads
        run: |
          grep -q "kiba-welcome" scripts/kibatv_build.sh && ! grep -q "Meta+T" scripts/kibatv_build.sh && { echo "Warning: Meta+T not advertised"; } || true
