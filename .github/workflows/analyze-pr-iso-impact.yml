name: Analyze PR ISO Impact
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'build.sh'
jobs:
  impact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Analyze impact
        shell: bash
        run: |
          # Count lines added to packages.x86_64
          ADDED_PKGS=$(git diff origin/main -- build.sh | grep "^+ " | grep -c "PACKAGES" || true)
          echo "PR adds approximately $ADDED_PKGS packages to the ISO."
