name: "Issue Welcome Message"
on:
  issues:
    types: [ opened ]

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Welcome comment
        uses: actions/github-script@v7
        with:
          script: "github.rest.issues.createComment({issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body: 'Thanks for opening an issue!'})"
