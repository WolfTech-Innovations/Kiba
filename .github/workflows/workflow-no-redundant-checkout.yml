name: Redundant Checkout Audit
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for redundant checkouts
        run: |
          for file in .github/workflows/*.yml; do
            count=$(grep -c "uses: actions/checkout" "$file")
            if [ "$count" -gt 1 ]; then
              echo "Error: $file has redundant checkouts"
              exit 1
            fi
          done
