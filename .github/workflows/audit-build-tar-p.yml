name: Audit Build Tar P

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for tar preserve permissions
        run: |
          # Robust check for tar without -p or --preserve-permissions
          grep -rnE "^[^#]*tar " scripts/ | grep -vE "(\-p|\-\-preserve\-permissions)" && (echo "Use '-p' with 'tar' in build scripts to preserve permissions" && exit 1) || exit 0
