name: "Audit Markdown Fenced Code Blocks"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          ! grep -r '^    ' . --include='*.md' --exclude-dir=node_modules | grep . || (echo "::error::Use fenced code blocks instead of indentation" && exit 1)
