name: Audit Build Pmbootstrap Config Jobs

on:
  push:
    paths:
      - 'scripts/kibaos_build.sh'
  pull_request:
    paths:
      - 'scripts/kibaos_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Pmbootstrap Jobs
        run: |
          if ! grep -q "pmbootstrap .* config jobs 4" scripts/kibaos_build.sh; then
            echo "Error: pmbootstrap config jobs should be set to 4 for parallelism"
            exit 1
          fi
