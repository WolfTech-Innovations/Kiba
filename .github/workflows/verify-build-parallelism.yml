name: Verify Build Parallelism

on:
  push:
    paths:
      - "scripts/kibatv-build.sh"
  pull_request:
    paths:
      - "scripts/kibatv-build.sh"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify Build Parallelism
        run: |
          grep -E "make |cmake --build" scripts/kibatv-build.sh | grep -vE "\-j|\-\-parallel" && { echo "Error: missing -j flag"; false; } || true
