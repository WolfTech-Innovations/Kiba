name: "Audit: Wayland Sessions"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Wayland Sessions"
        run: |
          find . -path "*/usr/share/wayland-sessions/*.desktop" | grep . || { echo 'Error: No Wayland session files found'; exit 1; }
