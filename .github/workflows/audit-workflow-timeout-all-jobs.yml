name: Audit Workflow Timeout All Jobs
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for timeout-minutes in all jobs
        run: |
          # Simplified check for timeout-minutes presence
          if grep -L "timeout-minutes:" .github/workflows/*.yml; then
             echo "Error: Every job in GitHub Action workflows must have a timeout-minutes property defined."
             exit 1
          fi
