name: Audit Shell Script Pipefail

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Shell Script Pipefail
        run: bash scripts/repo_audit.sh --check shell_script_pipefail
        shell: bash
