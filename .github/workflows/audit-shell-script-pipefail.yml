name: Audit Shell Script Pipefail
on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check set -o pipefail
        run: |
          if [ -f "build.sh" ]; then
            if ! grep -q "set -o pipefail" build.sh; then
              echo "Error: build.sh must include 'set -o pipefail' for reliable CI."
              exit 1
            fi
          fi
