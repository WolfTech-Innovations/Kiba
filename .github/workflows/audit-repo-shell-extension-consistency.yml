name: "Audit Repo Shell Extension"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check .sh extension
        run: |
          [ "$(find scripts/ -type f ! -name '*.sh' ! -name '.*' | wc -l)" -eq 0 ]
        shell: bash
