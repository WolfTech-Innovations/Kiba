name: Audit Repo Shell Extension Consistency
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Enforce .sh extension for shell scripts
        shell: bash
        run: |
          find . -type f -not -path '*/.*' -not -path '*/node_modules/*' -exec file {} + | grep "shell script" | grep -v "\.sh" | grep -vE "build\.sh|repo_audit\.sh" && exit 1 || exit 0
