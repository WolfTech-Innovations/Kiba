name: Audit Repo Shell Extension Consistency
on:
  push:
    paths: [ 'scripts/**' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify extension
        run: |
          if find scripts -type f ! -name "*.sh" ! -name ".*" | grep -q "."; then
            echo "Error: Found scripts without .sh extension."
            exit 1
          fi
        shell: bash
