name: Audit Workflow Job Permissions Only
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          if grep -r "permissions: write-all" .github/workflows/; then
            echo "ERROR: Use of permissions: write-all is forbidden. Use least-privilege."
            exit 1
          fi
