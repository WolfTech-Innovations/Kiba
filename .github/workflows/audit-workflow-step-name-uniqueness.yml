name: Audit Workflow Step Name Uniqueness
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for duplicate step names within jobs
        run: |
          for file in .github/workflows/*.yml; do
            # Use yq to extract step names per job and check for duplicates
            bad_jobs=$(yq '.jobs | to_entries | .[] | select((.value.steps | map(.name) | .[] | select(. != null)) as $names | ($names | unique | length) != ($names | length)) | .key' "$file")
            if [ -n "$bad_jobs" ]; then
              echo "Duplicate step names found in $file in jobs: $bad_jobs"
              exit 1
            fi
          done
