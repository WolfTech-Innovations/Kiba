name: Audit Workflow Step Name Uniqueness
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for duplicate step names within jobs
        run: |
          for file in .github/workflows/*.yml; do
            # Use yq to check uniqueness PER JOB - simplified for compatibility
            bad_jobs=$(yq '.jobs | to_entries | .[] | select((.value.steps | map(.name) | unique | length) < (.value.steps | map(.name) | length)) | .key' "$file")
            if [ -n "$bad_jobs" ] && [ "$bad_jobs" != "null" ]; then
              echo "Duplicate step names found in $file in jobs: $bad_jobs"
              exit 1
            fi
          done
