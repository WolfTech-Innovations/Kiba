name: Audit Workflow Step Name Uniqueness
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for duplicate step names
        run: |
          for file in .github/workflows/*.yml; do
            # Simple check: use grep and uniq to find duplicates in step names
            dupes=$(grep "name:" "$file" | sed 's/.*name: //g' | sort | uniq -d)
            if [ -n "$dupes" ]; then
              # Only fail if they are actually in the same job, but this is a good enough audit for this repo
              echo "Error: $file contains potential duplicate step names: $dupes"
            fi
          done
