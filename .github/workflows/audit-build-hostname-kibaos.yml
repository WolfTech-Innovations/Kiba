name: Audit Build Hostname Kibaos

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Hostname
        run: |
          # Check for hostname setting in multiple places
          if ! grep -q "kibaos-live" .github/workflows/kiba.yml; then
            echo "Error: Hostname kibaos-live should be defined in the build script"
            exit 1
          fi
          if ! grep -q "hostname kibaos" .github/workflows/kiba.yml; then
            echo "Error: pmbootstrap hostname should be set to kibaos"
            exit 1
          fi
