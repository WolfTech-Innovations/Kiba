name: Audit Build Plymouth Module Script

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Plymouth Module
        run: |
          if ! grep -q "ModuleName=script" .github/workflows/kiba.yml; then
            echo "Error: Plymouth module should be set to script"
            exit 1
          fi
