name: Check Branding Colors
on:
  push:
paths:
- .github/workflows/kiba.yml
  pull_request:
paths:
- .github/workflows/kiba.yml
jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Check Hex
      run: grep "#282a36" .github/workflows/kiba.yml && grep "#bd93f9" .github/workflows/kiba.yml
    timeout-minutes: 5
