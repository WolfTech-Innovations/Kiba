name: Check Branding Colors
on:
  push:
paths:
- scripts/kibatv-build.sh
  pull_request:
paths:
- scripts/kibatv-build.sh
jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      with:
        persist-credentials: false
    - name: Check Hex
      run: grep "#282a36" scripts/kibatv-build.sh && grep "#bd93f9" scripts/kibatv-build.sh
    timeout-minutes: 5
