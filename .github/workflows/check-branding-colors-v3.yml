name: Check Branding Colors
on:
  push:
    paths:
      - 'branding/*'
  pull_request:
    paths:
      - 'branding/*'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Colors
        run: ls branding/
