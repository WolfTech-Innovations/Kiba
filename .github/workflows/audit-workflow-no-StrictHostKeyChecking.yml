name: Audit Workflow No StrictHostKeyChecking
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for StrictHostKeyChecking=no
        run: |
          if grep -rn "StrictHostKeyChecking=no" .github/workflows/; then
             echo "Error: Do not disable host key checking. Use ssh-keyscan instead."
             exit 1
          fi
