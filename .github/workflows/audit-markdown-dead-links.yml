name: Audit Markdown Dead Links
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check for empty Markdown link targets
        run: |
          ! grep -rE "\[[^]]*\]\(\)" . --include="*.md"
