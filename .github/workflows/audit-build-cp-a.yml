name: Audit Build Cp A

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for cp archive
        run: |
          # Robust check for cp without -a, -p, or --archive
          grep -rnE "^[^#]*cp " scripts/ | grep -vE "(\-a|\-p|\-\-archive|\-\-preserve)" && (echo "Use 'cp -a' or 'cp -p' in build scripts to preserve metadata" && exit 1) || exit 0
