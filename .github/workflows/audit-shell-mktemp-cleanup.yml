name: Audit Shell Mktemp Cleanup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit_shell_mktemp_cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure mktemp is followed by trap
        run: |
          find . -name "*.sh" -exec grep -l "mktemp" {} + | xargs grep -L "trap" && exit 1 || exit 0
