name: "Audit Shell Mktemp Cleanup"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check mktemp trap
        run: |
          grep -r 'mktemp' . --include='*.sh' | xargs -I {} grep -L 'trap' {} | grep 'sh' && false || true
        shell: bash
