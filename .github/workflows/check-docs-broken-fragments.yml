name: Check Docs Broken Fragments

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check_docs_broken_fragments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect broken Markdown fragments
        run: |
          grep -rE "\]\(#[^)]+\)" . --include="*.md" | while read -r line; do frag=$(echo "$line" | sed 's/.*(#//;s/).*//'); grep -q "^#.*$frag" "$(echo "$line" | cut -d: -f1)" || echo "$line"; done | grep . && exit 1 || exit 0
