name: Audit Build Sddm Autologin User

on:
  push:
    paths:
      - 'scripts/kibatv_build.sh'
  pull_request:
    paths:
      - 'scripts/kibatv_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Sddm Autologin User
        run: |
          if ! grep -q "User=user" scripts/kibatv_build.sh; then
            echo "Error: SDDM autologin user should be set to 'user'"
            exit 1
          fi
