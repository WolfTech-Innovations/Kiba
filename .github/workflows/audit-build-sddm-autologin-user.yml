name: Audit Build Sddm Autologin User

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Sddm Autologin User
        run: |
          if ! grep -q "User=user" .github/workflows/kiba.yml; then
            echo "Error: SDDM autologin user should be set to 'user'"
            exit 1
          fi
