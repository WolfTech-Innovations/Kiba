name: Audit Workflow Pip Break Packages
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check pip flags
        run: |
          if grep -rn "pip install" .github/workflows/ | grep -v "\-\-break\-system\-packages"; then
            echo "Error: pip install commands must use --break-system-packages to accommodate PEP 668."
            exit 1
          fi
