name: Shell Script No Useless Cat
on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for useless cat
        run: |
          grep -rnE "cat[[:space:]]+[^|]+[[:space:]]*\|[[:space:]]*grep" . --include="*.sh" && { echo "Useless use of cat found; use grep directly"; exit 1; } || echo "No useless cat usage found"
