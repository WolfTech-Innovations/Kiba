name: Audit Build Dracula Hex

on:
  push:
    paths:
      - "scripts/kibatv_build.sh"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check Dracula Colors
        run: |
          grep "#282a36" scripts/kibatv_build.sh
