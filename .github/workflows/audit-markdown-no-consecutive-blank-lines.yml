name: Audit Markdown No Consecutive Blank Lines

on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check blank lines
        run: |
          python3 -c '
          import os, sys
          failed = False
          for root, _, files in os.walk("."):
              for f in files:
                  if not f.endswith(".md"): continue
                  path = os.path.join(root, f)
                  with open(path) as s:
                      if "\n\n\n" in s.read():
                          print(f"Failure in {path}")
                          failed = True
          if failed: sys.exit(1)
          '
