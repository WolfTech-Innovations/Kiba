name: Audit Desktop UX Standards
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check Palette and Fonts
        run: |
          grep "#bd93f9" .github/workflows/kiba.yml
          grep "Inter" .github/workflows/kiba.yml
          grep "JetBrains Mono" .github/workflows/kiba.yml
