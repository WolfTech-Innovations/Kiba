name: Audit Shell Test Operator Consistency
on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Test Keyword
        run: |
          if grep -rn "test " .; then
            echo "Error: Use [ ] instead of the 'test' command for consistency."
            exit 1
          fi
      - name: Check Double Brackets
        run: |
          if grep -rn "\[\[" .; then
            echo "Error: Use single brackets [ ] instead of [[ ]] for POSIX compliance unless bash-specific features are required."
            exit 1
          fi
