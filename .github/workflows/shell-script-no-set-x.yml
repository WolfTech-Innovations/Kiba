name: Shell Script No Set X
on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for set -x
        run: |
          grep -rnE "^[[:space:]]*set -x" . --include="*.sh" && { echo "set -x found in shell scripts; remove debugging before commit"; exit 1; } || echo "No set -x usage found"
