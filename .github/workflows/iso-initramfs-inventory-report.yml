name: ISO Initramfs Inventory Report
on:
  workflow_run:
    workflows: ["KibaOS Build"]
    types: [completed]
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Download ISO Artifact
        uses: actions/download-artifact@v4
        with:
          name: kibaos-iso
          path: .
        continue-on-error: true

      - name: Audit Initramfs
        run: |
          ISO_FILE=$(ls *.iso | head -1)
          [ -z "$ISO_FILE" ] && echo "No ISO found" && exit 0

          sudo apt-get update && sudo apt-get install -y p7zip-full

          mkdir -p iso_content
          7z x "$ISO_FILE" -oiso_content live/initrd.img*

          INITRD=$(find iso_content -name "initrd.img*" | head -1)
          [ -z "$INITRD" ] && echo "No initrd found" && exit 0

          echo "### Initramfs Inventory Report" >> $GITHUB_STEP_SUMMARY
          SIZE=$(du -h "$INITRD" | cut -f1)
          echo "- **Compressed Size:** $SIZE" >> $GITHUB_STEP_SUMMARY

          # Try to list contents
          echo "#### Top 20 Files by Size in Initrd" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          lsinitramfs "$INITRD" | sort | tail -n 20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
