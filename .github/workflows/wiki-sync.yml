name: Wiki Synchronization
on:
  push:
    paths:
      - "docs/*.md"
      - "scripts/sync_wiki.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Sync WIKI.md
        run: python3 scripts/sync_wiki.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add WIKI.md
          if git commit -m "docs: sync WIKI.md [skip ci]"; then
            git push
          fi
