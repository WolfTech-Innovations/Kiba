name: Bandit (Python Security)
on:
  push:
    paths:
      - '**.py'
  pull_request:
    paths:
      - '**.py'
permissions:
  contents: read
jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r . -ll
