name: Audit Workflow No Absolute Script Paths
on:
  push:
    paths: [ '.github/workflows/*.yml' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check absolute paths
        run: |
          if grep -r "/home/runner/work" .github/workflows/; then
            echo "Error: Found hardcoded runner paths."
            exit 1
          fi
        shell: bash
