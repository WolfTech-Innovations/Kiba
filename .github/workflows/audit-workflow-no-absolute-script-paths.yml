name: Audit Workflow No Absolute Script Paths

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Workflow No Absolute Script Paths
        run: bash scripts/repo_audit.sh --check workflow_no_absolute_script_paths
        shell: bash
