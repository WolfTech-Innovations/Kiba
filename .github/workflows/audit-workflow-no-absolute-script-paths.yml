name: Audit Workflow No Absolute Script Paths
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          if grep -r "run: /" .github/workflows/ | grep ".sh"; then
            echo "ERROR: Absolute paths to scripts found in workflows. Use relative paths."
            exit 1
          fi
