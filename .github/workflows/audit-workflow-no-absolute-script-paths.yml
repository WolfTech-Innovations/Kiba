name: Audit Workflow No Absolute Script Paths

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Audit Workflow No Absolute Script Paths
        shell: bash
        run: |
          bash scripts/repo_audit.sh --workflow-no-absolute-script-paths
