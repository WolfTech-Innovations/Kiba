name: Audit ksplashrc Theme

on:
  push:
    paths:
      - 'scripts/kibatv-build.sh'
  pull_request:
    paths:
      - 'scripts/kibatv-build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check ksplashrc
        run: |
          grep -q "com.kibatv.watchdogs.desktop" scripts/kibatv-build.sh || (echo "Incorrect splash theme" && exit 1)
