name: "Audit Workflow Script Presence"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check check_workflows.py
        run: |
          [ -f 'check_workflows.py' ]
        shell: bash
