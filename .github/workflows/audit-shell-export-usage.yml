name: Audit Shell Export Usage

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Check export usage
        run: |
          grep -rnE "\bexport\s+[a-zA-Z_][a-zA-Z0-9_]*=" . --include="*.sh" && (echo "Split export and assignment for portability: VAR=val; export VAR" && exit 1) || exit 0
