name: Audit Markdown Header Punctuation

on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Run Markdown Audit
        shell: bash
        run: |
          if grep -rnE "^#+ .*[.:;?]$" . --include="*.md"; then
            echo "Error: Headers should not end with trailing punctuation"
            exit 1
          fi
