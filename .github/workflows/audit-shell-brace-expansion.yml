name: Audit Shell Brace Expansion

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Check variable bracing
        run: |
          grep -rnE "\$[a-zA-Z_][a-zA-Z0-9_]*" . --include="*.sh" | grep -vE "\$\{[a-zA-Z_]" && (echo "Use \${VAR} instead of \$VAR for clarity" && exit 1) || exit 0
