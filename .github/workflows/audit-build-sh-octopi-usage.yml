name: Audit Build SH Octopi Usage
on:
  push:
    paths:
      - 'build.sh'
  pull_request:
    paths:
      - 'build.sh'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Ensure octopi is not used
        shell: bash
        run: |
          ! grep -qi 'octopi' build.sh
