name: Audit Build SH Octopi Usage
on:
  push:
    paths: [ 'build.sh' ]
  pull_request:
    paths: [ 'build.sh' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Octopi
        run: |
          if ! grep -q "Name=KibaOS Software" build.sh; then
            echo "Error: Octopi branding missing."
            exit 1
          fi
        shell: bash
