name: "Audit: Initcpio Hooks"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Initcpio Hooks"
        run: |
          find . -name "mkinitcpio.conf" | grep . || { echo 'Error: mkinitcpio configuration missing'; exit 1; }
