name: Audit Shell Bash N
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify shell script syntax using bash -n
        run: |
          find . -name "*.sh" -exec bash -n {} +
