name: Zsh Extendedglob Safety

on:
  push:
    paths:
      - "scripts/kibaos_build.sh"
  pull_request:
    paths:
      - "scripts/kibaos_build.sh"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Zsh Extendedglob Safety
        run: |
          grep -q "(#q" scripts/kibaos_build.sh && ! grep -q "setopt extendedglob" scripts/kibaos_build.sh && { echo "Error: missing setopt"; false; } || true
