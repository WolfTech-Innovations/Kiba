name: Audit Build Awk V

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for awk variable assignment
        run: |
          # Robust check for awk using shell variables directly instead of -v
          grep -rnE "^[^#]*awk .*\$" scripts/ | grep -v "\-v" && (echo "Use 'awk -v' for variable assignment instead of shell interpolation" && exit 1) || exit 0
