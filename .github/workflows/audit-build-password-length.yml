name: Audit Build Password Length

on:
  push:
    paths:
      - 'scripts/kibatv_build.sh'
  pull_request:
    paths:
      - 'scripts/kibatv_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check password length
        run: |
          grep "pmbootstrap install" scripts/kibatv_build.sh | grep -P -- "--password .{12,}" || (echo "Password too short or missing" && exit 1)
