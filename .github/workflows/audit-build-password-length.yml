name: Audit Build Password Length

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check password length
        run: |
          grep "pmbootstrap install" .github/workflows/kiba.yml | grep -P -- "--password .{12,}" || (echo "Password too short or missing" && exit 1)
