name: Audit Build Mkdir M

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
        with:
          persist-credentials: false
      - name: Check for mkdir mode
        run: |
          # Robust check for mkdir without -m or --mode
          grep -rnE "^[^#]*mkdir " scripts/ | grep -vE "(\-m|\-\-mode)" && (echo "Specify explicit permissions with 'mkdir -m' in build scripts" && exit 1) || exit 0
