name: Audit Repo No Emojis
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for emojis
        run: |
          # Targeting common emoji ranges and :emoji: shortcodes
          # Skips vendor directories if any
          if grep -rnE "[\x{1F300}-\x{1F64F}\x{1F680}-\x{1F6FF}\x{2600}-\x{26FF}\x{2700}-\x{27BF}]|:[a-z0-9_]+:" . --exclude-dir=".git" --exclude="pnpm-lock.yaml"; then
            echo "Error: Emojis are strictly forbidden in this repository to maintain professional design."
            exit 1
          fi
