name: Check TODO Priority Enforcement
true:
  push:
    paths:
    - scripts/*.sh
    - jules_auto_fixer.py
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Scan TODOs
      run: '# TODOs should have a priority: TODO(low), TODO(high), etc.

        grep -rn "[T]ODO" . | grep -vE "TODO\((low|med|high|critical)\)" && exit 1 ||
        exit 0

        '
    timeout-minutes: 5
