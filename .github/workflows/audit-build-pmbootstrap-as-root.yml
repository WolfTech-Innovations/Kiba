name: Audit Build Pmbootstrap As Root

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check For Pmbootstrap As Root
        run: |
          # Only check lines that invoke pmbootstrap, not comments or symlinks
          if grep "pmbootstrap " .github/workflows/kiba.yml | grep -vE "(ln -sf|#)" | grep -v "\-\-as-root"; then
            echo "Error: pmbootstrap should be run with --as-root in the build environment"
            exit 1
          fi
