name: Audit Polkit Gnome Path
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify polkit-gnome authentication agent path
        run: |
          grep -q '/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1' build.sh
