name: "Automated Dependency Updates"
on:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for updates
        run: "pnpm update"
