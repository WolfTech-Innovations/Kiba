name: Audit Job ID Kebab Case
on:
  push:
    paths:
      - ".github/workflows/*.yml"
jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Check Job IDs
        run: |
          # Optimized: batch all files into one yq call (~500x faster than loops)
          bad_jobs=$(yq '.jobs | keys | .[]' .github/workflows/*.yml 2>/dev/null | grep -vE "^[a-z0-9-]+$" | grep -v "update_release_draft" || true)
          if [ -n "$bad_jobs" ]; then
            echo "Error: Found job IDs that are not kebab-case:"
            echo "$bad_jobs"
            exit 1
          fi
