name: Analyze PR Size
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR size
        shell: bash
        run: |
          # Count lines changed
          LINES=$(git diff --shortstat origin/main | awk '{print $4 + $6}')
          echo "Lines changed: $LINES"
          if [ "$LINES" -gt 500 ]; then
             echo "WARN: Large PR detected ($LINES lines)"
          fi
