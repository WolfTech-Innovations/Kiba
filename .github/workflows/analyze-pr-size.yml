name: Analyze PR Size
on:
  pull_request:
permissions:
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze-size:
    runs-on: ubuntu-latest
    steps:
      - name: Size
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
        run: echo "PR Size additions: $ADDITIONS"
