name: Audit Build Idempotent Mkdir

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
        with:
          persist-credentials: false
      - name: Check for mkdir idempotency
        run: |
          # Robust check for mkdir without -p or --parents
          grep -rnE "^[^#]*mkdir " scripts/ | grep -vE "(\-p|\-\-parents)" && (echo "Use 'mkdir -p' for idempotency in build scripts" && exit 1) || exit 0
