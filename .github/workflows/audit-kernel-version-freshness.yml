name: Audit Kernel Version Freshness
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Kernel Freshness
        run: |
          LATEST=$(curl -s https://api.github.com/repos/psygreg/linux-psycachy/releases/latest | jq -r .tag_name)
          if ! grep -q "$LATEST" .github/workflows/kiba.yml; then
            echo "Kernel is not at latest version: $LATEST"
            exit 1
          fi
