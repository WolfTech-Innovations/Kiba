name: Check Notes Naming

on:
  push:
    paths:
      - "Notes/**/*"

jobs:
  audit:
    permissions:
      contents: write
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Naming
        run: |
          ls Notes/NTE-*.md
