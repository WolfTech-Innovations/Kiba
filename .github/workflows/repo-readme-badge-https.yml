name: Audit Repo Readme Badge Https

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit --audit-repo-readme-badge-https
        shell: bash
        run: |
          bash scripts/repo_audit.sh --audit-repo-readme-badge-https
