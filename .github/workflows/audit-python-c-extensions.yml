name: Audit Python C Extensions
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check for CSafeLoader in Python scripts
        run: |
          grep -r 'CSafeLoader' . --include="*.py"
