name: "KibaOS Package List Audit"
on:
  pull_request:
    paths: [ 'build.sh' ]

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for duplicates in PACKAGES
        run: "grep -A 100 'PACKAGES' build.sh | grep -v 'PACKAGES' | grep -v 'EOF' | sort | uniq -d | grep . && exit 1 || exit 0"
