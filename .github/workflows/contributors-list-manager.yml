name: Update Contributors
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update contributors
        run: |
          git log --format='%aN <%aE>' | sort -u > CONTRIBUTORS
