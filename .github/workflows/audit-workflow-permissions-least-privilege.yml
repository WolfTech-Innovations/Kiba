name: "Audit Workflow Permissions"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          grep -r 'permissions:' .github/workflows/ || (echo "::error::Workflows should have explicit permissions" && exit 1)
