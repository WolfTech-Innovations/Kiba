name: Audit Repo PNPM Exclusive
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for npm/yarn
        run: |
          if [ -f "package-lock.json" ] || [ -f "yarn.lock" ]; then
            echo "Error: pnpm is exclusively mandated for package management. Forbidden files found."
            exit 1
          fi
