name: "Audit Repo PNPM Exclusive"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for npm/yarn
        run: |
          [ ! -f 'package-lock.json' ] && [ ! -f 'yarn.lock' ]
        shell: bash
