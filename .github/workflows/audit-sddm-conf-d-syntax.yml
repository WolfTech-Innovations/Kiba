name: Audit SDDM Conf.d Syntax
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate SDDM Config
        run: |
          sed -n "/cat > \/etc\/sddm\.conf\.d\/autologin\.conf << 'SDDM_CONF'/,/SDDM_CONF/p" .github/workflows/kiba.yml | grep -v "SDDM_CONF" > sddm.conf
          [ -s sddm.conf ] || (echo "sddm.conf not found" && exit 1)
          grep -q "\[Autologin\]" sddm.conf || (echo "Missing Autologin section in SDDM config" && exit 1)
