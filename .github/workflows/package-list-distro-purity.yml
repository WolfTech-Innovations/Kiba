name: Package List Distro Purity

on:
  push:
    paths:
      - "scripts/kibatv_build.sh"
  pull_request:
    paths:
      - "scripts/kibatv_build.sh"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Package List Distro Purity
        run: |
          grep -E "<<.*PACKAGES" scripts/kibatv_build.sh -A 100 | grep -E "pacman|yum|apk" && { echo "Error: non-debian package"; false; } || true
