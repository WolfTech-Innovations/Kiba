name: Package List Distro Purity

on:
  push:
    paths:
      - ".github/workflows/kiba.yml"
  pull_request:
    paths:
      - ".github/workflows/kiba.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Package List Distro Purity
        run: |
          grep -E "<<.*PACKAGES" .github/workflows/kiba.yml -A 100 | grep -E "apt|yum|apk" && { echo "Error: non-arch package"; false; } || true
