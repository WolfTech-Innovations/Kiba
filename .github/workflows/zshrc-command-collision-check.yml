name: Zshrc Command Collision Check

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

permissions:
  contents: read

concurrency:
  group: zsh-collision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collision-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit Aliases
        run: |
          # Extract aliases from kiba.yml and check if they overwrite critical binaries
          ALIASES=$(grep -oP "alias \K[^=]+" .github/workflows/kiba.yml | sort -u)
          CRITICAL="ls cat grep find sed awk rm cp mv"
          for a in $ALIASES; do
            if echo "$CRITICAL" | grep -qw "$a"; then
              echo "Notice: Alias '$a' overwrites a standard system command."
            fi
          done
