name: README Badge Synchronizer

on:
  push:
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-badges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit Badges
        run: |
          # Ensure every workflow file has a corresponding badge in README.md
          # This is a report-only task for now
          for f in .github/workflows/*.yml; do
            WF_NAME=$(basename "$f" .yml)
            if ! grep -q "$WF_NAME/badge.svg" README.md; then
              echo "Missing badge in README for: $WF_NAME"
            fi
          done
