name: Audit Workflow Env Var Naming
on:
  push:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Env Variable Case
        run: |
          # Look for lowercase keys in env: blocks
          # This is a bit tricky with grep, but we can look for "  [a-z].*:" inside env blocks
          if grep -rA 5 "env:" .github/workflows/ | grep -E "^\s+[a-z].*:" | grep -vE "(node-version|python-version|java-version)"; then
            echo "Error: Environment variables in workflows should be UPPER_SNAKE_CASE."
            exit 1
          fi
