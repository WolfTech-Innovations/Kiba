name: Check Commit Message Quality
on:
  pull_request:
jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Verify Commits
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        for sha in $(git rev-list origin/"$BASE_REF"..HEAD); do
          subject=$(git log -1 --format=%s "$sha")
          if [ ${#subject} -lt 10 ]; then
            echo "Subject too short: $subject"
            exit 1
          fi
        done
    timeout-minutes: 5
