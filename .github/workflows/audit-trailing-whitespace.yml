name: Audit Trailing Whitespace
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check for trailing whitespace globally
        run: |
          ! grep -rI "[[:blank:]]$" . --exclude-dir=.git --exclude="pnpm-lock.yaml"
