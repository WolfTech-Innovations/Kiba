name: Audit Shell Builtins
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify use of shell parameter expansion in release notes script
        run: |
          grep -q '\${' scripts/save_release_notes.sh
