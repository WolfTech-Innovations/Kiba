name: Audit Markdown Inclusive Language

on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check inclusive language
        run: |
          grep -rnEi "\bblacklist\b|\bwhitelist\b|\bslave\b" . --include="*.md" && (echo "Use inclusive language in documentation" && exit 1) || exit 0
