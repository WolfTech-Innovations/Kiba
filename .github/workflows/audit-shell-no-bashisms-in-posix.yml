name: Audit Shell No Bashisms In Posix

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Run Shell Audit
        shell: bash
        run: |
          sh_scripts=$(find . -name "*.sh" -exec grep -l "^#!/bin/sh" {} +)
          if [ -n "$sh_scripts" ]; then
            if echo "$sh_scripts" | xargs grep -rnE "^[^#]*(\[\[|function |local )"; then
              echo "Error: Bashisms detected in /bin/sh script"
              exit 1
            fi
          fi
