name: Audit Embedded KSplash QML Syntax
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Splash QML
        run: |
          sed -n "/cat > \/usr\/share\/plasma\/look-and-feel\/com\.kibaos\.watchdogs\.desktop\/contents\/splash\/Splash\.qml << 'WATCHSPLASH'/,/WATCHSPLASH/p" .github/workflows/kiba.yml | grep -v "WATCHSPLASH" > Splash.qml
          if [ ! -s Splash.qml ]; then
            echo "Splash QML not found or empty"
            exit 1
          fi
          if ! grep -q "import QtQuick" Splash.qml; then
            echo "Missing QtQuick import in Splash.qml"
            exit 1
          fi
