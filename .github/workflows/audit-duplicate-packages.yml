name: "Audit: Duplicate Packages"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Duplicate Packages"
        run: |
          DUPS=$(grep "pacman -S" build.sh | sort | uniq -d); if [ -n "$DUPS" ]; then echo "Duplicate packages found: $DUPS"; exit 1; fi
