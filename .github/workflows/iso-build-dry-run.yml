name: "ISO Build Dry Run"
on:
  pull_request:
    branches: [ main ]
    paths: [ 'build.sh', 'scripts/**' ]

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Lint build.sh
        run: "shellcheck build.sh"
