name: Workflow Failure Trends

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Aggregate Failures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Aggregating recent workflow failures..."
          gh run list --status failure --limit 20
