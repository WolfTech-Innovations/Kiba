name: Audit Repo Dot Env Forbidden

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Check .env
        run: |
          find . -name ".env" | grep . && exit 1 || exit 0
