name: Audit Build Xargs 0

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for xargs null delimiter
        run: |
          # Robust check for xargs without -0 or --null when used with find
          grep -rnE "^[^#]*find .* -print0" scripts/ | xargs -I {} sh -c 'echo "{}" | grep -qE "xargs.*(\-0|\-\-null)" || (echo "Use xargs -0 with find -print0 for robust filename handling" && exit 1)'
