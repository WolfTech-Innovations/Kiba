name: Check EOF Newline
on:
  push:
  pull_request:
jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Verify Newline
      run: for f in $(find . -maxdepth 2 -name "*.md"); do tail -c 1 "$f" | read -r
        _ || exit 1; done
    timeout-minutes: 5
