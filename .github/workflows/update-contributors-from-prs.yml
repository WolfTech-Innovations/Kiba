name: Update Contributors from PRs
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4
      - name: Add Contributor
        env:
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          USER="$PR_USER"
          grep -q "$USER" ACKNOWLEDGMENTS.md || {
            echo "- $USER" >> ACKNOWLEDGMENTS.md
            git config user.name "KibaBot"
            git config user.email "bot@kibaos.org"
            git add ACKNOWLEDGMENTS.md
            git commit -m "docs: add $USER to acknowledgments [skip ci]"
            git push
          }
