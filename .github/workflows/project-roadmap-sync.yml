name: Project Roadmap Sync

on:
  milestone:
    types: [created, closed, edited]

permissions:
  contents: read

concurrency:
  group: roadmap-sync
  cancel-in-progress: true

jobs:
  check-roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Roadmap Section
        run: |
          if ! grep -q "## Roadmap" README.md; then
            echo "Error: README.md is missing a Roadmap section. Milestones cannot be synced."
            exit 1
          fi
          echo "Roadmap section found. Milestone events will trigger manual review for sync."
