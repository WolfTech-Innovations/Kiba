name: Audit Python Datetime Now Utc

on:
  push:
    paths:
      - '**.py'
  pull_request:
    paths:
      - '**.py'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run AST Audit
        shell: bash
        run: |
          cat << 'EOF' > audit.py
          import ast
          import sys
          import os

          def check_file(filepath):
              with open(filepath, 'r', encoding='utf-8') as f:
                  try:
                      tree = ast.parse(f.read())
                  except SyntaxError:
                      return []

              errors = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                      if node.func.attr == 'now' and (
                          (isinstance(node.func.value, ast.Name) and node.func.value.id == 'datetime') or
                          (isinstance(node.func.value, ast.Attribute) and node.func.value.attr == 'datetime')
                      ):
                          # Check for tzinfo or args
                          has_tz = False
                          if node.args: has_tz = True
                          for kw in node.keywords:
                              if kw.arg in ('tz', 'tzinfo'):
                                  has_tz = True
                          if not has_tz:
                              errors.append(f"{filepath}:{node.lineno}: datetime.now() called without timezone")
              return errors

          failed = False
          for root, _, files in os.walk('.'):
              for file in files:
                  if file.endswith('.py'):
                      errs = check_file(os.path.join(root, file))
                      if errs:
                          for e in errs: print(e)
                          failed = True
          if failed: sys.exit(1)
          EOF
          python3 audit.py
