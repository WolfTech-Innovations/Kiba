name: Audit Build SDDM Config

on:
  push:
    paths:
      - "scripts/kibatv-build.sh"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check SDDM Session
        run: |
          grep "Session=plasma-bigscreen" scripts/kibatv-build.sh
