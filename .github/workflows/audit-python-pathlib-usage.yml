name: Audit Python Pathlib Usage

on:
  push:
    paths:
      - '**.py'
  pull_request:
    paths:
      - '**.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for os.path usage
        run: |
          grep -rnE "\bos\.path\b" . --include="*.py" && (echo "Use pathlib instead of os.path" && exit 1) || exit 0
