name: Audit Repo Markdown Anchor Links
on:
  push:
    paths:
      - '**/*.md'
  pull_request:
    paths:
      - '**/*.md'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate internal markdown anchors
        shell: bash
        run: |
          BAD_ANCHORS=$(grep -rhE "\[[^]]+\]\(#[^)]+\)" . --include="*.md" | grep -vE "\(#[a-z0-9-]+\)" || true)
          if [ -n "$BAD_ANCHORS" ]; then
            echo "Malformed internal anchors (recommend #lowercase-kebab):"
            echo "$BAD_ANCHORS"
            exit 1
          fi
