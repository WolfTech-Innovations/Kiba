name: Audit Repo Markdown Anchor Links
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          ! grep -rhE "\\[[^]]+\\]\\(#[^)]+\\)" . --include="*.md" | grep -vE "\\(#[a-z0-9-]+\\)" | grep .
