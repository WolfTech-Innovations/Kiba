name: "Audit Repo Markdown Anchor Links"
on:
  push:
    paths:
      - "**.md"
  pull_request:
    paths:
      - "**.md"
  workflow_dispatch:

jobs:
  audit:
    name: "Audit markdown anchor format"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
      - name: "Verify internal anchor format"
        shell: bash
        run: |
          BAD_ANCHORS=$(grep -rhE "\[[^]]+\]\(#[^)]+\)" . --include="*.md" | grep -vE "\(#[a-z0-9-]+\)" || true)
          if [ -n "$BAD_ANCHORS" ]; then
            echo "Warning: Malformed internal anchors (recommend #lowercase-kebab):"
            echo "$BAD_ANCHORS"
          fi
