name: Audit Repo Markdown Anchor Links
on:
  push:
    paths: [ '**/*.md' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check anchors
        run: |
          BAD=$(grep -rhE "\[[^]]+\]\(#[^)]+\)" . --include="*.md" | grep -vE "\(#[a-z0-9-]+\)" || true)
          if [ -n "$BAD" ]; then
            echo "Warning: Malformed internal anchors found."
          fi
        shell: bash
