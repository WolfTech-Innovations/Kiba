name: Audit Repo Markdown Anchor Links
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit markdown anchors
        shell: bash
        run: |
          BAD_ANCHORS=$(grep -rhE "\[[^]]+\]\(#[^)]+\)" . --include="*.md" | grep -vE "\(#[a-z0-9-]+\)" || true)
          if [ -n "$BAD_ANCHORS" ]; then
            echo "WARN: Malformed internal anchors (recommend #lowercase-kebab):"
            echo "$BAD_ANCHORS"
          fi
