name: "Audit Repo Markdown Anchors"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check anchor format
        run: |
          ! grep -rhE '\[[^]]+\]\(#[^)]+\)' . --include='*.md' | grep -vE '\(#[a-z0-9-]+\)'
        shell: bash
