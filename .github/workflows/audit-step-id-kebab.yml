name: Audit Step ID Kebab Case
on:
  push:
    paths:
      - ".github/workflows/*.yml"
jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Check Step IDs
        run: |
          # Optimized: batch all files into one yq call (~500x faster than loops)
          bad_steps=$(yq '[.jobs[].steps[] | select(has("id")) | .id] | .[]' .github/workflows/*.yml | grep -vE "^[a-z0-9-]+$" || true)
          if [ -n "$bad_steps" ]; then
            echo "Error: Found Step IDs that are not kebab-case:"
            echo "$bad_steps"
            exit 1
          fi
