name: "Audit: Polkit Syntax"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Polkit Syntax"
        run: |
          find . -name "*.rules" -path "*/polkit-1/*" | grep . || { echo 'Error: Polkit rules missing'; exit 1; }
