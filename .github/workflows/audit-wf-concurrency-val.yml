name: Audit WF Concurrency Val

on:
  push:
    paths:
      - ".github/workflows/*.yml"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Concurrency
        run: |
          grep -r "concurrency:" .github/workflows/ | grep -v "\$\{{ github.workflow \}}" | grep -v "audit-wf" && false || true
