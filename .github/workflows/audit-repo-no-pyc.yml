name: Audit Repo No Pyc

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Repo No Pyc
        run: bash scripts/repo_audit.sh --check repo_no_pyc
        shell: bash
