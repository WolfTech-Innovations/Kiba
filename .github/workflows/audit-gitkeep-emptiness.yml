name: Audit Gitkeep Emptiness
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Ensure .gitkeep files are empty
        run: |
          [ -z "$(find . -name '.gitkeep' -type f -size +0)" ]
