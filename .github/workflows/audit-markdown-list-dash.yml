name: Audit Markdown List Dash
on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check list item markers
        run: |
          if grep -rnE "^\s*\* " . --include="*.md"; then
            echo "Error: Markdown lists must use dashes (-) instead of asterisks (*)."
            exit 1
          fi
