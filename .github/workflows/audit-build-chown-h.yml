name: Audit Build Chown H

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for chown no-dereference
        run: |
          # Robust check for chown without -h or --no-dereference
          grep -rnE "^[^#]*chown " scripts/ | grep -vE "(\-h|\-\-no\-dereference)" && (echo "Use 'chown -h' when changing ownership in build scripts to handle symlinks safely" && exit 1) || exit 0
