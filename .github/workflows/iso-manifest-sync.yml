name: ISO Manifest Sync
on:
  workflow_run:
    workflows: ["KibaOS Build"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Sync Manifest
        run: |
          mkdir -p manifests
          grep -A 200 "PACKAGES" .github/workflows/kiba.yml | grep -v "PACKAGES" | sed '/^$/q' > manifests/package-list.txt
          git config user.name "KibaBot"
          git config user.email "bot@kibaos.org"
          git add manifests/package-list.txt
          git commit -m "docs: sync package manifest" || true
