name: Audit Workflow GH Repo Env
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check GH_REPO definition
        run: |
          # Workflows using gh CLI without checkout should define GH_REPO
          # This is a simplified check for workflows that might be missing it
          if grep -l "\bgh\b" .github/workflows/*.yml | xargs -r grep -L "GH_REPO:"; then
             echo "Warning: Workflows utilizing 'gh' CLI should ensure GH_REPO is defined if actions/checkout is not used."
          fi
