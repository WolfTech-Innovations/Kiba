name: Branding Assets Audit
on:
  schedule:
    - cron: '0 0 * * 1'
  push:
    paths:
      - "build.sh"
      - "scripts/audit_branding.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Branding Audit
        run: bash scripts/audit_branding.sh
