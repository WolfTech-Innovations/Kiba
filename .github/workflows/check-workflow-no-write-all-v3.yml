name: Check Workflow No Write All
on:
  push:
paths:
- .github/workflows/*.yml
  pull_request:
paths:
- .github/workflows/*.yml
jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Check Permissions
      run: '! grep -r "permissions: read-all" .github/workflows/'
    timeout-minutes: 5
