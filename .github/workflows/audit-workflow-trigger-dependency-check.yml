name: Audit Workflow Trigger Dependency Check
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check trigger dependencies
        run: |
          if grep -rn "workflows:" .github/workflows/ | grep -v "KibaOS Build"; then
             echo "Error: Workflow triggers that depend on the main build must reference 'KibaOS Build'."
             exit 1
          fi
