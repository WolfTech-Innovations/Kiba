name: Audit Build Mount Nbd Max Part

on:
  push:
    paths:
      - 'scripts/kibaos_build.sh'
  pull_request:
    paths:
      - 'scripts/kibaos_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Nbd Max Part
        run: |
          if ! grep -q "modprobe nbd max_part=16" scripts/kibaos_build.sh; then
            echo "Error: modprobe nbd should use max_part=16"
            exit 1
          fi
