name: Update Workflows Documentation
on:
  push:
    paths:
      - ".github/workflows/*.yml"
      - "scripts/update_workflows_md.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install PyYAML
      - name: Update WORKFLOWS.md
        run: python3 scripts/update_workflows_md.py
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add WORKFLOWS.md
          if git commit -m "docs: update WORKFLOWS.md [skip ci]"; then
            git push
          fi
