name: Audit Workflow Env Variable Shadowing
on:
  push:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Env
        run: |
          if grep -rE "^[[:space:]]+env:" .github/workflows/ -A 10 | grep -v "env:" | sort | uniq -d | grep -v "\-\-"; then
            echo "Potential environment variable shadowing detected"
            exit 1
          fi
