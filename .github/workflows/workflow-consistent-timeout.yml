name: Workflow Consistent Timeout

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workflow_consistent_timeout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce standard timeout-minutes
        run: |
          grep -L "timeout-minutes: 5" .github/workflows/*.yml && exit 1 || exit 0
