name: Advanced Labeler
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply labels based on file changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --name-only origin/main | grep -q "build.sh"; then
            gh pr edit ${{ github.event.pull_request.number }} --add-label "build"
          fi
          if git diff --name-only origin/main | grep -q ".github/workflows/"; then
            gh pr edit ${{ github.event.pull_request.number }} --add-label "ci"
          fi
          if git diff --name-only origin/main | grep -q ".md$"; then
            gh pr edit ${{ github.event.pull_request.number }} --add-label "documentation"
          fi
