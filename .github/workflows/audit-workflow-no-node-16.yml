name: "Audit Workflow No Node 16"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          ! grep -r 'node-version:.*16' .github/workflows/ | grep . || (echo "::error::Node 16 is EOL, use 20+" && exit 1)
