name: Audit Build Chromium Home

on:
  push:
    paths:
      - "scripts/kibaos_build.sh"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check Homepage
        run: |
          grep "https://alphasearch.pages.dev" scripts/kibaos_build.sh
