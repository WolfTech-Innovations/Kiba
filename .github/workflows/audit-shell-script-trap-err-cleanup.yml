name: Audit Shell Script Trap Err Cleanup

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check trap
        run: |
          failed=0
          while IFS= read -r f; do
            if ! grep -q "trap" "$f"; then
              echo "$f should use trap for cleanup on error"
              failed=1
            fi
          done < <(find . -name "*.sh")
          exit "$failed"
