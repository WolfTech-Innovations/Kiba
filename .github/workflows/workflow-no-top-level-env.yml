name: Workflow No Top Level Env

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  workflow_no_top_level_env:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discourage global env in workflows
        run: |
          grep "^env:" .github/workflows/*.yml && exit 1 || exit 0
