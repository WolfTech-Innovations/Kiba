name: Audit Repo License Sanity
on:
  push:
    paths: [ 'LICENSE' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Verify License
        run: |
          if ! grep -q "WolfTech Innovations" LICENSE; then
            echo "Error: LICENSE copyright missing."
            exit 1
          fi
        shell: bash
