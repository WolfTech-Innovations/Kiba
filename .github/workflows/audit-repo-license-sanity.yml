name: Audit Repo License Sanity
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify License file
        shell: bash
        run: |
          test -s LICENSE || (echo "LICENSE file is missing or empty" && exit 1)
