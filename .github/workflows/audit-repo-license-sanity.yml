name: Audit Repo License Sanity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          if [ ! -f "LICENSE" ]; then
            echo "ERROR: LICENSE file missing"
            exit 1
          fi
