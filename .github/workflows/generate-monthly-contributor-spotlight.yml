name: Generate Monthly Contributor Spotlight
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
permissions:
  issues: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  spotlight:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate Top Contributor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTRIBUTOR=$(gh pr list --state merged --json author --limit 100 | jq -r '.[].author.login' | sort | uniq -c | sort -nr | head -1 | awk '{print $2}')
          [ -n "$CONTRIBUTOR" ] && gh issue create --title "Monthly Contributor Spotlight: $CONTRIBUTOR" --body "Thanks to @$CONTRIBUTOR for their amazing contributions this month!" || echo "No contributors found"
