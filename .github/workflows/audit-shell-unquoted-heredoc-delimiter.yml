name: Audit Shell Unquoted Heredoc Delimiter

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check heredoc delimiters
        run: |
          grep -rnE "<<[A-Z0-9]+" . --include="*.sh" && (echo "Quote heredoc delimiters to prevent expansion: << 'EOF'" && exit 1) || exit 0
