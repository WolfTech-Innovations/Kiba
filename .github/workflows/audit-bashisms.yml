name: "Audit: Bashisms"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install devscripts
        run: sudo apt-get update && sudo apt-get install -y devscripts
      - name: "Audit: Bashisms"
        run: |
          checkbashisms scripts/*.sh ota/*.sh
