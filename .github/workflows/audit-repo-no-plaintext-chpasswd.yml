name: Repo No Plaintext Chpasswd

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: bash scripts/repo_audit.sh --audit-repo-no-plaintext-chpasswd
