name: Audit Repo No Plaintext Chpasswd

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Audit Repo No Plaintext Chpasswd
        shell: bash
        run: |
          bash scripts/repo_audit.sh --security-no-plaintext-chpasswd
