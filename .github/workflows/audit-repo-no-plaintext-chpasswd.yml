name: Audit Repo - No Plaintext chpasswd
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit
        shell: bash
        run: bash scripts/repo_audit.sh --audit-repo-no-plaintext-chpasswd
