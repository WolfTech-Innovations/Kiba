name: Audit Workflow Run Step Injection
on:
  push:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for Direct Expansion
        run: |
          grep -r "run:.*\${{.*github\.event\.pull_request\.body.*}}" .github/workflows/ --exclude=audit-workflow-run-step-injection.yml && (echo "Direct expansion of PR body detected - use env variables instead" && exit 1) || echo "No direct expansion of PR body found"
