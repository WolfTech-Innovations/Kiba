name: Audit Build SH Desktop Entry Kiba
on:
  push:
    paths: [ 'build.sh' ]
  pull_request:
    paths: [ 'build.sh' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify branding
        run: |
          for app in Browser Music Files Terminal Photos Editor Disks; do
            if ! grep -q "Name=KibaOS $app" build.sh; then
              echo "Error: Missing KibaOS branding for $app."
              exit 1
            fi
          done
        shell: bash
