name: "Audit Build SH Desktop Entry Kiba"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check kiba desktop entry
        run: |
          grep -q 'Icon=kibaos' build.sh
        shell: bash
