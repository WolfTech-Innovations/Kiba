name: Audit build.sh Desktop Entry Kiba
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          if [ -f "build.sh" ]; then
            if ! grep -q "kibaos-install.desktop" build.sh; then
              echo "ERROR: build.sh is missing kibaos-install.desktop reference"
              exit 1
            fi
          fi
