name: Weekly Repo Activity Summary

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Generating weekly activity report..."
          # Use gh CLI to fetch recent activity
          gh pr list --state all --limit 50
          gh issue list --state all --limit 50
