name: Advanced Issue Triage
on:
  issues:
    types: [opened]
jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - name: Triage issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="${{ github.event.issue.body }}"
          if echo "$BODY" | grep -qiE "bug|error|crash"; then
            gh issue edit ${{ github.event.issue.number }} --add-label "bug"
          elif echo "$BODY" | grep -qiE "feature|request|suggest"; then
            gh issue edit ${{ github.event.issue.number }} --add-label "enhancement"
          fi
