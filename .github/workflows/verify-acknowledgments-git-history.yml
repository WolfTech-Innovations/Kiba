name: Verify Acknowledgments Git History
true:
  push:
    branches:
    - main
  pull_request: null
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Check Contributors
      run: "# Ensure all major contributors (3+ commits) are in ACKNOWLEDGMENTS.md\n\
        for user in $(git log --format='%aN' | sort | uniq -c | sort -nr | awk '$1\
        \ >= 3 {print $2}'); do\n  grep -q \"$user\" ACKNOWLEDGMENTS.md || (echo \"\
        Missing $user in ACKNOWLEDGMENTS.md\" && exit 1)\ndone\n"
    timeout-minutes: 5
