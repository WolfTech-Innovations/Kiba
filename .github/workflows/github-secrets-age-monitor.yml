name: GitHub Secrets Age Monitor
on:
  schedule:
    - cron: '0 0 1 * *' # Monthly
  workflow_dispatch:

jobs:
  check-secret-age:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit Secret Longevity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "### GitHub Secrets Age Audit" >> $GITHUB_STEP_SUMMARY

          # Get list of secrets with their update timestamps
          SECRETS=$(gh api repos/${{ github.repository }}/actions/secrets --jq '.secrets[] | "\(.name) \(.updated_at)"')

          CURRENT_DATE=$(date +%s)
          SIX_MONTHS_AGO=$(date -d "6 months ago" +%s)

          while read -r name updated_at; do
            UPDATE_SEC=$(date -d "$updated_at" +%s)
            if [ "$UPDATE_SEC" -lt "$SIX_MONTHS_AGO" ]; then
              echo "-  **$name** is over 6 months old (Last updated: $updated_at). Consider rotating." >> $GITHUB_STEP_SUMMARY
            else
              echo "-  **$name** is fresh (Last updated: $updated_at)." >> $GITHUB_STEP_SUMMARY
            fi
          done <<< "$SECRETS"
