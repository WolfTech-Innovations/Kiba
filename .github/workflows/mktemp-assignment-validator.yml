name: Mktemp Assignment Validator

on:
  push:
    paths:
      - "**/*.sh"
  pull_request:
    paths:
      - "**/*.sh"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
heckout@11bd71901bbe5b1630ceea73d27597364c9af683/a         with:
          persist-credentials: false

      - name: Mktemp Assignment Validator
        run: |
          for f in $(find . -name "*.sh"); do grep -q "mktemp" "$f" && ! grep -qE "[a-zA-Z0-9_]+=\$\(mktemp" "$f" && { echo "Warning in $f"; }; done || true
