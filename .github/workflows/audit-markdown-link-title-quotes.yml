name: "Audit Markdown Link Title Quotes"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          ! grep -rE '\[.*\]\(.* ".*"\)' . --include='*.md' --exclude-dir=node_modules | grep -v "'" | grep . || (echo "::error::Use single quotes for link titles" && exit 1)
