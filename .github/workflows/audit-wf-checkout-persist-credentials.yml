name: Audit Checkout Persist Credentials

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check persist-credentials
        run: |
          python3 -c '
          import yaml, os, sys
          failed = False
          for root, _, files in os.walk(".github/workflows"):
              for f in files:
                  if not f.endswith(".yml"): continue
                  path = os.path.join(root, f)
                  try:
                      with open(path) as s:
                          data = yaml.safe_load(s)
                          if not data or "jobs" not in data: continue
                          for jid, job in data["jobs"].items():
                              for step in job.get("steps", []):
                                  if "uses" in step and "actions/checkout" in step["uses"]:
                                      if step.get("with", {}).get("persist-credentials") is not False:
                                          print(f"Failure in {path} ({jid})")
                                          failed = True
                  except: pass
          if failed: sys.exit(1)
          '
