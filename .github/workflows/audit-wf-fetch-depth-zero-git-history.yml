name: Audit Workflow Fetch Depth Zero

on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
        with:
          persist-credentials: false
      - name: Check fetch-depth
        run: |
          grep -r "fetch-depth: 0" .github/workflows || (echo "No workflow uses fetch-depth: 0. Ensure history-dependent workflows have it." && exit 1)
