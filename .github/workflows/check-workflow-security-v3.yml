name: Check Workflow Security
on:
  push:
    paths:
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - ".github/workflows/*.yml"
jobs:
  audit:
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit Security
        run: |
          # Optimized: Check for insecure persist-credentials: true
          grep -r "persist-credentials: tr""ue" .github/workflows/ && exit 1 || echo "Policy passed"
          # Check for permissions defined
          grep -r "permissions:" .github/workflows/ || exit 1
