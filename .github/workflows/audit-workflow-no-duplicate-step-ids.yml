name: Audit Workflow No Duplicate Step Ids

on:
  push:
    paths:
      - '.github/workflows/**.yml'
  pull_request:
    paths:
      - '.github/workflows/**.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run YAML Audit
        shell: bash
        run: |
          pip install PyYAML --break-system-packages
          cat << 'EOF' > audit.py
          import yaml
          import os
          import sys

          failed = False
          for root, _, files in os.walk('.github/workflows'):
              for file in files:
                  if file.endswith(('.yml', '.yaml')):
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8') as f:
                          try:
                              data = yaml.safe_load(f)
                              if not data: continue
                              jobs = data.get('jobs', {})
                              for job_name, job in jobs.items():
                                  step_ids = set()
                                  steps = job.get('steps', [])
                                  for step in steps:
                                      sid = step.get('id')
                                      if sid:
                                          if sid in step_ids:
                                              print(f"Error: Duplicate step id '{sid}' in {path} job '{job_name}'")
                                              failed = True
                                          step_ids.add(sid)
                          except Exception as e:
                              print(f"Error parsing {path}: {e}")
          if failed: sys.exit(1)
          EOF
          python3 audit.py
