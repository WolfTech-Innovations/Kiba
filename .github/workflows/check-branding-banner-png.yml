name: Check Branding Banner PNG

on:
  push:
    paths:
      - "branding/kibatv_banner.png"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Banner
        run: |
          test -f branding/kibatv_banner.png
