name: Check Repo Hygiene
on:
  push:
  pull_request:
jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Scan Temp Files
      run: find . -name "*.bak" -o -name "*~" | grep . && exit 1 || exit 0
    timeout-minutes: 5
