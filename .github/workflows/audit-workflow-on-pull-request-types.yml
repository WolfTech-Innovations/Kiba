name: Audit Workflow On Pull Request Types
on:
  push:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check PR Activity Types
        run: |
          # Check for workflows that use 'pull_request:' without explicit types
          # This often leads to redundant runs.
          if grep -r "pull_request:" .github/workflows/ | grep -v "types:"; then
            echo "Warning: Consider specifying explicit 'types' for pull_request triggers (e.g., opened, synchronize)."
          fi
