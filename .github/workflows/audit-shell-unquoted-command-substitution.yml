name: Audit Shell Unquoted Command Substitution
on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Unquoted Substitution
        run: |
          if grep -rnE "[^\"']\$\(" .; then
            echo "Error: Command substitutions \$(...) should usually be double-quoted to prevent word splitting."
            exit 1
          fi
