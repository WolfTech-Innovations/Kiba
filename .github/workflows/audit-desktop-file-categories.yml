name: Audit Desktop File Categories

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit_desktop_file_categories:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify categories in .desktop files
        run: |
          grep -r "Categories=" . --include="*.desktop" | grep -vE "Audio|Video|Development|Education|Game|Graphics|Network|Office|Settings|System|Utility" && exit 1 || exit 0
