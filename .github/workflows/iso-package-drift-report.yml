name: ISO Package Drift Report
on:
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Checkout Head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: head

      - name: Extract Package Lists
        run: |
          sed -n '/PACKAGES/,/PACKAGES/p' base/.github/workflows/kiba.yml | grep -v 'PACKAGES' | grep -v '^#' | sort > base_pkgs.txt
          sed -n '/PACKAGES/,/PACKAGES/p' head/.github/workflows/kiba.yml | grep -v 'PACKAGES' | grep -v '^#' | sort > head_pkgs.txt

      - name: Generate Drift Report
        run: |
          echo "### ISO Package Drift Analysis" >> $GITHUB_STEP_SUMMARY

          ADDED=$(comm -13 base_pkgs.txt head_pkgs.txt | wc -l)
          REMOVED=$(comm -23 base_pkgs.txt head_pkgs.txt | wc -l)

          echo "#### Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Added:** $ADDED" >> $GITHUB_STEP_SUMMARY
          echo "- **Removed:** $REMOVED" >> $GITHUB_STEP_SUMMARY

          if [ $ADDED -gt 0 ]; then
            echo "#### Added Packages" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            comm -13 base_pkgs.txt head_pkgs.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ $REMOVED -gt 0 ]; then
            echo "#### Removed Packages" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            comm -23 base_pkgs.txt head_pkgs.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
