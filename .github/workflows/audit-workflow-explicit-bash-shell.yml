name: "Audit Workflow Explicit Bash"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check shell specification
        run: |
          [ "$(grep -r 'run:' .github/workflows/ -A 1 | grep -v 'shell: bash' | grep -c 'run:')" -eq 0 ] || (grep -r 'run:' .github/workflows/ -A 1 | grep -v 'shell: bash' | grep 'run:' -A 1; false)
        shell: bash
