name: Audit Workflow Explicit Bash Shell
on:
  push:
    paths: [ '.github/workflows/*.yml' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify shell
        run: |
          for f in .github/workflows/*.yml; do
            if grep -q "run:" "$f" && ! grep -qE "shell: (bash|sh)" "$f" && ! grep -q "defaults:" "$f"; then
              echo "Warning: $f might be missing explicit shell for run steps."
            fi
          done
        shell: bash
