name: "Audit Workflow Explicit Bash Shell"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          ! grep -B 1 "run:" .github/workflows/*.yml | grep -v "shell: bash" | grep -vE "run: |---|^--" | grep -v "uses:"
