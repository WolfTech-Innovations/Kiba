name: Audit Workflow Step Naming

on:
  push:
    paths:
      - '.github/workflows/**.yml'
  pull_request:
    paths:
      - '.github/workflows/**.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check step naming
        run: |
          # Robust check for step names starting with lowercase, ignoring indented content
          grep -rn "^[[:space:]]*- name: [a-z]" .github/workflows/ && (echo "Workflow step names should be Capitalized" && exit 1) || exit 0
