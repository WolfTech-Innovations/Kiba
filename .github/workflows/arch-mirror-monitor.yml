name: Arch Mirror Monitor
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check Mirror Status
        shell: bash
        run: |
          curl -s https://archlinux.org/mirrors/status/json/ | jq '.urls[0]'
