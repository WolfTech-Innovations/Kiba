name: Kiba Welcome Window Icon Audit

on:
  push:
    paths:
      - ".github/workflows/kiba.yml"
  pull_request:
    paths:
      - ".github/workflows/kiba.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Kiba Welcome Window Icon Audit
        run: |
          grep -q "kiba-welcome" .github/workflows/kiba.yml && ! grep -q "\-\-window-icon=" .github/workflows/kiba.yml && { echo "Error: missing icon"; false; } || true
