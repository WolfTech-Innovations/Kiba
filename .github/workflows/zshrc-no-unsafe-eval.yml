name: Zshrc No Unsafe Eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zshrc_no_unsafe_eval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discourage eval in .zshrc
        run: |
          if [ -f .zshrc ]; then grep "eval " .zshrc | grep -v "starship" && exit 1 || exit 0; fi
