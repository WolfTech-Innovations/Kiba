name: Audit Build Kernel Purge Order

on:
  push:
    paths:
      - 'scripts/kibatv_build.sh'
  pull_request:
    paths:
      - 'scripts/kibatv_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check purge order
        run: |
          PURGE_LINE=$(grep -n "linux-image-6.*" scripts/kibatv_build.sh | head -1 | cut -d: -f1)
          INSTALL_LINE=$(grep -n "linux-image-psycachy" scripts/kibatv_build.sh | head -1 | cut -d: -f1)
          if [ -n "$PURGE_LINE" ] && [ -n "$INSTALL_LINE" ]; then
            if [ "$PURGE_LINE" -ge "$INSTALL_LINE" ]; then
              echo "Stock kernel must be purged BEFORE installing psycachy"
              exit 1
            fi
          fi
