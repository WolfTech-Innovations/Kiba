name: Check Security MD Contact Info

on:
  push:
    paths:
      - "SECURITY.md"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify Contact
        run: |
          grep -E "security|contact|report" SECURITY.md
