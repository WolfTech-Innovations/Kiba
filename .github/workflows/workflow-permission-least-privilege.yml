name: Workflow Permission Least Privilege

on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'

permissions:
  contents: read

concurrency:
  group: permission-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Audit Permissions
        run: |
          # Identify workflows with top-level write permissions that shouldn't have them
          WRITE_PERMS=$(grep -l "permissions:" .github/workflows/*.yml | xargs grep -l "contents: write" | grep -vE "kiba\.yml|release|generator|roadmap|sync")
          if [ -n "$WRITE_PERMS" ]; then
             echo "Error: The following workflows have unnecessary 'contents: write' permissions:"
             echo "$WRITE_PERMS"
             exit 1
          fi
          # Ensure every workflow has a permissions block
          MISSING_PERMS=""
          for f in .github/workflows/*.yml; do
            if ! grep -q "permissions:" "$f"; then
              MISSING_PERMS="$MISSING_PERMS $f"
            fi
          done
          if [ -n "$MISSING_PERMS" ]; then
             echo "Error: The following workflows are missing a 'permissions:' block: $MISSING_PERMS"
             exit 1
          fi
