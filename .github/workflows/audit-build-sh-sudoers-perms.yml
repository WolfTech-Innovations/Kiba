name: "Audit Build SH Sudoers Perms"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          ! grep -q 'chmod 777 /etc/sudoers' build.sh || (echo "::error::Dangerous sudoers permissions in build.sh" && exit 1)
