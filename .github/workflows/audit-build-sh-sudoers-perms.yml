name: Audit build.sh Sudoers Perms
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          if [ -f "build.sh" ]; then
            if grep -q "etc/sudoers.d/" build.sh && ! grep -q "chmod 0440" build.sh; then
              echo "ERROR: sudoers.d files should have 0440 permissions"
              exit 1
            fi
          fi
