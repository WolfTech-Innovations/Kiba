name: "Audit Build SH Sudoers Perms"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check sudoers permissions
        run: |
          grep -q 'chmod 0440' build.sh && grep -q '/etc/sudoers.d/' build.sh
        shell: bash
