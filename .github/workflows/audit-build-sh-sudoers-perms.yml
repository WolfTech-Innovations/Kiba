name: Audit Build Sh Sudoers Perms
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          grep -A 10 "sudoers.d" build.sh | grep -q "0440" || (echo "Error: insecure sudoers permissions" && exit 1)
