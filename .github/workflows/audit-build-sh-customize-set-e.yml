name: "Audit Build SH Customize Set E"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check set -e in customize_airootfs
        run: |
          grep -A 2 'cat > "${AIROOTFS}/root/customize_airootfs.sh"' build.sh | grep -q 'set -e'
        shell: bash
