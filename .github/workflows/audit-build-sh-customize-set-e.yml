name: Audit Build SH Customize Set E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Build SH Customize Set E
        run: bash scripts/repo_audit.sh --check build_sh_customize_set_e
        shell: bash
