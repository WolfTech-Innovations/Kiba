name: Audit Build Sh Customize Set E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          grep -A 5 "customize_airootfs.sh" build.sh | grep -q "set -e" || (echo "Error: customize_airootfs.sh missing set -e" && exit 1)
