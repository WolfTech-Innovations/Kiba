name: Audit Build Sh Customize Set E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run audit function
        run: bash scripts/repo_audit.sh --audit-build-sh-customize-set-e
