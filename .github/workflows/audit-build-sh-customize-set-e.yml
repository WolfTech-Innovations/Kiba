name: Audit Build SH Customize Set E
on:
  push:
    paths: [ 'build.sh' ]
  pull_request:
    paths: [ 'build.sh' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify set -e
        run: |
          if ! grep -A 2 "cat > \"\${AIROOTFS}/root/customize_airootfs.sh\"" build.sh | grep -q "set -e"; then
            echo "Error: customize_airootfs.sh in build.sh is missing set -e"
            exit 1
          fi
        shell: bash
