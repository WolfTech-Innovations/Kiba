name: "Audit Build SH Customize Set E"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          grep -A 2 'cat > "${AIROOTFS}/root/customize_airootfs.sh"' build.sh | grep -q 'set -e' || (echo "::error::Missing 'set -e' in customize_airootfs.sh inside build.sh" && exit 1)
