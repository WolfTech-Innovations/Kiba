name: "Audit build.sh customize set -e"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Audit build.sh customize set -e
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          grep -A 2 "cat > \"\${AIROOTFS}/root/customize_airootfs.sh\" << 'CUSTOMIZE'" build.sh | grep -q "set -e" || (echo "Missing set -e" && exit 1)
