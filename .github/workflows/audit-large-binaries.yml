name: "Audit: Large Binaries"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Large Binaries"
        run: |
          ! find . -type f -size +10M -not -path "*/.git/*" | grep .
