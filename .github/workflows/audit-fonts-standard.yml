name: "Audit: Fonts Standard"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Fonts Standard"
        run: |
          grep -E "ttf-inter|ttf-jetbrains-mono" build.sh || { echo 'Error: Standard KibaOS fonts missing in build.sh'; exit 1; }
