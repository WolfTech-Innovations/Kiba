name: Check Branch Naming
on:
  pull_request:
jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Verify Branch Name
      env:
        HEAD_REF: ${{ github.head_ref }}
      run: echo "$HEAD_REF" | grep -vE "^(feat|fix|docs|style|refactor|test|chore)/"
        && exit 1 || exit 0
    timeout-minutes: 5
