name: Zenity Literal Newline Checker

on:
  push:
    paths:
      - "scripts/kibatv_build.sh"
  pull_request:
    paths:
      - "scripts/kibatv_build.sh"

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Zenity Literal Newline Checker
        run: |
          grep -E "zenity.*--text" scripts/kibatv_build.sh | grep -q "\\n" && { echo "Warning: \n in Zenity"; } || true
