name: Zenity Literal Newline Checker

on:
  push:
    paths:
      - ".github/workflows/kiba.yml"
  pull_request:
    paths:
      - ".github/workflows/kiba.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Zenity Literal Newline Checker
        run: |
          grep -E "zenity.*--text" .github/workflows/kiba.yml | grep -q "\\n" && { echo "Warning: \n in Zenity"; } || true
