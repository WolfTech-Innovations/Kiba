name: Audit Python Mutable Defaults

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit_python_mutable_defaults:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for mutable default arguments
        run: |
          grep -rE "def .+\=\[\]|def .+\=\{\}" . --include="*.py" && exit 1 || exit 0
