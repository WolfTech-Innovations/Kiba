name: Audit Secret Leaks
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check for accidental GitHub Token/Secret leaks via echo
        run: |
          ! grep -rE "echo.*(github\.token|secrets\.)" .github/workflows/
