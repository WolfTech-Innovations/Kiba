name: Check Contributing Links
on:
  push:
paths:
- CONTRIBUTING.md
  pull_request:
paths:
- CONTRIBUTING.md
jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      with:
        persist-credentials: false
    - name: Check Links
      run: grep "\[.*\](.*)" CONTRIBUTING.md
    timeout-minutes: 5
