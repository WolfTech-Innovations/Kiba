name: Check Contributing Links
on:
  push:
    paths:
      - CONTRIBUTING.md
  pull_request:
    paths:
      - CONTRIBUTING.md
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Links
        run: grep "https://" CONTRIBUTING.md
