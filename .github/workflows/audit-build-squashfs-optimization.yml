name: Audit Build Squashfs Optimization

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run Build Audit
        shell: bash
        run: |
          if grep -rn "\bmksquashfs\b" scripts/ | grep -v "\-b 1M"; then
            echo "Error: Use '-b 1M' for mksquashfs"
            exit 1
          fi
