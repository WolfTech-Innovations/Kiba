name: Shell Variable Unquoted

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell_variable_unquoted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect unquoted variables in assignments
        run: |
          grep -rE "[a-zA-Z0-9_]+=\\\$[a-zA-Z0-9_]+" . --include="*.sh" && exit 1 || exit 0
