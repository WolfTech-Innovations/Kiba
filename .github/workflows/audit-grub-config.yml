name: "Audit: GRUB Config"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: GRUB Config"
        run: |
          grep -r "GRUB_TIMEOUT" . || { echo 'Error: GRUB_TIMEOUT configuration missing'; exit 1; }
