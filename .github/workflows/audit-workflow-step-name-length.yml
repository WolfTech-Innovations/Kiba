name: Audit Workflow Step Name Length

on:
  push:
    paths:
      - '.github/workflows/**.yml'
  pull_request:
    paths:
      - '.github/workflows/**.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Check step name length
        run: |
          grep -rnE "^\s+name:\s+.{80,}" .github/workflows && (echo "Error: Step name too long (>80 chars)" && exit 1) || exit 0
