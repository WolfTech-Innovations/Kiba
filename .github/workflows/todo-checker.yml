name: TODO Checker
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  todo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for TODOs
        run: |
          grep -r "TODO" . --exclude-dir=.git --exclude-dir=node_modules || echo "No TODOs found"
