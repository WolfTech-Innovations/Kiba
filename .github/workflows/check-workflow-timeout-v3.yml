name: Check Workflow Timeout
on:
  push:
    paths:
      - .github/workflows/*.yml
      - .github/workflows/*.yml
  pull_request:
    paths:
      - .github/workflows/*.yml
      - .github/workflows/*.yml
jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Check Timeouts
      run: grep -rn "jobs:" .github/workflows/ -A 20 | grep -v "timeout-minutes:"
        | grep "audit" && exit 1 || exit 0
    timeout-minutes: 5
