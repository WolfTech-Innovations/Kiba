name: Shell Script Missing Bash Path

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shell_script_missing_bash_path:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure /bin/bash or /usr/bin/env bash
        run: |
          grep -r "^#!" . --include="*.sh" | grep -vE "/bin/bash|/usr/bin/env bash" && exit 1 || exit 0
