name: Audit Build Apkbuild Options Check

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Apkbuild Options
        run: |
          # Ensure both APKBUILDs have !check option
          if grep "options=" .github/workflows/kiba.yml | grep -v "!check"; then
             echo "Error: APKBUILD options should include !check"
             exit 1
          fi
