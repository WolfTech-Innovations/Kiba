name: "Build KibaOS"
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            docker_image: archlinux:latest
          # ARM desktop/ISO leg is gone from build.sh itself now (the old
          # --arm flag is a silent no-op there) -- replaced by --mobile,
          # which doesn't build an ISO at all, just a pacstrap'd aarch64
          # rootfs + Halium GSI installer bundle for phones. Still needs a
          # real aarch64 host for the same reason the old leg did: pacman
          # runs each package's post-install scriptlets inside the target
          # root, which needs to execute aarch64 binaries -- QEMU-emulating
          # that on an x86_64 runner is exactly the kind of foreign-arch
          # execution this native runner was chosen to avoid. menci/archlinuxarm
          # ships a real linux/arm64 base-devel image, so still no binfmt/QEMU
          # layer at all.
          - arch: mobile
            runner: ubuntu-24.04-arm
            docker_image: menci/archlinuxarm:base-devel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    outputs:
      patch_num: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        if: matrix.arch == 'x86_64'
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          # This action assumes an Ubuntu amd64 image layout (apt package
          # names, folder paths) that doesn't line up with the arm64
          # runner image, so it only runs on the x86_64 leg. The mobile
          # leg's pacstrap'd rootfs is also far smaller than a full
          # desktop pacstrap, so there's less to reclaim either way.

      - name: Run build in Docker
        run: |
          docker run --rm --privileged \
            -v "$PWD:/w" \
            -e RUN_NUM="${{ github.run_number }}" \
            -e KIBA_ARCH="${{ matrix.arch }}" \
            "${{ matrix.docker_image }}" \
            /bin/bash /w/build.sh ${{ matrix.arch == 'mobile' && '--mobile' || '' }}

      # ── x86_64: ISO uploads immediately, in parallel with everything else ─
      # Unchanged from before. This has zero dependency on the OTA
      # manifest/diff/sign pipeline below, so it doesn't wait behind
      # ~30+ minutes of manifest work before the actual release artifact
      # goes out the door. Split into its own x86_64-only step now that
      # the other leg produces a completely different set of files
      # (out/*, not *.iso) with a completely different upload strategy
      # (see "Upload mobile artifacts to SourceForge" below) -- trying to
      # keep one step that branched on both would've been harder to
      # follow than just two steps.
      - name: Upload ISO to SourceForge
        if: matrix.arch == 'x86_64'
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SSHPASS: ${{ secrets.SF_PASS }}
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SSHPASS" ]; then
            echo "SourceForge credentials not configured. Skipping."
            exit 0
          fi
          sudo apt-get install -y sshpass rsync
          mkdir -p ~/.ssh
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts

          ARCH="${{ matrix.arch }}"
          REMOTE_DIR="/home/frs/project/kibaos/${ARCH}"
          MARKER="last-iso-build-number-${ARCH}.txt"

          # ── Remove the previous build's ISO + checksum for this arch ──
          # Only ever deletes the exact filename recorded in a marker WE
          # wrote on a prior successful run of this same arch -- never a
          # glob, never a guess at what "the old one" might be named. If
          # that marker isn't there (first run for this arch, or a prior
          # run never got far enough to write it), nothing is deleted:
          # an unlabeled file is left alone rather than assumed safe to
          # remove.
          rm -f "${MARKER}"
          sshpass -e rsync -avP \
            "$SF_USER@frs.sourceforge.net:${REMOTE_DIR}/${MARKER}" \
            "${MARKER}" 2>/dev/null || true

          if [ -s "${MARKER}" ]; then
            PREV_NUM="$(cat "${MARKER}")"
            PREV_ISO="kibaos-v${PREV_NUM}.iso"
            echo "Removing previous ${ARCH} build: ${PREV_ISO} (+ .sha256)"
            printf '%s\n' \
              "cd ${REMOTE_DIR}" \
              "rm ${PREV_ISO}" \
              "rm ${PREV_ISO}.sha256" \
              "bye" \
              | sshpass -e sftp -oStrictHostKeyChecking=no -oBatchMode=no \
                  "$SF_USER@frs.sourceforge.net" 2>/dev/null || true
          else
            echo "No previous build marker for ${ARCH} -- nothing to delete."
          fi

          # ── Upload this build's ISO + checksum into the arch directory ─
          sshpass -e rsync -avP --progress \
            *.iso *.iso.sha256 \
            "$SF_USER@frs.sourceforge.net:${REMOTE_DIR}/"

          # ── Record this run's number as the marker for next time ──────
          echo "${{ github.run_number }}" > "${MARKER}"
          sshpass -e rsync -avP \
            "${MARKER}" \
            "$SF_USER@frs.sourceforge.net:${REMOTE_DIR}/${MARKER}"

      # ── mobile: the zip is meant to be a single flash-and-go artifact --
      # boot.img/init_boot repack ingredients (magiskboot + generic
      # ramdisk), the rootfs.img, AND the Halium GSI (android-rootfs.img)
      # all need to actually be inside it, or a user flashing it hits
      # update-binary's "no GSI bundled -- push one yourself" fallback
      # instead of a working install. build.sh only bundles the GSI if
      # its fetch succeeded that run (KIBA_SKIP_GSI_FETCH=1, or the
      # lolinet mirror just being down, both skip it silently on the
      # build side) -- so verify the zip is actually complete before
      # publishing it, rather than shipping one that quietly needs manual
      # follow-up.
      - name: Verify mobile installer zip is self-contained
        if: matrix.arch == 'mobile'
        run: |
          ZIP="out/kibaos-mobile-installer.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::${ZIP} not found -- build.sh didn't produce it"
            exit 1
          fi
          command -v unzip >/dev/null || sudo apt-get install -y unzip
          echo "Zip contents:"
          unzip -l "$ZIP"

          missing=0
          for required in rootfs.img android-rootfs.img halium-generic-ramdisk.cpio.gz magiskboot META-INF/com/google/android/update-binary; do
            if ! unzip -l "$ZIP" | awk '{print $4}' | grep -qx "$required"; then
              echo "::error::${ZIP} is missing ${required} -- not a self-contained installer (GSI fetch likely failed/was skipped this run)"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::Refusing to publish an installer zip that requires a manual GSI push -- see build.sh's KIBA_MOBILE_GSI_URL / KIBA_SKIP_GSI_FETCH handling."
            exit 1
          fi
          echo "Zip is self-contained: rootfs + GSI + boot-repack ingredients all present."

      # ── same "upload immediately, don't wait on OTA" idea as the x86_64
      # ISO leg, but simpler -- build.sh names mobile's output files
      # statically, never encoding the run number, so there's nothing to
      # version or clean up: each run's rsync just overwrites the
      # previous build's files under the same names. Only the installer
      # zip + its checksum go up here -- that's the one thing an end user
      # actually flashes; the rootfs tarball/.img/GSI copy stay local to
      # this job for the OTA leg below rather than being published.
      - name: Upload mobile artifacts to SourceForge
        if: matrix.arch == 'mobile'
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SSHPASS: ${{ secrets.SF_PASS }}
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SSHPASS" ]; then
            echo "SourceForge credentials not configured. Skipping."
            exit 0
          fi
          if [ ! -f out/kibaos-mobile-installer.zip ] || [ ! -f out/kibaos-mobile-installer.zip.sha256 ]; then
            echo "out/kibaos-mobile-installer.zip(.sha256) not found -- build.sh didn't produce it?" >&2
            exit 1
          fi
          sudo apt-get install -y sshpass rsync
          mkdir -p ~/.ssh
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts

          REMOTE_DIR="/home/frs/project/kibaos/mobile"
          echo "Uploading mobile installer zip:"
          ls -la out/kibaos-mobile-installer.zip out/kibaos-mobile-installer.zip.sha256
          sshpass -e rsync -avP --progress \
            out/kibaos-mobile-installer.zip out/kibaos-mobile-installer.zip.sha256 \
            "$SF_USER@frs.sourceforge.net:${REMOTE_DIR}/"

      - name: Upload build artifact for OTA job
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          # Matrix legs share the runner-level "kibaos-build" name by
          # default, which would silently overwrite one leg's artifact
          # with the other's in the shared artifact store -- suffix by
          # arch to keep both.
          name: kibaos-build-${{ matrix.arch }}
          path: |
            *.iso
          retention-days: 1

      - name: Upload mobile build artifact for OTA job
        if: matrix.arch == 'mobile'
        uses: actions/upload-artifact@v4
        with:
          name: kibaos-build-${{ matrix.arch }}
          # Whole out/ directory -- mobile has no single "the" artifact
          # the way the ISO leg does; OTA diffing needs the rootfs
          # tarball specifically, but everything else rides along so a
          # single artifact download in the OTA job has all of it.
          path: |
            out/
          retention-days: 1

  ota:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: kibaos-build-${{ matrix.arch }}

      - name: Install tools
        run: sudo apt-get install -y squashfs-tools sshpass rsync

      # ── x86_64: unpack the ISO's squashfs airootfs ─────────────────────
      - name: Extract airootfs from ISO for OTA diffing
        if: matrix.arch == 'x86_64'
        run: |
          ISO=$(ls *.iso | head -1)
          echo "Mounting ISO: $ISO"
          mkdir -p /tmp/iso-mount
          sudo mount -o loop "$ISO" /tmp/iso-mount
          SFS=$(find /tmp/iso-mount -name 'airootfs.sfs' | head -1)
          echo "Found squashfs: $SFS"
          mkdir -p /tmp/airootfs-extracted
          # -processors matches runner core count; single biggest win for
          # this step since unsquashfs was running single-threaded before.
          # Note: this step itself runs on an amd64 runner regardless of
          # matrix.arch -- unsquashfs just reads the squashfs data format,
          # which is arch-agnostic, so it doesn't need to run on-arch.
          sudo unsquashfs -d /tmp/airootfs-extracted -processors "$(nproc)" "$SFS"
          sudo umount /tmp/iso-mount
          echo "Extracted file count: $(find /tmp/airootfs-extracted -type f | wc -l)"

      # ── mobile: no ISO, no squashfs -- kibaos-mobile-rootfs.tar.gz IS
      # the rootfs already, just tarred. Extracting it straight into the
      # same /tmp/airootfs-extracted path lets every step below (manifest
      # generation, diffing, bundling, signing) stay identical for both
      # legs without caring which one produced the directory.
      - name: Extract mobile rootfs tarball for OTA diffing
        if: matrix.arch == 'mobile'
        run: |
          TARBALL=$(find . -name 'kibaos-mobile-rootfs.tar.gz' | head -1)
          if [ -z "$TARBALL" ]; then
            echo "kibaos-mobile-rootfs.tar.gz not found in downloaded artifact!" >&2
            exit 1
          fi
          echo "Extracting: $TARBALL"
          mkdir -p /tmp/airootfs-extracted
          sudo tar -xzf "$TARBALL" -C /tmp/airootfs-extracted
          echo "Extracted file count: $(find /tmp/airootfs-extracted -type f | wc -l)"

      - name: Download previous build manifest from SourceForge
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SSHPASS: ${{ secrets.SF_PASS }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts
          # Per-arch baseline -- x86_64's desktop rootfs and mobile's
          # phone rootfs diverge completely (different package set
          # entirely, no GRUB/kernel packages on mobile, etc.), so
          # diffing mobile's current manifest against an x86_64 baseline
          # would flag nearly every file as "changed" and produce a
          # useless, enormous patch.
          sshpass -e rsync -avP \
            "$SF_USER@frs.sourceforge.net:/home/frs/project/kibaos/ota/last-build-manifest-${{ matrix.arch }}.txt" \
            ./last-build-manifest.txt 2>/dev/null || \
            echo "No previous manifest found — this is a full baseline build."

      # ── Manifest generation: parallel hashing instead of one sha256sum ────
      # per file in a serial while-read loop. find -print0 | xargs -P only
      # forks as many sha256sum processes as you have cores, batched, instead
      # of one fork per file. On a full desktop rootfs (50k+ files) this is
      # the single biggest time sink in the old workflow — easily 10-20x
      # faster than the per-line bash/awk loop.
      - name: Generate current build manifest
        run: |
          cd /tmp/airootfs-extracted
          sudo find . -type f -print0 \
            | xargs -0 -P "$(nproc)" -n 64 sudo sha256sum 2>/dev/null \
            | sed 's|sudo: ||' \
            > "$GITHUB_WORKSPACE/current-build-manifest.txt" || true
          cd "$GITHUB_WORKSPACE"
          echo "Manifest entries: $(wc -l < current-build-manifest.txt)"

      - name: Compute changed files vs previous build
        id: diff
        run: |
          PATCH_NUM="${{ needs.build.outputs.patch_num }}"

          if [ ! -f last-build-manifest.txt ]; then
            echo "No previous manifest — skipping OTA patch generation for this baseline build."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            cp current-build-manifest.txt baseline-manifest.txt
          else
            echo "Diffing against previous build manifest..."
            sort -k2 last-build-manifest.txt    > prev-sorted.txt
            sort -k2 current-build-manifest.txt > curr-sorted.txt

            # Lines only in curr-sorted (new or changed hash) = changed files.
            # comm -13 needs both inputs sorted identically; since hash is
            # column 1 and path is column 2, a changed file produces a
            # different full line, so a plain comm on full lines works.
            comm -13 prev-sorted.txt curr-sorted.txt | awk '{print $2}' > changed_files.txt

            CHANGED=$(wc -l < changed_files.txt)
            echo "Changed files: $CHANGED"
            head -20 changed_files.txt
            [ "$CHANGED" -gt 20 ] && echo "... and $((CHANGED - 20)) more"

            if [ "$CHANGED" -eq 0 ]; then
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            else
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            fi
            cp current-build-manifest.txt baseline-manifest.txt
          fi

      # ── Bundling: parallel copy instead of serial cp in a while loop ──────
      - name: Bundle OTA patch from extracted airootfs
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          PATCH_NUM="${{ needs.build.outputs.patch_num }}"
          ARCH="${{ matrix.arch }}"
          PATCH_DIR="ota-patch-${PATCH_NUM}-${ARCH}"
          mkdir -p "${PATCH_DIR}"

          echo "Bundling changed files from extracted airootfs..."
          # rsync --files-from does one pass with internal parallelism for
          # directory creation + copy, instead of mkdir -p + cp per file.
          sed 's|^\./||' changed_files.txt > changed_files_rel.txt

          # Run rsync as root so files owned by root in the extracted airootfs can be read.
          # --ignore-missing-args prevents rsync exiting non-zero if a listed path is absent.
          sudo rsync -a --files-from=changed_files_rel.txt --ignore-missing-args \
            /tmp/airootfs-extracted/ "${PATCH_DIR}/"

          # Ensure files are readable by the runner for later steps.
          # Make files readable and directories enterable, then chown to the current user so subsequent steps don't need sudo.
          sudo chmod -R a+rX "${PATCH_DIR}"
          sudo chown -R "$(id -u):$(id -g)" "${PATCH_DIR}" || true

          mkdir -p "${PATCH_DIR}/etc/kibaos"
          echo "${PATCH_NUM}" > "${PATCH_DIR}/etc/kibaos/patch-level"

          cd "${PATCH_DIR}"
          find . -type f -print0 \
            | xargs -0 -P "$(nproc)" -n 64 sha256sum \
            > "../kibaos-ota-${PATCH_NUM}-${ARCH}-manifest.txt"
          cd ..

          echo "Patch manifest:"
          cat "kibaos-ota-${PATCH_NUM}-${ARCH}-manifest.txt"

          # Arch-tagged tarball name -- matches what kibaos-ota (the
          # on-device daemon) requests via $(uname -m) at patch-apply
          # time on x86_64, and whatever the mobile-side updater requests
          # for "mobile" builds, so a device only ever pulls its own leg's
          # patch.
          tar czf "kibaos-ota-${PATCH_NUM}-${ARCH}.tar.gz" "${PATCH_DIR}/"
          echo "Patch size: $(du -sh kibaos-ota-${PATCH_NUM}-${ARCH}.tar.gz | cut -f1)"

      - name: Sign OTA patch
        if: steps.diff.outputs.has_changes == 'true'
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          echo "$OTA_SIGNING_KEY" | gpg --batch --import
          KEY_FP=$(gpg --list-keys --with-colons ota@kibaos.wolftech.tech \
            | awk -F: '/^fpr/{print $10; exit}')
          echo "${KEY_FP}:6:" | gpg --import-ownertrust

          PATCH_NUM="${{ needs.build.outputs.patch_num }}"
          ARCH="${{ matrix.arch }}"
          gpg --batch --yes \
              --local-user ota@kibaos.wolftech.tech \
              --detach-sign --armor \
              "kibaos-ota-${PATCH_NUM}-${ARCH}.tar.gz"

          gpg --verify "kibaos-ota-${PATCH_NUM}-${ARCH}.tar.gz.asc" \
                       "kibaos-ota-${PATCH_NUM}-${ARCH}.tar.gz" && \
            echo "Signature verified OK." || \
            { echo "Signature self-check failed!"; exit 1; }

      - name: Write latest-patch-level
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          # Shared across both legs on purpose -- PATCH_NUM is the same
          # run_number for both matrix legs, and kibaos-ota only uses this
          # number to decide *whether* to update, then fetches the
          # arch-tagged tarball for that same number. One shared file
          # here is correct as long as both matrix legs actually produce
          # a patch for this run (they do, barring a build failure).
          echo "${{ needs.build.outputs.patch_num }}" > latest-patch-level

      # ── Single batched rsync instead of one connection per file ───────────
      - name: Upload OTA artifacts to SourceForge
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SSHPASS: ${{ secrets.SF_PASS }}
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SSHPASS" ]; then
            echo "SourceForge credentials not configured. Skipping."
            exit 0
          fi
          mkdir -p ~/.ssh
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts
          PATCH_NUM="${{ needs.build.outputs.patch_num }}"
          ARCH="${{ matrix.arch }}"

          echo "Uploading baseline manifest..."
          sshpass -e rsync -avP \
            "baseline-manifest.txt" \
            "$SF_USER@frs.sourceforge.net:/home/frs/project/kibaos/ota/last-build-manifest-${ARCH}.txt"

          if [ "${{ steps.diff.outputs.has_changes }}" == "true" ]; then
            sshpass -e rsync -avP \
              "kibaos-ota-${PATCH_NUM}-${ARCH}.tar.gz" \
              "kibaos-ota-${PATCH_NUM}-${ARCH}.tar.gz.asc" \
              "kibaos-ota-${PATCH_NUM}-${ARCH}-manifest.txt" \
              "$SF_USER@frs.sourceforge.net:/home/frs/project/kibaos/ota/"
            echo "OTA patch ${PATCH_NUM} (${ARCH}) uploaded."
          else
            echo "No changes for ${ARCH} — only baseline manifest updated."
          fi

          # latest-patch-level is shared/arch-agnostic (see previous step)
          # -- only push it once, from the x86_64 leg, so the two matrix
          # jobs don't race to overwrite it with the same value.
          if [ "${ARCH}" = "x86_64" ]; then
            sshpass -e rsync -avP \
              "latest-patch-level" \
              "$SF_USER@frs.sourceforge.net:/home/frs/project/kibaos/ota/"
          fi

      - name: Tag this build
        if: steps.diff.outputs.has_changes == 'true' && matrix.arch == 'x86_64'
        run: |
          # Tag once per run, not once per matrix leg -- the tag is a
          # marker for the run/patch number, not per-leg.
          git config user.name  "KibaOS OTA Bot"
          git config user.email "ota@kibaos.wolftech.tech"
          git tag "ota-patch-${{ needs.build.outputs.patch_num }}"
          git push origin "ota-patch-${{ needs.build.outputs.patch_num }}" 2>/dev/null || true
