name: "Build KibaOS"
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            docker_image: archlinux:latest
          # ubuntu-24.04-arm is a GitHub-hosted *native* ARM64 runner (free
          # for public repos) -- deliberately not QEMU here. kortexd gets
          # Nuitka-compiled to a native binary during this build and
          # Nuitka doesn't cross-compile, so emulating aarch64 on an x86_64
          # runner would either fail outright or produce a binary that
          # only runs under emulation. menci/archlinuxarm ships a real
          # linux/arm64 base-devel image, so no binfmt/QEMU layer at all.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            docker_image: menci/archlinuxarm:base-devel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    outputs:
      patch_num: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        if: matrix.arch == 'x86_64'
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          # This action assumes an Ubuntu amd64 image layout (apt package
          # names, folder paths) that doesn't line up with the arm64
          # runner image, so it only runs on the x86_64 leg. The arm64
          # hosted runners ship a smaller default toolset anyway, so
          # there's less to reclaim.

      - name: Run build in Docker
        run: |
          docker run --rm --privileged \
            -v "$PWD:/w" \
            -e RUN_NUM="${{ github.run_number }}" \
            -e KIBA_ARCH="${{ matrix.arch }}" \
            "${{ matrix.docker_image }}" \
            /bin/bash /w/build.sh ${{ matrix.arch == 'aarch64' && '--arm' || '' }}

      # ── ISO uploads immediately, in parallel with everything else ─────────
      # This has zero dependency on the OTA manifest/diff/sign pipeline below,
      # so it no longer waits behind ~30+ minutes of manifest work before the
      # actual release artifact goes out the door.
      #
      # Per-arch directories: build.sh names the ISO purely off the run
      # number (kibaos-v<run>.iso) -- it does NOT encode arch into the
      # filename, even though both matrix legs share the same run number.
      # Uploaded to one flat SourceForge directory, x86_64 and aarch64
      # would produce identical filenames and race to overwrite each
      # other. Giving each arch its own directory makes that collision
      # structurally impossible instead of relying on filenames staying
      # unique. rsync creates the destination subdirectory automatically
      # on first upload -- no separate mkdir step needed.
      - name: Upload ISO to SourceForge
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SSHPASS: ${{ secrets.SF_PASS }}
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SSHPASS" ]; then
            echo "SourceForge credentials not configured. Skipping."
            exit 0
          fi
          sudo apt-get install -y sshpass rsync
          mkdir -p ~/.ssh
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts

          ARCH="${{ matrix.arch }}"
          REMOTE_DIR="/home/frs/project/kibaos/${ARCH}"
          MARKER="last-iso-build-number-${ARCH}.txt"

          # ── Remove the previous build's ISO + checksum for this arch ──
          # Only ever deletes the exact filename recorded in a marker WE
          # wrote on a prior successful run of this same arch -- never a
          # glob, never a guess at what "the old one" might be named. If
          # that marker isn't there (first run for this arch, or a prior
          # run never got far enough to write it), nothing is deleted:
          # an unlabeled file is left alone rather than assumed safe to
          # remove.
          rm -f "${MARKER}"
          sshpass -e rsync -avP \
            "$SF_USER@frs.sourceforge.net:${REMOTE_DIR}/${MARKER}" \
            "${MARKER}" 2>/dev/null || true

          if [ -s "${MARKER}" ]; then
            PREV_NUM="$(cat "${MARKER}")"
            PREV_ISO="kibaos-v${PREV_NUM}.iso"
            echo "Removing previous ${ARCH} build: ${PREV_ISO} (+ .sha256)"
            printf '%s\n' \
              "cd ${REMOTE_DIR}" \
              "rm ${PREV_ISO}" \
              "rm ${PREV_ISO}.sha256" \
              "bye" \
              | sshpass -e sftp -oStrictHostKeyChecking=no -oBatchMode=no \
                  "$SF_USER@frs.sourceforge.net" 2>/dev/null || true
          else
            echo "No previous build marker for ${ARCH} -- nothing to delete."
          fi

          # ── Upload this build's ISO + checksum into the arch directory ─
          sshpass -e rsync -avP --progress \
            *.iso *.iso.sha256 \
            "$SF_USER@frs.sourceforge.net:${REMOTE_DIR}/"

          # ── Record this run's number as the marker for next time ──────
          echo "${{ github.run_number }}" > "${MARKER}"
          sshpass -e rsync -avP \
            "${MARKER}" \
            "$SF_USER@frs.sourceforge.net:${REMOTE_DIR}/${MARKER}"

      - name: Upload ISO artifact for OTA job
        uses: actions/upload-artifact@v4
        with:
          # Matrix legs share the runner-level "kibaos-iso" name by default,
          # which would silently overwrite one arch's ISO with the other's
          # in the shared artifact store -- suffix by arch to keep both.
          name: kibaos-iso-${{ matrix.arch }}
          path: |
            *.iso
          retention-days: 1

  ota:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: kibaos-iso-${{ matrix.arch }}

      - name: Install tools
        run: sudo apt-get install -y squashfs-tools sshpass rsync

      - name: Extract airootfs from ISO for OTA diffing
        run: |
          ISO=$(ls *.iso | head -1)
          echo "Mounting ISO: $ISO"
          mkdir -p /tmp/iso-mount
          sudo mount -o loop "$ISO" /tmp/iso-mount
          SFS=$(find /tmp/iso-mount -name 'airootfs.sfs' | head -1)
          echo "Found squashfs: $SFS"
          mkdir -p /tmp/airootfs-extracted
          # -processors matches runner core count; single biggest win for
          # this step since unsquashfs was running single-threaded before.
          # Note: this step itself runs on an amd64 runner regardless of
          # matrix.arch -- unsquashfs just reads the squashfs data format,
          # which is arch-agnostic, so it doesn't need to run on-arch.
          sudo unsquashfs -d /tmp/airootfs-extracted -processors "$(nproc)" "$SFS"
          sudo umount /tmp/iso-mount
          echo "Extracted file count: $(find /tmp/airootfs-extracted -type f | wc -l)"

      - name: Download previous build manifest from SourceForge
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SSHPASS: ${{ secrets.SF_PASS }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts
          # Per-arch baseline -- the two arches' rootfs contents diverge
          # completely (different kernel package, no linux-firmware-intel
          # on aarch64, etc.), so diffing aarch64's current manifest
          # against an x86_64 baseline would flag nearly every file as
          # "changed" and produce a useless, enormous patch.
          sshpass -e rsync -avP \
            "$SF_USER@frs.sourceforge.net:/home/frs/project/kibaos/ota/last-build-manifest-${{ matrix.arch }}.txt" \
            ./last-build-manifest.txt 2>/dev/null || \
            echo "No previous manifest found — this is a full baseline build."

      # ── Manifest generation: parallel hashing instead of one sha256sum ────
      # per file in a serial while-read loop. find -print0 | xargs -P only
      # forks as many sha256sum processes as you have cores, batched, instead
      # of one fork per file. On a full desktop rootfs (50k+ files) this is
      # the single biggest time sink in the old workflow — easily 10-20x
      # faster than the per-line bash/awk loop.
      - name: Generate current build manifest
        run: |
          cd /tmp/airootfs-extracted
          sudo find . -type f -print0 \
            | xargs -0 -P "$(nproc)" -n 64 sudo sha256sum 2>/dev/null \
            | sed 's|sudo: ||' \
            > "$GITHUB_WORKSPACE/current-build-manifest.txt" || true
          cd "$GITHUB_WORKSPACE"
          echo "Manifest entries: $(wc -l < current-build-manifest.txt)"

      - name: Compute changed files vs previous build
        id: diff
        run: |
          PATCH_NUM="${{ needs.build.outputs.patch_num }}"

          if [ ! -f last-build-manifest.txt ]; then
            echo "No previous manifest — skipping OTA patch generation for this baseline build."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            cp current-build-manifest.txt baseline-manifest.txt
          else
            echo "Diffing against previous build manifest..."
            sort -k2 last-build-manifest.txt    > prev-sorted.txt
            sort -k2 current-build-manifest.txt > curr-sorted.txt

            # Lines only in curr-sorted (new or changed hash) = changed files.
            # comm -13 needs both inputs sorted identically; since hash is
            # column 1 and path is column 2, a changed file produces a
            # different full line, so a plain comm on full lines works.
            comm -13 prev-sorted.txt curr-sorted.txt | awk '{print $2}' > changed_files.txt

            CHANGED=$(wc -l < changed_files.txt)
            echo "Changed files: $CHANGED"
            head -20 changed_files.txt
            [ "$CHANGED" -gt 20 ] && echo "... and $((CHANGED - 20)) more"

            if [ "$CHANGED" -eq 0 ]; then
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            else
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            fi
            cp current-build-manifest.txt baseline-manifest.txt
          fi

      # ── Bundling: parallel copy instead of serial cp in a while loop ──────
      - name: Bundle OTA patch from extracted airootfs
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          PATCH_NUM="${{ needs.build.outputs.patch_num }}"
          ARCH="${{ matrix.arch }}"
          PATCH_DIR="ota-patch-${PATCH_NUM}-${ARCH}"
          mkdir -p "${PATCH_DIR}"

          echo "Bundling changed files from extracted airootfs..."
          # rsync --files-from does one pass with internal parallelism for
          # directory creation + copy, instead of mkdir -p + cp per file.
          sed 's|^\./||' changed_files.txt > changed_files_rel.txt

          # Run rsync as root so files owned by root in the extracted airootfs can be read.
          # --ignore-missing-args prevents rsync exiting non-zero if a listed path is absent.
          sudo rsync -a --files-from=changed_files_rel.txt --ignore-missing-args \
            /tmp/airootfs-extracted/ "${PATCH_DIR}/"

          # Ensure files are readable by the runner for later steps.
          # Make files readable and directories enterable, then chown to the current user so subsequent steps don't need sudo.
          sudo chmod -R a+rX "${PATCH_DIR}"
          sudo chown -R "$(id -u):$(id -g)" "${PATCH_DIR}" || true

          mkdir -p "${PATCH_DIR}/etc/kibaos"
          echo "${PATCH_NUM}" > "${PATCH_DIR}/etc/kibaos/patch-level"

          cd "${PATCH_DIR}"
          find . -type f -print0 \
            | xargs -0 -P "$(nproc)" -n 64 sha256sum \
            > "../kibaos-ota-${PATCH_NUM}-${ARCH}-manifest.txt"
          cd ..

          echo "Patch manifest:"
          cat "kibaos-ota-${PATCH_NUM}-${ARCH}-manifest.txt"

          # Arch-tagged tarball name -- matches what kibaos-ota (the
          # on-device daemon) requests via $(uname -m) at patch-apply
          # time, so an aarch64 device only ever pulls the aarch64 patch.
          tar czf "kibaos-ota-${PATCH_NUM}-${ARCH}.tar.gz" "${PATCH_DIR}/"
          echo "Patch size: $(du -sh kibaos-ota-${PATCH_NUM}-${ARCH}.tar.gz | cut -f1)"

      - name: Sign OTA patch
        if: steps.diff.outputs.has_changes == 'true'
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          echo "$OTA_SIGNING_KEY" | gpg --batch --import
          KEY_FP=$(gpg --list-keys --with-colons ota@kibaos.wolftech.tech \
            | awk -F: '/^fpr/{print $10; exit}')
          echo "${KEY_FP}:6:" | gpg --import-ownertrust

          PATCH_NUM="${{ needs.build.outputs.patch_num }}"
          ARCH="${{ matrix.arch }}"
          gpg --batch --yes \
              --local-user ota@kibaos.wolftech.tech \
              --detach-sign --armor \
              "kibaos-ota-${PATCH_NUM}-${ARCH}.tar.gz"

          gpg --verify "kibaos-ota-${PATCH_NUM}-${ARCH}.tar.gz.asc" \
                       "kibaos-ota-${PATCH_NUM}-${ARCH}.tar.gz" && \
            echo "Signature verified OK." || \
            { echo "Signature self-check failed!"; exit 1; }

      - name: Write latest-patch-level
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          # Shared across both arches on purpose -- PATCH_NUM is the same
          # run_number for both matrix legs, and kibaos-ota only uses this
          # number to decide *whether* to update, then fetches the
          # arch-tagged tarball for that same number. One shared file
          # here is correct as long as both matrix legs actually produce
          # a patch for this run (they do, barring a build failure).
          echo "${{ needs.build.outputs.patch_num }}" > latest-patch-level

      # ── Single batched rsync instead of one connection per file ───────────
      - name: Upload OTA artifacts to SourceForge
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SSHPASS: ${{ secrets.SF_PASS }}
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SSHPASS" ]; then
            echo "SourceForge credentials not configured. Skipping."
            exit 0
          fi
          mkdir -p ~/.ssh
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts
          PATCH_NUM="${{ needs.build.outputs.patch_num }}"
          ARCH="${{ matrix.arch }}"

          echo "Uploading baseline manifest..."
          sshpass -e rsync -avP \
            "baseline-manifest.txt" \
            "$SF_USER@frs.sourceforge.net:/home/frs/project/kibaos/ota/last-build-manifest-${ARCH}.txt"

          if [ "${{ steps.diff.outputs.has_changes }}" == "true" ]; then
            sshpass -e rsync -avP \
              "kibaos-ota-${PATCH_NUM}-${ARCH}.tar.gz" \
              "kibaos-ota-${PATCH_NUM}-${ARCH}.tar.gz.asc" \
              "kibaos-ota-${PATCH_NUM}-${ARCH}-manifest.txt" \
              "$SF_USER@frs.sourceforge.net:/home/frs/project/kibaos/ota/"
            echo "OTA patch ${PATCH_NUM} (${ARCH}) uploaded."
          else
            echo "No changes for ${ARCH} — only baseline manifest updated."
          fi

          # latest-patch-level is shared/arch-agnostic (see previous step)
          # -- only push it once, from the x86_64 leg, so the two matrix
          # jobs don't race to overwrite it with the same value.
          if [ "${ARCH}" = "x86_64" ]; then
            sshpass -e rsync -avP \
              "latest-patch-level" \
              "$SF_USER@frs.sourceforge.net:/home/frs/project/kibaos/ota/"
          fi

      - name: Tag this build
        if: steps.diff.outputs.has_changes == 'true' && matrix.arch == 'x86_64'
        run: |
          # Tag once per run, not once per matrix leg -- the tag is a
          # marker for the run/patch number, not per-arch.
          git config user.name  "KibaOS OTA Bot"
          git config user.email "ota@kibaos.wolftech.tech"
          git tag "ota-patch-${{ needs.build.outputs.patch_num }}"
          git push origin "ota-patch-${{ needs.build.outputs.patch_num }}" 2>/dev/null || true
