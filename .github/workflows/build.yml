name: "Build KibaOS"
on:
  workflow_dispatch:
  repository_dispatch:
    types: [kernel-update]
  workflow_run:
    workflows: ["Monitor CachyOS Kernel"]
    types: [completed]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"

      - name: Run build in Docker
        run: |
          docker run --rm --privileged \
            -v "$PWD:/w" \
            -e RUN_NUM="${{ github.run_number }}" \
            archlinux:latest \
            /bin/bash /w/build.sh

      - name: Upload ISO to SourceForge
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SSHPASS: ${{ secrets.SF_PASS }}
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SSHPASS" ]; then
            echo "SourceForge credentials not configured. Skipping upload."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y sshpass rsync
          mkdir -p ~/.ssh
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts
          for iso_file in *.iso; do
            [ -f "$iso_file" ] || continue
            echo "Uploading $iso_file to SourceForge..."
            sshpass -e rsync -avP \
              "$iso_file" \
              "$SF_USER@frs.sourceforge.net:/home/frs/project/kibaos/"
          done

  ota-patch:
    runs-on: ubuntu-latest
    needs: build-and-upload
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to diff against last tag

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg sshpass rsync

      - name: Import OTA signing key
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          echo "$OTA_SIGNING_KEY" | gpg --batch --import
          # Trust the key fully
          KEY_FP=$(gpg --list-keys --with-colons ota@kibaos.wolftech.dev \
            | awk -F: '/^fpr/{print $10; exit}')
          echo "${KEY_FP}:6:" | gpg --import-ownertrust

      - name: Determine changed files since last patch
        id: changes
        run: |
          # Find the last OTA tag, fall back to first commit
          LAST_TAG=$(git tag -l 'ota-patch-*' | sort -V | tail -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous OTA tag found — bundling all tracked files."
            git ls-files > changed_files.txt
          else
            echo "Diffing against $LAST_TAG"
            git diff --name-only "${LAST_TAG}" HEAD > changed_files.txt
          fi
          echo "Changed files:"
          cat changed_files.txt
          CHANGED_COUNT=$(wc -l < changed_files.txt)
          echo "count=${CHANGED_COUNT}" >> $GITHUB_OUTPUT

      - name: Bundle patch
        if: steps.changes.outputs.count > 0
        run: |
          PATCH_NUM="${{ github.run_number }}"
          PATCH_DIR="ota-patch-${PATCH_NUM}"
          mkdir -p "${PATCH_DIR}"

          # Copy changed files preserving directory structure
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            mkdir -p "${PATCH_DIR}/$(dirname $f)"
            cp "$f" "${PATCH_DIR}/${f}"
          done < changed_files.txt

          # Write patch level file into bundle
          echo "${PATCH_NUM}" > "${PATCH_DIR}/etc/kibaos/patch-level"

          # Generate SHA256 manifest
          find "${PATCH_DIR}" -type f | while read -r file; do
            REL="${file#${PATCH_DIR}/}"
            sha256sum "${file}" | awk -v p="./${REL}" '{print $1"  "p}'
          done > "manifest-${PATCH_NUM}.txt"

          echo "Manifest:"
          cat "manifest-${PATCH_NUM}.txt"

          # Create tarball
          tar czf "kibaos-ota-${PATCH_NUM}.tar.gz" "${PATCH_DIR}/"
          echo "Patch bundle size: $(du -sh kibaos-ota-${PATCH_NUM}.tar.gz | cut -f1)"

      - name: Sign patch
        if: steps.changes.outputs.count > 0
        run: |
          PATCH_NUM="${{ github.run_number }}"
          gpg --batch --yes \
              --local-user ota@kibaos.wolftech.dev \
              --detach-sign --armor \
              "kibaos-ota-${PATCH_NUM}.tar.gz"
          echo "Signature created."
          gpg --verify "kibaos-ota-${PATCH_NUM}.tar.gz.asc" \
                       "kibaos-ota-${PATCH_NUM}.tar.gz" && \
            echo "Signature self-verified OK." || \
            { echo "Signature verification failed!"; exit 1; }

      - name: Write latest-patch-level file
        if: steps.changes.outputs.count > 0
        run: echo "${{ github.run_number }}" > latest-patch-level

      - name: Upload patch + manifest + level to SourceForge
        if: steps.changes.outputs.count > 0
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SSHPASS: ${{ secrets.SF_PASS }}
        run: |
          if [ -z "$SF_USER" ] || [ -z "$SSHPASS" ]; then
            echo "SourceForge credentials not configured. Skipping OTA upload."
            exit 0
          fi
          mkdir -p ~/.ssh
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts
          PATCH_NUM="${{ github.run_number }}"
          for f in \
            "kibaos-ota-${PATCH_NUM}.tar.gz" \
            "kibaos-ota-${PATCH_NUM}.tar.gz.asc" \
            "manifest-${PATCH_NUM}.txt" \
            "latest-patch-level"; do
            echo "Uploading ${f}..."
            sshpass -e rsync -avP \
              "${f}" \
              "$SF_USER@frs.sourceforge.net:/home/frs/project/kibaos/ota/"
          done
          echo "OTA patch ${PATCH_NUM} uploaded."

      - name: Tag this OTA release
        if: steps.changes.outputs.count > 0
        run: |
          git config user.name  "KibaOS OTA Bot"
          git config user.email "ota@kibaos.wolftech.dev"
          git tag "ota-patch-${{ github.run_number }}"
          git push origin "ota-patch-${{ github.run_number }}" 2>/dev/null || true

      - name: Skip notice
        if: steps.changes.outputs.count == 0
        run: echo "No changed files detected. OTA patch skipped."
