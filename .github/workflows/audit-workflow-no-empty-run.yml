name: "Audit Workflow No Empty Run"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          ! grep -r 'run: ""' .github/workflows/ | grep . || (echo "::error::Empty run blocks found" && exit 1)
