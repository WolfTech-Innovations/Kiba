name: Zsh Compinit -u Check

on:
  push:
    paths:
      - "scripts/kibatv_build.sh"
  pull_request:
    paths:
      - "scripts/kibatv_build.sh"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
heckout@11bd71901bbe5b1630ceea73d27597364c9af683/a         with:
          persist-credentials: false

      - name: Zsh Compinit -u Check
        run: |
          grep -q "compinit" scripts/kibatv_build.sh && ! grep -q "compinit.*-u" scripts/kibatv_build.sh && { echo "Error: missing -u"; false; } || true
