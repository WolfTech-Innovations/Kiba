name: Zsh Compinit -u Check

on:
  push:
    paths:
      - ".github/workflows/kiba.yml"
  pull_request:
    paths:
      - ".github/workflows/kiba.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Zsh Compinit -u Check
        run: |
          grep -q "compinit" .github/workflows/kiba.yml && ! grep -q "compinit.*-u" .github/workflows/kiba.yml && { echo "Error: missing -u"; false; } || true
