name: PR Size Labeler
on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  size_labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
