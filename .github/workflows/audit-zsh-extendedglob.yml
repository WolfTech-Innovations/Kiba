name: Audit Zsh Extendedglob

on:
  push:
    paths:
      - ".github/workflows/kiba.yml"
  pull_request:
    paths:
      - ".github/workflows/kiba.yml"

jobs:
  audit-extendedglob:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify Extendedglob Usage
        run: |
          if grep -q "(#q" .github/workflows/kiba.yml; then
            if ! grep -q "setopt extendedglob" .github/workflows/kiba.yml; then
              echo "Error: setopt extendedglob must be enabled before using glob qualifiers like (#q...)"
              exit 1
            fi
          fi
