name: Update Roadmap from Milestones
on:
  milestone:
    types: [created, edited, closed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Update README Roadmap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MILESTONES=$(gh milestone list --json title,description,dueOn --state open)
          echo "### Roadmap" > roadmap.md
          echo "$MILESTONES" | jq -r '.[] | "* **" + .title + "**: " + (.description // "No description")' >> roadmap.md
          # Logic to inject roadmap.md into README.md would go here
          cat roadmap.md
