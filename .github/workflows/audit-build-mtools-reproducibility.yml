name: Audit Build Mtools Reproducibility

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run Build Audit
        shell: bash
        run: |
          if grep -rnE "\b(mcopy|mmd)\b" scripts/ | grep -v "LC_CTYPE=C"; then
            echo "Error: Use 'LC_CTYPE=C' before mtools commands for reproducibility"
            exit 1
          fi
