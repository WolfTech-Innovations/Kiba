name: "Audit: Pacman NoExtract"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Pacman NoExtract"
        run: |
          if [ -f "pacman.conf" ]; then grep -q "NoExtract" pacman.conf || { echo 'Error: NoExtract policy missing in pacman.conf'; exit 1; }; fi
