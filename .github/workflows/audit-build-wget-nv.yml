name: Audit Build Wget Nv

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for wget non-verbose
        run: |
          # Robust check for wget without -nv, -q, or --no-verbose
          grep -rnE "^[^#]*wget " scripts/ | grep -vE "(\-nv|\-q|\-\-no\-verbose|\-\-quiet)" && (echo "Use 'wget -nv' or '-q' in build scripts to keep logs clean" && exit 1) || exit 0
