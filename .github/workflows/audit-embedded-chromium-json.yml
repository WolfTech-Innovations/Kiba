name: Audit Embedded Chromium JSON
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Chromium JSON
        run: |
          sed -n "/cat > \/etc\/chromium\/policies\/managed\/kibaos\.json << 'CPOLICY'/,/CPOLICY/p" .github/workflows/kiba.yml | grep -v "CPOLICY" > policy.json
          [ -s policy.json ] || (echo "Chromium policy not found or empty" && exit 1)
          jq . policy.json || (echo "Invalid JSON in Chromium policy" && exit 1)
