name: Docs No Placeholder Text
on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'
jobs:
  check-placeholders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
heckout@11bd71901bbe5b1630ceea73d27597364c9af683/a         with:
          persist-credentials: false
      - name: Scan for TODO/FIXME
        run: |
          set -euo pipefail
          grep -rnE "TODO|FIXME|\[INSERT.*\]" . --include="*.md" && { echo "Error: Placeholder text found in documentation."; exit 1; } || echo "No placeholders found in docs."
