name: Audit Markdown Table Of Contents Header

on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Check TOC header level
        run: |
          grep -rn "Table of Contents" . --include="*.md" | grep -v "## Table of Contents" && (echo "Table of Contents should be H2 (##)" && exit 1) || exit 0
