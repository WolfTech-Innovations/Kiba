name: Audit Shell Echo vs Printf
on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Echo Usage
        run: |
          if grep -rn "echo \$" .; then
            echo "Error: Use 'printf' instead of 'echo' when printing variables to avoid issues with flags or backslashes."
            exit 1
          fi
