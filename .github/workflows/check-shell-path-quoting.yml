name: Check Shell Path Quoting

on:
  push:
    paths:
      - "**/*.sh"
  pull_request:
    paths:
      - "**/*.sh"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check Shell Path Quoting
        run: |
          for f in $(find . -name "*.sh"); do grep -E "chmod|chown|rm|cp|mv" "$f" | grep -E "\$[A-Z_]+" | grep -v "\"\$" && { echo "Warning in $f"; }; done || true
