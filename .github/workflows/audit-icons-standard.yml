name: "Audit: Icons Standard"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Icons Standard"
        run: |
          grep -q "kora-icon-theme" build.sh || { echo 'Error: Kora icon theme missing in build.sh'; exit 1; }
