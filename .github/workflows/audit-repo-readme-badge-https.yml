name: Audit Repo Readme Badge Https

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    name: Run Audit Repo Readme Badge Https
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          chmod +x scripts/repo_audit.sh
          ./scripts/repo_audit.sh --audit-repo-readme-badge-https
