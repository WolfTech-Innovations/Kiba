name: Audit Repo README Badge HTTPS
on:
  push:
    paths: [ 'README.md' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTTPS
        run: |
          if grep -oE "http://img\.shields\.io/[^)]+" README.md; then
            echo "Error: Found insecure HTTP badge links."
            exit 1
          fi
        shell: bash
