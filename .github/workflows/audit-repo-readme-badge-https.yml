name: Audit Repo README Badge HTTPS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Repo README Badge HTTPS
        run: bash scripts/repo_audit.sh --check repo_readme_badge_https
        shell: bash
