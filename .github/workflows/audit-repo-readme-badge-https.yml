name: Audit Repo README Badge HTTPS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          if [ -f "README.md" ]; then
            if grep "http://" README.md | grep "img.shields.io"; then
              echo "ERROR: README badges should use HTTPS"
              exit 1
            fi
          fi
