name: "Audit Repo README Badge HTTPS"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check badge URLs
        run: |
          ! grep 'http://img.shields.io' README.md
        shell: bash
