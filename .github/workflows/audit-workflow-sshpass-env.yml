name: Audit Workflow Sshpass Env
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check sshpass usage
        run: |
          if grep -rn "sshpass -p" .github/workflows/; then
            echo "Error: Use 'sshpass -e' instead of '-p' for improved security."
            exit 1
          fi
