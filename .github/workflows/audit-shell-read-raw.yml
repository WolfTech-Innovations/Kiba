name: Audit Shell Read Raw

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run Shell Audit
        shell: bash
        run: |
          if grep -rnE "^[^#]*\bread\b" . --include="*.sh" | grep -v "\-r"; then
            echo "Error: Use 'read -r' to prevent backslashes from being interpreted"
            exit 1
          fi
