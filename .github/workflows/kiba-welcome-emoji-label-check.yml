name: Kiba Welcome Emoji Label Check

on:
  push:
    paths:
      - "scripts/kibatv-build.sh"
  pull_request:
    paths:
      - "scripts/kibatv-build.sh"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Kiba Welcome Emoji Label Check
        run: |
          grep -q "kiba-welcome" scripts/kibatv-build.sh && ! grep -q "[🚀🌐🛍️🖥️📂⚙️⌨️✨]" scripts/kibatv-build.sh && { echo "Warning: missing emojis"; } || true
