name: Audit Build Sed No Bak

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for sed backup files
        run: |
          # Robust check for sed -i with a suffix
          grep -rnE "^[^#]*sed -i[a-zA-Z0-9]+" scripts/ && (echo "Avoid creating sed backup files in build scripts unless necessary" && exit 1) || exit 0
