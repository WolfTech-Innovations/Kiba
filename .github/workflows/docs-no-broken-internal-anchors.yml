name: Docs No Broken Internal Anchors
on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for broken internal anchors
        run: |
          # Audit for broken [#anchor] links within the same file
          errors=0
          while read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            anchor=$(echo "$line" | sed -E 's/.*\(#([a-z0-9-]+)\).*/\1/')
            # This is a basic check; real anchor generation is more complex
            if ! grep -qi "^#.*$anchor" "$file"; then
              echo "Potential broken anchor: #$anchor in $file"
              errors=$((errors + 1))
            fi
          done < <(grep -rnE "\[.*\]\(#[a-z0-9-]+\)" . --include="*.md")

          if [ $errors -gt 0 ]; then
            echo "Found $errors broken anchor(s)"
            exit 1
          fi
