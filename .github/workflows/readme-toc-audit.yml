name: "README TOC audit"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: README TOC audit
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          if [ $(wc -l < README.md) -gt 100 ]; then grep -qi "## Table of Contents" README.md || (echo "Missing TOC" && exit 1); fi
