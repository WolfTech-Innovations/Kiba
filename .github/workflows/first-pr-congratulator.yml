name: First PR Congratulator

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  congratulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for First PR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_COUNT=$(gh pr list --author "$PR_USER" --state all --json number --jq '. | length')
          if [ "$PR_COUNT" -eq 1 ]; then
            gh pr comment "$PR_NUMBER" --body "🎉 Congratulations on your first PR to KibaOS, @$PR_USER! We appreciate your contribution."
          fi
