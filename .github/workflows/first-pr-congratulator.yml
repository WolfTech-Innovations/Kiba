name: First PR Congratulator

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  congratulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for First PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_COUNT=$(gh pr list --repo ${{ github.repository }} --author "${{ github.event.pull_request.user.login }}" --state all --json number --jq '. | length')
          if [ "$PR_COUNT" -eq 1 ]; then
            gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "🎉 Congratulations on your first PR to KibaOS, @${{ github.event.pull_request.user.login }}! We appreciate your contribution."
          fi
