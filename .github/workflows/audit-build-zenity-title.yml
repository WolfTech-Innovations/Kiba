name: Audit Build Zenity Title

on:
  push:
    paths:
      - 'scripts/kibaos_build.sh'
  pull_request:
    paths:
      - 'scripts/kibaos_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check For Zenity Title
        run: |
          if grep "zenity" scripts/kibaos_build.sh | grep -v "\-\-title="; then
            echo "Error: zenity dialogs should have a --title specified"
            exit 1
          fi
