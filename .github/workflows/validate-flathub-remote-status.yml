name: Validate Flathub Remote Status
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
permissions:
  issues: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Endpoint
        run: curl --silent --fail https://dl.flathub.org/repo/flathub.flatpakrepo || (echo "Flathub remote is down" && exit 1)
