name: Check Workflow Deprecated Actions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check_workflow_deprecated_actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit for deprecated actions/checkout versions
        run: |
          grep "actions/checkout@v[1-2]" .github/workflows/*.yml && exit 1 || exit 0
