name: Enforce Shell Readonly Const

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  enforce_shell_readonly_const:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure constants are readonly
        run: |
          grep -r "[A-Z_]\+=" . --include="*.sh" | grep -v "readonly " && exit 1 || exit 0
