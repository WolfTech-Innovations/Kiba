name: Repo Stats
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Stats
        run: |
          echo "### KibaOS Repository Metrics"
          echo "#### Code Statistics"
          find . -type f \( -name "*.sh" -o -name "*.py" -o -name "*.js" \) -not -path "./node_modules/*" | xargs wc -l

          echo "#### UI and Asset Statistics"
          echo "Branding Images: $(find branding -type f \( -name "*.png" -o -name "*.jpg" \) | wc -l)"
          echo "Documentation Files: $(find docs -name "*.md" | wc -l)"
          echo "GitHub Workflows: $(find .github/workflows -name "*.yml" | wc -l)"
