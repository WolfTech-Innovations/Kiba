name: Audit Build Xorriso Volid Kibaos

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check ISO Volume ID
        run: |
          if ! grep -q "iso-volume \"KIBAOS\"" .github/workflows/kiba.yml; then
            echo "Error: Live-build should use --iso-volume KIBAOS"
            exit 1
          fi
