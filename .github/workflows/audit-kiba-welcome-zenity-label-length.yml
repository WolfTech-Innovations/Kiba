name: Audit Kiba Welcome Zenity Label Length
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Label Lengths
        run: |
          sed -n "/cat > \/usr\/local\/bin\/kiba-welcome << 'WELCOME'/,/WELCOME/p" .github/workflows/kiba.yml | grep -v "WELCOME" > kiba-welcome
          if [ ! -s kiba-welcome ]; then
            echo "kiba-welcome not found"
            exit 1
          fi
          while read -r label; do
            if [ ${#label} -gt 100 ]; then
              echo "Label too long: $label"
              exit 1
            fi
          done < <(grep -oP '"[^"]+"' kiba-welcome)
