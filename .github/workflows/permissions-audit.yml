name: "GitHub Actions Permissions Audit"
on:
  pull_request:
    paths: [ '.github/workflows/**' ]

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for top-level write-all
        run: "! grep -r 'permissions: write-all' .github/workflows/"
