name: "KibaOS First Login Sanity"
on:
  pull_request:
    paths: [ 'build.sh' ]

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify gsettings keys
        run: "grep 'gsettings set' build.sh | cut -d' ' -f4 | sort -u"
