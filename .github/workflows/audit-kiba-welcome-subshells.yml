name: Audit Kiba Welcome Subshells
on:
  push:
    paths:
      - 'build.sh'
      - 'scripts/**'
  pull_request:
    paths:
      - 'build.sh'
      - 'scripts/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check background subshells
        run: |
          if ! grep -qE "\(.*\) &" build.sh; then
             echo "Error: kiba-welcome scripts must wrap informational calls in background sub-shells ( ... ) &"
             exit 1
          fi
