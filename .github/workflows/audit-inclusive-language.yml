name: Audit Inclusive Language
on:
  push:
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for non-inclusive language
        run: |
          # Check for terms like blacklist, whitelist, master (unless git branch), slave
          # Exclude .github/workflows to avoid matching the audit scripts themselves
          grep -rnEi "blacklist|whitelist|slave" . --exclude-dir=".github" && { echo "Non-inclusive language found"; exit 1; } || echo "Inclusive language check passed"
