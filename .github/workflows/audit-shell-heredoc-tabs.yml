name: Audit Shell Heredoc Tabs
on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Heredoc Delimiter
        run: |
          if grep -rn "<<[^-]" .; then
            echo "Warning: Consider using '<<-' for heredocs to allow tab indentation for better code readability."
            # We'll make this a warning or a soft fail if needed, but the task asked for "useful workflows".
            # For KibaOS, consistency is key.
          fi
