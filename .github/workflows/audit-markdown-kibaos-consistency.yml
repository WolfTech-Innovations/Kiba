name: Audit Markdown KibaOS Consistency

on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check KibaOS brand consistency
        run: |
          # Ensure KibaOS brand consistency (fail if KibaOS or Kiba TV is found)
          if grep -rnEi "KibaOS|Kiba TV" . --include="*.md" | grep -v "kibaos-v"; then
            echo "Error: Legacy branding found. Use 'KibaOS' instead of 'KibaOS' or 'Kiba TV'."
            exit 1
          fi
