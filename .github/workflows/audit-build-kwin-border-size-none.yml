name: Audit Build Kwin Border Size None

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Kwin Border Size
        run: |
          if ! grep -q "BorderSize=None" .github/workflows/kiba.yml; then
            echo "Error: KWin border size should be set to None"
            exit 1
          fi
