name: ISO Entropy Blob Detection
on:
  workflow_run:
    workflows: ["KibaOS Build"]
    types: [completed]
  workflow_dispatch:

jobs:
  entropy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Download ISO Artifact
        uses: actions/download-artifact@v4
        with:
          name: kibaos-iso
          path: .
        continue-on-error: true

      - name: Scan for High-Entropy Blobs
        run: |
          ISO_FILE=$(ls *.iso | head -1)
          [ -z "$ISO_FILE" ] && echo "No ISO found" && exit 0

          echo "### ISO Entropy Audit" >> $GITHUB_STEP_SUMMARY
          echo "Scanning for uncompressed/high-entropy segments that might indicate embedded binaries or encrypted data." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Offset | Entropy | Severity |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|----------|" >> $GITHUB_STEP_SUMMARY

          # Use binwalk if available, or a simple head/entropy check
          # For CI, we'll use a simple python script to check entropy of chunks
          python3 -c "
          import math, sys
          def entropy(data):
              if not data: return 0
              counts = [0] * 256
              for b in data: counts[b] += 1
              ent = 0.0
              for count in counts:
                  if count == 0: continue
                  p = float(count) / len(data)
                  ent -= p * math.log(p, 2)
              return ent

          with open('$ISO_FILE', 'rb') as f:
              chunk_size = 1024 * 1024
              offset = 0
              high_entropy_found = False
              while True:
                  chunk = f.read(chunk_size)
                  if not chunk: break
                  e = entropy(chunk)
                  if e > 7.9: # Very high entropy
                      print(f'| {offset} | {e:.4f} | CRITICAL |')
                      high_entropy_found = True
                  offset += chunk_size
          " >> $GITHUB_STEP_SUMMARY || true

          echo "Audit complete." >> $GITHUB_STEP_SUMMARY
