name: Codespell
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  codespell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run codespell
        uses: codespell-project/actions-codespell@v2
        with:
          ignore_words_file: .codespellignore
          skip: "./.git,./pnpm-lock.yaml"
