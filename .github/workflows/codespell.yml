name: Spell Check
on: [push, pull_request]

jobs:
  codespell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: codespell-project/actions-codespell@v2
        with:
          ignore_words_file: .codespellignore
          skip: "./.git,./pnpm-lock.yaml"
