name: Check Shell Ifs Leaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check_shell_ifs_leaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure IFS is localized or reset
        run: |
          grep -r "IFS=" . --include="*.sh" | grep -v "local IFS" && exit 1 || exit 0
