name: "Audit Workflow Checkout V4"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check checkout version
        run: |
          ! grep -r 'uses: actions/checkout@' .github/workflows/ | grep -vE '@v4|@[a-f0-9]{40}'
        shell: bash
