name: "Validate Commit Messages"
on:
  pull_request:
    types: [ opened, edited, synchronized ]

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6
