name: Weekly Repository Health Summary
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Summary
        run: |
          echo "# Weekly Health Summary" > summary.md
          echo "Generated on $(date)" >> summary.md
          echo "## Repository Audit" >> summary.md
          bash scripts/repo_audit.sh >> summary.md 2>&1 || echo "Audit found issues." >> summary.md
          echo "## Workflow Syntax" >> summary.md
          python3 check_workflows.py >> summary.md 2>&1 || echo "Workflow syntax check found issues." >> summary.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated update [skip ci]" && git push)
