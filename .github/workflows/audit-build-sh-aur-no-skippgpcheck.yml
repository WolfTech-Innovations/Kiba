name: "Audit Build SH AUR PGP Check"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for --skippgpcheck removal
        run: |
          ! grep -q '--skippgpcheck' build.sh
        shell: bash
