name: CachyOS Kernel Monitor
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest CachyOS kernel
        run: |
          curl -s https://mirror.cachyos.org/repo/x86_64/main/ | grep -oP 'linux-cachyos-[0-9][^"-]*\.pkg\.tar\.zst' | head -n 1
