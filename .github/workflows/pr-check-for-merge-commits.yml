name: PR Check for Merge Commits
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
        with:
          fetch-depth: 0
      - name: Verify no merge commits
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Use HEAD instead of origin/main to avoid dependency on origin branch naming
          # We check commits between base and head of PR
          git rev-list --merges "origin/$BASE_REF..$HEAD_SHA" | grep . && { echo "Error: Merge commits are not allowed. Please rebase."; exit 1; } || echo "No merge commits found."
