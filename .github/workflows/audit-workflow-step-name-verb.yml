name: Audit Workflow Step Name Verb
on:
  push:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Step Names
        run: |
          # Audit for step names that don't start with a standard verb (Check, Run, Audit, Install, etc.)
          if grep -r "name: " .github/workflows/ | grep -vE "name: (Check|Run|Audit|Install|Setup|Verify|Build|Release|Upload|Download|Configure|Wait|Sync|Clean|Update|Notify|Validate|Analyze|Scan|Test|Complete|Submit|Record|Request|Set|Restore|Delete|Rename|View|Message)"; then
             echo "Warning: Step names should ideally start with a verb for clarity."
          fi
