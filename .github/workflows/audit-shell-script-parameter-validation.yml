name: Audit Shell Script Parameter Validation

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check params
        run: |
          grep -r "\$#" . --include="*.sh" || (echo "Parameter validation ($#) recommended for scripts" && exit 1)
