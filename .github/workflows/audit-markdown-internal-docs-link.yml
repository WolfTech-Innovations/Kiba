name: Audit Markdown Internal Docs Link
on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links prefix
        run: |
          if grep -rnE "\]\(docs/" . --include="*.md"; then
            echo "Error: Internal documentation links must use the ./docs/ prefix."
            exit 1
          fi
