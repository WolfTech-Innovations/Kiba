name: Audit Build Sha256sum Iso

on:
  push:
    paths:
      - 'scripts/kibatv-build.sh'
  pull_request:
    paths:
      - 'scripts/kibatv-build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Sha256sum Iso
        run: |
          if ! grep -q "sha256sum \"/work/\${ISO}.iso\"" scripts/kibatv-build.sh; then
            echo "Error: sha256sum should be run on the resulting ISO image"
            exit 1
          fi
