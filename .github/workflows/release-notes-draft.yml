name: Release Notes Draft
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Draft Release Notes
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
