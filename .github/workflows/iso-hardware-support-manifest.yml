name: ISO Hardware Support Manifest
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate Hardware Manifest
        run: |
          # Extract firmware packages from build script
          FIRMWARE=$(grep -E "firmware-[a-z-]+" .github/workflows/kiba.yml | sed -E 's/.*(firmware-[a-z-]+).*/\1/' | sort -u)

          echo "### Hardware Support Manifest" >> $GITHUB_STEP_SUMMARY
          echo "This report lists the firmware coverage included in the current ISO build configuration." >> $GITHUB_STEP_SUMMARY

          echo "| Package | Targeted Hardware |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------------------|" >> $GITHUB_STEP_SUMMARY

          for pkg in $FIRMWARE; do
            case "$pkg" in
              "firmware-linux-free") DESC="Generic Free Firmware" ;;
              "firmware-linux-nonfree") DESC="Generic Non-Free (GPU, etc)" ;;
              "firmware-iwlwifi") DESC="Intel Wireless" ;;
              "firmware-realtek") DESC="Realtek NICs/Wireless" ;;
              "firmware-atheros") DESC="Atheros Wireless" ;;
              "firmware-amd-graphics") DESC="AMD/Radeon GPUs" ;;
              "firmware-misc-nonfree") DESC="Misc Devices" ;;
              *) DESC="Broad hardware support" ;;
            esac
            echo "| $pkg | $DESC |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!INFO] This manifest is generated based on package-lists in kiba.yml" >> $GITHUB_STEP_SUMMARY
