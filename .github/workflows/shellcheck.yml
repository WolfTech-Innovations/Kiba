name: ShellCheck
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        shell: bash
        run: |
          find . -name "*.sh" -not -path "./node_modules/*" | xargs shellcheck
