name: ShellCheck
on:
  push:
    paths:
      - '**.sh'
      - 'build.sh'
  pull_request:
    paths:
      - '**.sh'
      - 'build.sh'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        shell: bash
        run: shellcheck build.sh scripts/*.sh
