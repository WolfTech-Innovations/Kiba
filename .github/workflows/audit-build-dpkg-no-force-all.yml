name: Audit Build Dpkg No Force All

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for dpkg --force-all
        run: |
          # Robust check for dpkg --force-all, ignoring comments
          grep -rnE "^[^#]*dpkg .*--force-all" scripts/ && (echo "Avoid 'dpkg --force-all' as it is unsafe; use more specific force options" && exit 1) || exit 0
