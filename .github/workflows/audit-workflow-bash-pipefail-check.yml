name: Audit Workflow Bash Pipefail Check
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check pipefail in workflows
        run: |
          # Checks if pipefail is enabled in complex workflows (e.g., kiba.yml)
          if ! grep -q "set -o pipefail" .github/workflows/kiba.yml; then
            echo "Error: .github/workflows/kiba.yml must include 'set -o pipefail' for reliable CI behavior."
            exit 1
          fi
