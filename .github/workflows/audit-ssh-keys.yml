name: "Audit: SSH Keys"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: SSH Keys"
        run: |
          ! find . -name "id_rsa*" -o -name "id_ed25519*" | grep .
