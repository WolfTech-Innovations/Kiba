name: Audit Build Su C Eatmydata

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check su -c eatmydata
        run: |
          grep "su -c" .github/workflows/kiba.yml | grep -v "eatmydata" && (echo "eatmydata should be used inside su -c strings" && exit 1) || exit 0
