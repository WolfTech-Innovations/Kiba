name: "Audit Workflow No Continue Error"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check continue-on-error
        run: |
          ! grep -r 'continue-on-error: true' .github/workflows/
        shell: bash
