name: Audit WF Job ID Kebab Case

on:
  push:
    paths:
      - ".github/workflows/*.yml"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Job IDs
        run: |
          ! grep -E '^  [a-z0-9]+_[a-z0-9]+' .github/workflows/*.yml
