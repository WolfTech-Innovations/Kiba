name: "KibaOS Skel Sync Check"
on:
  pull_request:
    paths: [ 'build.sh' ]

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check etc/skel consistency
        run: "grep -q 'cp -aT \"${SKEL}/\" /home/liveuser/' build.sh"
