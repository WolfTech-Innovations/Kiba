name: Curl Secure Flags Enforcer

on:
  push:
    paths:
      - "**/*.sh"
  pull_request:
    paths:
      - "**/*.sh"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Curl Secure Flags Enforcer
        run: |
          ERR=0; for f in $(find . -name "*.sh"); do grep "curl" "$f" | grep -vE "\-\-proto \'=https\' \\-\\-tlsv1\.2 \\-Sf" && { echo "Error: $f"; ERR=1; }; done; [ $ERR -eq 0 ]
