name: Audit Branding Fonts
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check for Inter and JetBrains Mono fonts
        run: |
          grep -q 'inter-font' build.sh && grep -q 'ttf-jetbrains-mono' build.sh
