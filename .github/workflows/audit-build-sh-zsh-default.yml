name: Audit Build SH Zsh Default
on:
  push:
    paths: [ 'build.sh' ]
  pull_request:
    paths: [ 'build.sh' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify Zsh
        run: |
          if ! grep -q "chsh -s /usr/bin/zsh root" build.sh; then
            echo "Error: root shell not Zsh."
            exit 1
          fi
        shell: bash
