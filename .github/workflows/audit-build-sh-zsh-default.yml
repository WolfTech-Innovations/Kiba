name: Audit Build Sh Zsh Default
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          if grep -q "zsh" build.sh; then echo "Zsh detected"; else echo "Bash default"; fi
