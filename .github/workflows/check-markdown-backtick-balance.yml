name: Check Markdown Backtick Balance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check_markdown_backtick_balance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure even number of backticks
        run: |
          find . -name "*.md" -exec python3 -c "import sys; content=open(sys.argv[1]).read(); sys.exit(content.count('`') % 2)" {} \;
