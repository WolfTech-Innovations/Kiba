name: Release Notes Naming Validator

on:
  push:
    paths:
      - 'Notes/**'
  workflow_dispatch:

jobs:
  validate-naming:
    permissions:
      contents: write
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
heckout@11bd71901bbe5b1630ceea73d27597364c9af683/a         with:
          persist-credentials: false
      - name: Check NTE naming convention
        run: |
          # Convention: NTE-DDHYM.md
          cd Notes
          for file in *.md; do
            if [[ "$file" == ".gitkeep" ]]; then continue; fi
            if [[ ! "$file" =~ ^NTE-[0-9]{2}[A-Z]{3}\.md$ ]]; then
              echo "Error: $file does not follow NTE-DDHYM.md convention"
              exit 1
            fi
          done
