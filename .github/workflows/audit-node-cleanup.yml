name: "Audit: Node Cleanup"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Node Cleanup"
        run: |
          ! find . -name "node_modules" -type d -not -path "./node_modules" | grep .
