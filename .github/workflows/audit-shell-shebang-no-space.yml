name: Audit Shell Shebang No Space

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run Shell Audit
        shell: bash
        run: |
          if grep -rnE "^#! /" . --include="*.sh"; then
            echo "Error: Do not use a space after #! in shebang lines"
            exit 1
          fi
