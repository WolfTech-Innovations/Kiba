name: Audit Shell Curl Secure

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check curl flags
        run: |
          grep -rnE "\bcurl\b" . --include="*.sh" | while read -r line; do
            if ! echo "$line" | grep -qE "\-f.*\-s.*\-S|\-s.*\-S.*\-f|\-fsS|\-Ssf"; then
              echo "Error: curl should use -f, -s, and -S flags: $line"
              exit 1
            fi
          done
