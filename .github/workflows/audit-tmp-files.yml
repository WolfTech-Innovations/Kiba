name: "Audit: Tmp Files"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Tmp Files"
        run: |
          ! find . -name "*.tmp" -o -name "*.swp" | grep .
