name: Audit Workflow No GitHub Token Leak

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Workflow No GitHub Token Leak
        run: bash scripts/repo_audit.sh --check workflow_no_github_token_leak
        shell: bash
