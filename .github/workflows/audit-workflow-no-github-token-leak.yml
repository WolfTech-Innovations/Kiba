name: Audit Workflow No GitHub Token Leak
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prohibit GitHub Token leaks
        shell: bash
        run: |
          ! grep -rE "echo.*(github\.token|secrets\.)" .github/workflows/ --exclude="audit-workflow-no-github-token-leak.yml"
