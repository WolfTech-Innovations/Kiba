name: Audit Workflow No GitHub Token Leak
on:
  push:
    paths: [ '.github/workflows/*.yml' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check leaks
        run: |
          if grep -rE "echo.*(github\.token|secrets\.)" .github/workflows/; then
            echo "Error: Found potential token/secret leak via echo."
            exit 1
          fi
        shell: bash
