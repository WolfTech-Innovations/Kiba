name: "Audit Workflow Token Leak"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for token leak
        run: |
          ! grep -rE 'echo.*(github\.token|secrets\.)' .github/workflows/
        shell: bash
