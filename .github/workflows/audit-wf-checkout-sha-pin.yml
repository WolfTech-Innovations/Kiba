name: Audit WF Checkout SHA Pin

on:
  push:
    paths:
      - ".github/workflows/*.yml"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check Pinning
        run: |
          grep "uses: actions/checkout@" .github/workflows/*.yml | grep -vE "@[a-f0-9]{40}" && false || true
