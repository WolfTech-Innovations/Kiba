name: "Audit: Curl Pipe Bash"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Curl Pipe Bash"
        run: |
          grep -r "curl.*|.*bash" . --exclude-dir=.git --exclude-dir=.github && { echo 'Error: Dangerous curl | bash pattern found'; exit 1; } || exit 0
