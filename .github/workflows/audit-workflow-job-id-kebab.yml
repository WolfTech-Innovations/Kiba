name: "Audit Workflow Job ID Kebab"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          ! grep -rE '^[ ]{2}[a-z0-9]+_[a-z0-9]+:' .github/workflows/ | grep . || (echo "::error::Job IDs should use kebab-case" && exit 1)
