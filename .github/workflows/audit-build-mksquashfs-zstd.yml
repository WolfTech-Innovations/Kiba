name: Audit Build Mksquashfs Zstd

on:
  push:
    paths:
      - 'scripts/kibatv_build.sh'
  pull_request:
    paths:
      - 'scripts/kibatv_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Mksquashfs Compression
        run: |
          if ! grep "mksquashfs" scripts/kibatv_build.sh | grep -q "\-comp zstd"; then
            echo "Error: mksquashfs should use zstd compression"
            exit 1
          fi
