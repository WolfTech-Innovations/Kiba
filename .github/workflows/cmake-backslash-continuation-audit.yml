name: CMake Backslash Continuation

on:
  push:
    paths:
      - "scripts/kibatv-build.sh"
  pull_request:
    paths:
      - "scripts/kibatv-build.sh"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: CMake Backslash Continuation
        run: |
          grep -n "cmake" scripts/kibatv-build.sh | grep -v "\\\\" | grep -v "cmake \." | grep -v "cmake \.\." && { echo "Warning: potential missing backslash"; } || true
