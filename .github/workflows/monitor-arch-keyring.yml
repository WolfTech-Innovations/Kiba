name: Monitor Arch Keyring

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  monitor_arch_keyring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Alert on archlinux-keyring updates
        run: |
          ls /usr/share/pacman/keyrings/archlinux.gpg || exit 0
