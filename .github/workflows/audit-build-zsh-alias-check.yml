name: Audit Build Zsh Alias

on:
  push:
    paths:
      - "scripts/kibatv_build.sh"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check Alias
        run: |
          grep 'alias please=\'sudo\'' scripts/kibatv_build.sh
