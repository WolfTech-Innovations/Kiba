name: Audit Build Grub Gfxterm

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Grub Gfxterm
        run: |
          if ! grep -q "terminal_output gfxterm" .github/workflows/kiba.yml; then
            echo "Error: GRUB should use terminal_output gfxterm"
            exit 1
          fi
