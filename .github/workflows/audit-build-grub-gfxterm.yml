name: Audit Build Grub Gfxterm

on:
  push:
    paths:
      - 'scripts/kibatv_build.sh'
  pull_request:
    paths:
      - 'scripts/kibatv_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Grub Gfxterm
        run: |
          if ! grep -q "terminal_output gfxterm" scripts/kibatv_build.sh; then
            echo "Error: GRUB should use terminal_output gfxterm"
            exit 1
          fi
