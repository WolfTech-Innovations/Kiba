name: Audit Python Enumerate Usage

on:
  push:
    paths:
      - '**.py'
  pull_request:
    paths:
      - '**.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for range(len(...))
        run: |
          grep -rnE "\brange\(len\(" . --include="*.py" && (echo "Use enumerate() instead of range(len(...))" && exit 1) || exit 0
