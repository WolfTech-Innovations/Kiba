name: Secure APT Keyring Paths

on:
  push:
    paths:
      - ".github/workflows/kiba.yml"
  pull_request:
    paths:
      - ".github/workflows/kiba.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Secure APT Keyring Paths
        run: |
          grep -E "curl|wget" .github/workflows/kiba.yml | grep -E "\.gpg|\.asc" | grep -v "/usr/share/keyrings/" && { echo "Error: insecure path"; false; } || true
