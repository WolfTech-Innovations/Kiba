name: Audit Workflow Unused Workflow Inputs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          # This is a complex check, we'll do a simple grep for input definition vs usage
          echo "Auditing workflow inputs for usage..."
          # Implementation details would go here if we were doing a full parser
          # For now, let's just grep for 'inputs.' in files that have 'workflow_dispatch'
          grep -l "workflow_dispatch" .github/workflows/*.yml | xargs grep -L "inputs\." || true
