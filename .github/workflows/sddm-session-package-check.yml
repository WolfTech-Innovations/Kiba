name: SDDM Session Package Check

on:
  push:
    paths:
      - ".github/workflows/kiba.yml"
  pull_request:
    paths:
      - ".github/workflows/kiba.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: SDDM Session Package Check
        run: |
          S=$(grep "Session=" .github/workflows/kiba.yml | cut -d= -f2); [ -n "$S" ] && ! grep -q "$S" .github/workflows/kiba.yml && { echo "Error: session $S not installed"; false; } || true
