name: SDDM Session Package Check

on:
  push:
    paths:
      - "scripts/kibaos_build.sh"
  pull_request:
    paths:
      - "scripts/kibaos_build.sh"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: SDDM Session Package Check
        run: |
          S=$(grep "Session=" scripts/kibaos_build.sh | cut -d= -f2); [ -n "$S" ] && ! grep -q "$S" scripts/kibaos_build.sh && { echo "Error: session $S not installed"; false; } || true
