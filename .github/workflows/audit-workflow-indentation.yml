name: Audit Workflow Indentation
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for tab indentation
        run: |
          grep -rl $'\t' .github/workflows/*.yml && { echo "Tab indentation found in workflows; use spaces"; exit 1; } || echo "No tabs found"
