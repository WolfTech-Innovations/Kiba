name: Audit Build SH Wallpaper Consistency
on:
  push:
    paths: [ 'build.sh' ]
  pull_request:
    paths: [ 'build.sh' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify wallpaper
        run: |
          if [ $(grep -c "/usr/share/kibaos/wallpaper.png" build.sh) -lt 4 ]; then
            echo "Error: wallpaper.png path usage count low."
            exit 1
          fi
        shell: bash
