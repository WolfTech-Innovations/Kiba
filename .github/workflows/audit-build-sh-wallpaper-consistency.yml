name: "Audit Build SH Wallpaper Consistency"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          grep -q 'branding/wallpaper.png' build.sh || (echo "::error::Default wallpaper path inconsistency in build.sh" && exit 1)
