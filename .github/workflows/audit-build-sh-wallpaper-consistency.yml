name: "Audit Build SH Wallpaper Consistency"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check wallpaper path
        run: |
          grep -q '/usr/share/kibaos/wallpaper.png' build.sh
        shell: bash
