name: Audit build.sh Wallpaper Consistency
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          if [ -f "build.sh" ]; then
            if grep -q "WALLPAPER_URL" build.sh && ! grep -q "wallpaper.png" build.sh; then
              echo "ERROR: Wallpaper variable naming inconsistency"
              exit 1
            fi
          fi
