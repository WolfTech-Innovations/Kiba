name: Audit Build Sh Pacman Populate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          grep -q "pacman-key --populate archlinux" build.sh || (echo "Error: missing pacman-key --populate" && exit 1)
