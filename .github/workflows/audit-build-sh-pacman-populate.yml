name: "Audit Build SH Pacman Populate"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check pacman-key populate
        run: |
          grep -q 'pacman-key --populate archlinux' build.sh
        shell: bash
