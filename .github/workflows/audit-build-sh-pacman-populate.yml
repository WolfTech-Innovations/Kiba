name: Audit Build SH Pacman Populate
on:
  push:
    paths: [ 'build.sh' ]
  pull_request:
    paths: [ 'build.sh' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify pacman populate
        run: |
          if ! grep -q "pacman-key --populate archlinux" build.sh; then
            echo "Error: build.sh is missing pacman-key --populate archlinux"
            exit 1
          fi
        shell: bash
