name: Audit Build Git No Tags

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for git clone no-tags
        run: |
          # Robust check for git clone without --no-tags
          grep -rnE "^[^#]*git clone" scripts/ | grep -vE "\-\-no\-tags" && (echo "Use --no-tags with git clone to minimize data transfer" && exit 1) || exit 0
