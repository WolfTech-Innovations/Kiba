name: Audit Markdown Empty Link Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          if grep -rE "\[[^]]*\]\(\)" . --include="*.md" | grep -v "node_modules"; then
            echo "ERROR: Found empty markdown targets"
            exit 1
          fi
