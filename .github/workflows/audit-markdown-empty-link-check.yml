name: "Audit Markdown Empty Link Check"
on:
  push:
    paths:
      - "**.md"
  pull_request:
    paths:
      - "**.md"
  workflow_dispatch:

jobs:
  audit:
    name: "Audit empty markdown links"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
      - name: "Find empty markdown targets"
        shell: bash
        run: |
          if grep -rE "\[[^]]*\]\(\)" . --include="*.md" | grep -v "node_modules"; then
            echo "Error: Found empty markdown targets"
            exit 1
          fi
