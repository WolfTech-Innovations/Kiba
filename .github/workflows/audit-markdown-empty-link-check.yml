name: Audit Markdown Empty Link Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Markdown Empty Link Check
        run: bash scripts/repo_audit.sh --check markdown_empty_link_check
        shell: bash
