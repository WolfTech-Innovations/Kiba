name: "Audit Markdown Empty Links"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check empty links
        run: |
          ! grep -rE '\[[^]]*\]\(\)' . --include='*.md'
        shell: bash
