name: Audit Workflow PyYAML Dependency
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check PyYAML installation
        run: |
          if grep -l "check_workflows.py" .github/workflows/*.yml | xargs -r grep -L "pip install PyYAML"; then
             echo "Error: Workflows calling check_workflows.py must ensure PyYAML is installed."
             exit 1
          fi
          if grep -rn "pip install PyYAML" .github/workflows/ | grep -v "\-\-break\-system\-packages"; then
             echo "Error: pip install PyYAML must use --break-system-packages."
             exit 1
          fi
