name: Audit Workflow No Empty Run Blocks
on:
  push:
    paths: [ '.github/workflows/*.yml' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check empty run
        run: |
          if grep -rE "run: [\"']{2}" .github/workflows/; then
            echo "Error: Found empty run blocks."
            exit 1
          fi
        shell: bash
