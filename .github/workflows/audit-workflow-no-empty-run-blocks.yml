name: Audit Workflow No Empty Run Blocks
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prohibit empty run blocks
        shell: bash
        run: |
          ! grep -rE "run:[[:space:]]*$" .github/workflows/
