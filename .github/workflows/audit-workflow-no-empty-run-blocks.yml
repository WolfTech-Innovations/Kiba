name: Audit Workflow No Empty Run Blocks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Workflow No Empty Run Blocks
        run: bash scripts/repo_audit.sh --check workflow_no_empty_run_blocks
        shell: bash
