name: "Audit Workflow No Empty Run"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for empty run
        run: |
          ! grep -r 'run: ""' .github/workflows/
        shell: bash
