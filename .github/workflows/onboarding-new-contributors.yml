name: Onboarding New Contributors
on:
  pull_request_target:
    types: [opened]
permissions:
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  welcome-msg:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login != github.repository_owner }}
    steps:
      - name: Post
        run: echo "Welcome to KibaOS!"
