name: Audit Shell Function Alias Comment

on:
  push:
    paths:
      - '**.sh'
      - '.zshrc'
  pull_request:
    paths:
      - '**.sh'
      - '.zshrc'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check alias comment
        run: |
          grep -r "^[[]]*alias[[]]+" . && exit 1 || exit 0
