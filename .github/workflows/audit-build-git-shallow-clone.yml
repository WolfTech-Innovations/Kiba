name: Audit Build Git Shallow Clone

on:
  push:
    paths:
      - 'scripts/kibatv_build.sh'
  pull_request:
    paths:
      - 'scripts/kibatv_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Git Shallow Clone
        run: |
          if grep "git clone" scripts/kibatv_build.sh | grep -v "\-\-depth=1"; then
            echo "Error: git clone should use --depth=1 to minimize build time and space"
            exit 1
          fi
