name: Audit Python Abstract Base Class

on:
  push:
    paths:
      - '**.py'
  pull_request:
    paths:
      - '**.py'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run AST Audit
        shell: bash
        run: |
          cat << 'EOF' > audit.py
          import ast
          import sys
          import os

          def check_file(filepath):
              with open(filepath, 'r', encoding='utf-8') as f:
                  try:
                      tree = ast.parse(f.read())
                  except SyntaxError:
                      return []

              errors = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.ClassDef):
                      has_abstract = False
                      for item in node.body:
                          if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef)):
                              for deco in item.decorator_list:
                                  if (isinstance(deco, ast.Name) and deco.id == 'abstractmethod') or \
                                     (isinstance(deco, ast.Attribute) and deco.attr == 'abstractmethod'):
                                      has_abstract = True
                                      break
                      if has_abstract:
                          inherits_abc = False
                          for base in node.bases:
                              if (isinstance(base, ast.Name) and base.id == 'ABC') or \
                                 (isinstance(base, ast.Attribute) and base.attr == 'ABC'):
                                  inherits_abc = True
                                  break
                          if not inherits_abc:
                              errors.append(f"{filepath}:{node.lineno}: Class with abstract methods should inherit from ABC")
              return errors

          failed = False
          for root, _, files in os.walk('.'):
              for file in files:
                  if file.endswith('.py'):
                      errs = check_file(os.path.join(root, file))
                      if errs:
                          for e in errs: print(e)
                          failed = True
          if failed: sys.exit(1)
          EOF
          python3 audit.py
