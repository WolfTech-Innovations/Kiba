name: Audit Workflow Max Timeout
on:
  push:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Timeout Value
        run: |
          # Ensure timeout-minutes is not excessively high (e.g., > 60 minutes)
          # except for the main build workflow
          EXCESSIVE=$(grep -rh "timeout-minutes: [0-9]\{3,\}" .github/workflows/ --exclude=kiba.yml || true)
          if [ -n "$EXCESSIVE" ]; then
            echo "Error: Excessive timeout-minutes detected (> 99): $EXCESSIVE"
            exit 1
          fi
