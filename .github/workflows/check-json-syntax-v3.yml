name: Check JSON Syntax
on:
  push:
    paths:
      - '**.json'
  pull_request:
    paths:
      - '**.json'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify JSON
        run: find . -name "*.json" -not -path "./node_modules/*" -exec jsonlint -q {} +
