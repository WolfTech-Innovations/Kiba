name: "Audit: NM Config"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: NM Config"
        run: |
          find . -name "NetworkManager.conf" | grep . || { echo 'Error: NetworkManager configuration missing'; exit 1; }
