name: "Audit Shell Bashisms"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for bashisms
        run: |
          sudo apt-get update && sudo apt-get install -y devscripts && checkbashisms scripts/*.sh
        shell: bash
