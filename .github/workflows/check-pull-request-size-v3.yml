name: Check Pull Request Size
"on":
  pull_request:
jobs:
  check:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: size
      name: Calculate Size
      run: 'DIFF=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | awk
        ''{print $4+$6}'' || echo 0)

        echo "size=$DIFF" >> $GITHUB_OUTPUT'
    - name: Label Size
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
      with:
        script: 'const size = parseInt(''${{ steps.size.outputs.size }}'');

          let label = ''size/XS'';

          if (size > 1000) label = ''size/XL'';

          else if (size > 500) label = ''size/L'';

          else if (size > 200) label = ''size/M'';

          else if (size > 50) label = ''size/S'';

          github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo,
          issue_number: context.issue.number, labels: [label] });'
    timeout-minutes: 5
