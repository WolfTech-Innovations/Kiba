name: Visualize Workflow Trigger Dependencies
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate Graph
        run: |
          echo "digraph G {" > workflow_graph.dot
          grep -r "workflows: \[" .github/workflows/ | while read -r line; do
            SRC=$(echo "$line" | cut -d: -f1 | xargs basename)
            DEST=$(echo "$line" | grep -oP 'workflows: \["\K[^"]+')
            echo "\"$SRC\" -> \"$DEST\";" >> workflow_graph.dot
          done
          echo "}" >> workflow_graph.dot
      - name: Upload Graph
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: workflow-dependencies
          path: workflow_graph.dot
