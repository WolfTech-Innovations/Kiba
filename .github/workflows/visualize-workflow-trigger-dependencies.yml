name: Visualize Workflow Trigger Dependencies
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Graph
        run: |
          echo "digraph G {" > workflow_graph.dot
          grep -r "workflows: \[" .github/workflows/ | while read -r line; do
            SRC=$(echo "$line" | cut -d: -f1 | xargs basename)
            # Handle multiple workflows in the array
            echo "$line" | grep -oP 'workflows: \[\K[^\]]+' | tr -d '" ' | tr ',' '\n' | while read -r DEST; do
              if [ -n "$DEST" ]; then
                echo "\"$SRC\" -> \"$DEST\";" >> workflow_graph.dot
              fi
            done
          done
          echo "}" >> workflow_graph.dot
      - name: Upload Graph
        uses: actions/upload-artifact@v4
        with:
          name: workflow-dependencies
          path: workflow_graph.dot
