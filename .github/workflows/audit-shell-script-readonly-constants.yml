name: Audit Shell Script Readonly Constants

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check readonly
        run: |
          grep -Er "^[A-Z_]+=" . --include="*.sh" | grep -v "readonly" && (echo "Global constants should be readonly" && exit 1) || exit 0
