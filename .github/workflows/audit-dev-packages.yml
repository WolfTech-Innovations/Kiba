name: "Audit: Dev Packages"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Dev Packages"
        run: |
          grep -E "-devel|-git" build.sh && { echo 'Error: Development packages found in production build list'; exit 1; } || exit 0
