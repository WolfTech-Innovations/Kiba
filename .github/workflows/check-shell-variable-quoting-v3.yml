name: Check Shell Variable Quoting
on:
  push:
paths:
- scripts/*.sh
  pull_request:
paths:
- scripts/*.sh
jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Check Quoting
      run: grep -rnE "[a-z0-9_]+=.* \$[a-z0-9_]+" scripts/ && exit 1 || exit 0
    timeout-minutes: 5
