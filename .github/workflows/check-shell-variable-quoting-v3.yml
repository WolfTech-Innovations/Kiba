name: Check Shell Variable Quoting
on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Quoting
        run: grep -rn '\$[a-zA-Z0-9_]*' . --include="*.sh" | grep -v '"\$' || true
