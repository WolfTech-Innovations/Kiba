name: Audit WF Secret Usage

on:
  push:
    paths:
      - ".github/workflows/*.yml"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Secrets
        run: |
          grep "secrets\." .github/workflows/*.yml | grep -v "GITHUB_TOKEN" || true
