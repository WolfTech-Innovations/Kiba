name: Audit Shell Script Mktemp Var

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
        with:
          persist-credentials: false
      - name: Check mktemp var
        run: |
          grep -r "mktemp" . --include="*.sh" | grep -v "TMPFILE" && (echo "mktemp result should be assigned to TMPFILE" && exit 1) || exit 0
