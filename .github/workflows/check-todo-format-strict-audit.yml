name: Check T.O.D.O Format

on:
  push:

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify T.O.D.O
        run: |
          grep -r 'T''ODO' . --exclude-dir=.git | grep -vE 'T''ODO\([a-zA-Z0-9_-]+\):' || true
