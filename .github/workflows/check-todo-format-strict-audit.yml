name: Check TODO Format

on:
  push:

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify TODO
        run: |
          grep -r "TODO" . | grep -vE "TODO\([a-zA-Z0-9_-]+\):" || true
