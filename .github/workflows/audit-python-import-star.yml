name: Audit Python Import Star

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit_python_import_star:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discourage from module import *
        run: |
          grep -r "import \*" . --include="*.py" && exit 1 || exit 0
