name: Audit First Login Gsettings
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify first-login font gsettings (Inter)
        run: |
          grep -q "gsettings set org.gnome.desktop.interface font-name 'Inter'" build.sh
