name: Check AUR Updates
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run AUR check
        id: aur_check
        run: bash scripts/check_aur.sh
      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aur_state_*.txt
          if git commit -m "chore: update AUR state files [skip ci]"; then
            git push
          fi
