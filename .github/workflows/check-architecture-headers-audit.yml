name: Check Architecture Headers

on:
  push:
    paths:
      - "docs/architecture.md"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify Headers
        run: |
          grep "^## " docs/architecture.md
