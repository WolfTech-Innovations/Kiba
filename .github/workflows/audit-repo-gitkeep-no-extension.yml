name: Audit Repo Gitkeep No Extension
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          if find . -name ".gitkeep.*" | grep .; then
            echo "ERROR: .gitkeep files should not have extensions"
            exit 1
          fi
