name: Audit Shortcut Meta Key Enforcement
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check Shortcuts for Meta
        run: |
          sed -n "/cat > \"\$SKEL_KDE\/kglobalshortcutsrc\" << 'KGLOBAL'/,/KGLOBAL/p" .github/workflows/kiba.yml | grep "=" | grep -v "KGLOBAL" > shortcuts.txt
          [ -s shortcuts.txt ] || (echo "Shortcuts not found" && exit 1)
          grep "=" shortcuts.txt | grep -v "Meta" && (echo "Shortcut found without Meta key" && exit 1) || echo "All shortcuts use Meta"
