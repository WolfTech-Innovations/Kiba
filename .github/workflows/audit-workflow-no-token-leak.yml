name: "Audit Workflow No Token Leak"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          ! grep -rE 'echo.*(github\.token|secrets\.)' .github/workflows/ | grep . || (echo "::error::Potential token/secret leak via echo" && exit 1)
