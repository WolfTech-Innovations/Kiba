name: Audit Workflow Permissions

on:
  push:
    paths:
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - ".github/workflows/*.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
heckout@11bd71901bbe5b1630ceea73d27597364c9af683/a         with:
          persist-credentials: false

      - name: Audit Workflow Permissions
        run: |
          ERR=0; for f in .github/workflows/*.yml; do if grep -q "Notes/" "$f" || grep -q "git push" "$f"; then grep -A 20 "jobs:" "$f" | grep -q "permissions:.*contents:.*write" || { echo "Error: $f missing write permissions"; ERR=1; }; fi; done; [ $ERR -eq 0 ]
