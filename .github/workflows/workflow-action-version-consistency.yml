name: Action Version Consistency

on:
  push:
    paths:
      - '.github/workflows/**.yml'
  pull_request:
    paths:
      - '.github/workflows/**.yml'

jobs:
  audit-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check action versions
        shell: bash
        run: |
          versions=$(grep -h "uses: actions/checkout@" .github/workflows/*.yml | grep -v "workflow-action-version-consistency.yml" | sort | uniq)
          count=$(echo "$versions" | grep -c "uses: actions/checkout@")
          test "$count" -le 1 || { echo "Error: Multiple versions found: $versions"; false; }
          echo "Action versions are consistent."
