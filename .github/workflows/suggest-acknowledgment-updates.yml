name: Suggest Acknowledgment Updates
on:
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  suggest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for New Credits
        run: |
          git fetch origin main
          git diff origin/main .github/workflows/kiba.yml | grep "^+" | grep -E "https://github.com" || echo "No new external links found"
