name: Audit Workflow Grep Patterns Check
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check grep audit patterns
        run: |
          # Negative checks: if grep BAD_PATTERN; then exit 1; fi
          if grep -rn "grep" .github/workflows/ | grep -vE "if .*grep.*; then exit 1; fi|if ! .*grep.*; then exit 1; fi"; then
             echo "Warning: Ensure audit workflows use recommended grep patterns for reliability."
          fi
