name: Audit Embedded Konsole Colorscheme
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Konsole Colorscheme
        run: |
          sed -n "/cat > \/usr\/share\/konsole\/Dracula\.colorscheme << 'KONSOLE_COLORS'/,/KONSOLE_COLORS/p" .github/workflows/kiba.yml | grep -v "KONSOLE_COLORS" > dracula.colorscheme
          [ -s dracula.colorscheme ] || (echo "Konsole colorscheme not found or empty" && exit 1)
          grep -qE "Color=[0-9]+,[0-9]+,[0-9]+" dracula.colorscheme || (echo "Invalid color format in Konsole colorscheme" && exit 1)
