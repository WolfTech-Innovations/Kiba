name: T.O.D.O Comment Tracker
on:
  push:
    branches: [main]
jobs:
  track-todos:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: List T.O.D.O.s
        run: |
          grep -rnE 'T''ODO|F''IXME' . --exclude-dir=.git | grep . && { echo "Pending T.O.D.O.s found"; } || echo "No T.O.D.O.s"
