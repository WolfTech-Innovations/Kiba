name: Check Py Syntax

on:
  push:
    paths:
      - "**/*.py"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Syntax
        run: |
          python3 -m py_compile jules_auto_fixer.py
