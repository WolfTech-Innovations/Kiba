name: Shell Script Portability Check

on:
  push:
    paths:
      - '**/*.sh'
  pull_request:
    paths:
      - '**/*.sh'

permissions:
  contents: read

concurrency:
  group: shell-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Dash Syntax Check
        run: |
          sudo apt update && sudo apt install -y dash
          for f in $(find . -name "*.sh"); do
            echo "Checking $f with dash..."
            dash -n "$f"
          done
