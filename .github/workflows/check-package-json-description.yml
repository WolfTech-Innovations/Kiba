name: Check package.json Description
on:
  push:
    paths:
      - 'package.json'
  pull_request:
    paths:
      - 'package.json'
jobs:
  check-description:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
heckout@11bd71901bbe5b1630ceea73d27597364c9af683/a         with:
          persist-credentials: false
      - name: Verify description presence
        run: |
          desc=$(jq -r '.description' package.json)
          if [ "$desc" = "null" ] || [ -z "$desc" ]; then
            echo "description field is missing in package.json"
            exit 1
          fi
