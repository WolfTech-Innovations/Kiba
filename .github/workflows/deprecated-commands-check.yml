name: Deprecated Commands Check

on:
  push:
    paths:
      - "**.sh"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "**.sh"
      - ".github/workflows/*.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan for deprecated commands
        run: |
          # Use grep to find deprecated commands (Debian-based tools now deprecated in KibaOS)
          if grep -rnE "apt-get|apt |nala|ifconfig|netstat" . | grep -vE "\.github/workflows/deprecated-commands-check\.yml|docs/software-management\.md|.github/workflows/kiba\.yml|check-shell-script-lint-v3\.yml"; then
            echo "Error: Use pacman, ip, or ss instead of deprecated commands"
            false
          fi
          echo "No deprecated commands found"
