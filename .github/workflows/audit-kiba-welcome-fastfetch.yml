name: Audit Kiba Welcome Fastfetch
on:
  push:
    paths:
      - 'build.sh'
      - 'scripts/**'
  pull_request:
    paths:
      - 'build.sh'
      - 'scripts/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check fastfetch flags
        run: |
          if grep -n "fastfetch" build.sh | grep -vE "\-\-logo none \-\-pipe true \-\-no\-color\-blocks"; then
            echo "Error: fastfetch calls must use: --logo none --pipe true --no-color-blocks"
            exit 1
          fi
