name: Audit Shebang Consistency

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Shebang Consistency
        run: bash scripts/repo_audit.sh --check shebang_consistency
        shell: bash
