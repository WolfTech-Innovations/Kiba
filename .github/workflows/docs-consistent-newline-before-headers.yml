name: Docs Consistent Newline Before Headers
on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for newline before headers
        run: |
          # Headers (except at line 1) should have a preceding empty line
          # We check if the line before a header is not empty and not another header
          errors=0
          while read -r file; do
            # Use awk to find headers not preceded by an empty line or the start of the file
            # NR > 1 ensures we don't check the first line
            # last_line_empty is 1 if previous line was empty or start of file
            bad_lines=$(awk 'NR > 1 && /^# / && last_line !~ /^$/ && last_line !~ /^#/ { print NR } { last_line = $0 }' "$file")
            if [ -n "$bad_lines" ]; then
              echo "Missing newline before header in $file at line(s): $bad_lines"
              errors=$((errors + 1))
            fi
          done < <(find . -name "*.md")

          if [ $errors -gt 0 ]; then
            exit 1
          fi
