name: Audit Build GRUB Timeout

on:
  push:
    paths:
      - ".github/workflows/kiba.yml"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check Timeout
        run: |
          grep "set timeout=5" .github/workflows/kiba.yml
