name: Workflow Trigger on pull_request_target Audit
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
heckout@11bd71901bbe5b1630ceea73d27597364c9af683/a         with:
          persist-credentials: false
      - name: Check for pull_request_target trigger
        run: |
          grep -rl "pull_request_target" .github/workflows/*.yml && { echo "pull_request_target trigger found; ensure it is used securely"; } || true
