name: Audit Repo SVG Metadata

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Repo SVG Metadata
        run: bash scripts/repo_audit.sh --check repo_svg_metadata
        shell: bash
