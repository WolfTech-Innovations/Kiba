name: Audit Repo Svg Metadata

on:
  push:
    paths:
      - '**.svg'
  pull_request:
    paths:
      - '**.svg'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Run Repo Audit
        shell: bash
        run: |
          if grep -rnEi "inkscape|sodipodi" . --include="*.svg"; then
            echo "Error: SVG contains Inkscape metadata"
            exit 1
          fi
