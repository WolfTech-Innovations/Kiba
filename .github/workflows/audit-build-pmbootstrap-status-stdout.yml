name: Audit Build Pmbootstrap Status Stdout

on:
  push:
    paths:
      - 'scripts/kibatv_build.sh'
  pull_request:
    paths:
      - 'scripts/kibatv_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Pmbootstrap Install Status
        run: |
          if ! grep -q "\-\-details-to-stdout" scripts/kibatv_build.sh; then
            echo "Error: pmbootstrap install should use --details-to-stdout for better logging"
            exit 1
          fi
