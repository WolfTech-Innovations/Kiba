name: Monitor CachyOS Kernel
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch and Compare
        run: |
          LATEST=$(curl -s https://api.github.com/repos/psygreg/linux-psycachy/releases/latest | jq -r .tag_name)
          CURRENT=$(grep -oP 'LATEST_TAG=\K[^\s]+' .github/workflows/kiba.yml | tr -d '"' | head -1)
          echo "Latest: $LATEST, Current: $CURRENT"
