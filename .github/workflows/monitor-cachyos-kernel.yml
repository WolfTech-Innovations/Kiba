name: "Monitor CachyOS Kernel"
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest CachyOS kernel version
        id: kernel_version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/CachyOS/linux-cachyos/releases/latest | grep tag_name | cut -d '"' -f 4)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest version is $VERSION"

      - name: Check if version is new
        id: check_new
        run: |
          LAST_VERSION=$(grep -oP '(?<=Kernel: ).*' WIKI.md | head -n 1)
          if [ "$LAST_VERSION" != "${{ steps.kernel_version.outputs.version }}" ]; then
            echo "new_version=true" >> $GITHUB_OUTPUT
            echo "New kernel version detected!"
          else
            echo "new_version=false" >> $GITHUB_OUTPUT
            echo "No new kernel version."
          fi

      - name: Update WIKI.md
        if: steps.check_new.outputs.new_version == 'true'
        run: |
          sed -i "s/Kernel: .*/Kernel: ${{ steps.kernel_version.outputs.version }}/" WIKI.md
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add WIKI.md
          git commit -m "chore: Update CachyOS Kernel to ${{ steps.kernel_version.outputs.version }}"
          git push

      - name: Trigger Build
        if: steps.check_new.outputs.new_version == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run kiba.yml
