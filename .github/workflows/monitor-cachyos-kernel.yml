name: Monitor CachyOS Kernel
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check latest CachyOS Kernel version
        run: |
          LATEST_VERSION=$(curl -s https://mirror.cachyos.org/cachyos/x86_64/ | grep -o 'linux-cachyos-[0-9][^"]*' | head -n 1 | sed 's/linux-cachyos-//')
          echo "Latest CachyOS Kernel version: $LATEST_VERSION"
          if [ -z "$LATEST_VERSION" ]; then
            echo "Failed to fetch version"
            exit 1
          fi
