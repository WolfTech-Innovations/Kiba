name: "Audit: AUR Helper"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: AUR Helper"
        run: |
          grep -E "yay|paru" build.sh || { echo 'Error: No AUR helper (yay/paru) detected in build.sh'; exit 1; }
