name: Audit Workflow Step Id Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit_workflow_step_id_format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure kebab-case for step IDs
        run: |
          grep "id:" .github/workflows/*.yml | grep "_" && exit 1 || exit 0
