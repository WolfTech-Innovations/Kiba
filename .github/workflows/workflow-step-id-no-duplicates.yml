name: Workflow Step ID No Duplicates
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for duplicate step IDs
        run: |
          for file in .github/workflows/*.yml; do
            yq '.jobs | .[] | .steps | .[] | .id' "$file" | grep -v "null" | sort | uniq -d | grep . && { echo "Duplicate step IDs found in $file"; exit 1; } || true
          done
