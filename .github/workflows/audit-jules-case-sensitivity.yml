name: Audit Jules Case Sensitivity
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Ensure .Jules directory is case-correct
        run: |
          [ -d .Jules ] && ! [ -d .jules ]
