name: Audit Workflow Pacman Repo Config
on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check pacman.conf additions
        run: |
          if ! grep -q "\[cachyos\]" .github/workflows/kiba.yml || ! grep -q "\[arch-cutefish\]" .github/workflows/kiba.yml; then
            echo "Error: .github/workflows/kiba.yml must add [cachyos] and [arch-cutefish] repositories to pacman.conf."
            exit 1
          fi
