name: ISO Metadata

on:
  workflow_run:
    workflows: ["KibaTV Build"]
    types: [completed]

jobs:
  metadata:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
heckout@11bd71901bbe5b1630ceea73d27597364c9af683/a         with:
          persist-credentials: false
      - name: Generate Metadata
        run: |
          echo "ISO Build completed at $(date)" > build-info.txt
          echo "Run ID: ${{ github.event.workflow_run.id }}" >> build-info.txt
heckout@11bd71901bbe5b1630ceea73d27597364c9af683/a         with:
          persist-credentials: false
        with:
          name: build-metadata
          path: build-info.txt
