name: "Audit: Shell Completions"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Shell Completions"
        run: |
          grep -q "bash-completion" build.sh || { echo 'Error: bash-completion package missing'; exit 1; }
