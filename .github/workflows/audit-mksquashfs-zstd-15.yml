name: Audit mksquashfs Zstd Level

on:
  push:
    paths:
      - 'scripts/kibatv_build.sh'
  pull_request:
    paths:
      - 'scripts/kibatv_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check mksquashfs zstd 15
        run: |
          grep "mksquashfs" scripts/kibatv_build.sh | grep "zstd" | grep -q "15" || (echo "Incorrect zstd level" && exit 1)
