name: Repo Executable Bit Check
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-exec-bit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify executable bits
        run: |
          find . -name "*.sh" -not -executable | grep . && echo "Error: Shell scripts must be executable" && exit 1 || exit 0
