name: "Audit: Shadow File Check"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Shadow File Check"
        run: |
          ! find . -name "shadow" -path "*/etc/*" | grep .
