name: Audit Shell Grep Fixed Strings

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check grep fixed strings
        run: |
          grep -rnE "\bgrep\s+['\"][^'\"*?+\[\]\(\)\{\}\^\$\|\\]+['\"]" . --include="*.sh" | grep -vE "\-[FEPv]" && (echo "Consider using grep -F for fixed strings" && exit 1) || exit 0
