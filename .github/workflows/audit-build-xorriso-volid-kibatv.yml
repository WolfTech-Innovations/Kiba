name: Audit Build Xorriso Volid Kibatv

on:
  push:
    paths:
      - 'scripts/kibatv_build.sh'
  pull_request:
    paths:
      - 'scripts/kibatv_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Xorriso Volid
        run: |
          if ! grep "xorriso" scripts/kibatv_build.sh | grep -q "\-volid \"KIBATV\""; then
            echo "Error: xorriso should use -volid KIBATV"
            exit 1
          fi
