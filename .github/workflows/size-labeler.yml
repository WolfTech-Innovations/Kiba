name: Size Labeler
on: pull_request

permissions:
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: pascalgn/size-label-action@v0.5.5
        with:
          sizes: >
            {
              "xs": 10,
              "s": 100,
              "m": 500,
              "l": 1000,
              "xl": 5000
            }
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
