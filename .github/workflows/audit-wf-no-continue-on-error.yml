name: Audit Workflow No Continue On Error

on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check continue-on-error
        shell: bash
        run: |
          grep -r "continue-on-error: true" .github/workflows | grep -vE "gitleaks|license-check|documentation-link-validator" && exit 1 || exit 0
