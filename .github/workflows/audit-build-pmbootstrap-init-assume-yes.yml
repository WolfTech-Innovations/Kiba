name: Audit Build Pmbootstrap Init Assume Yes

on:
  push:
    paths:
      - 'scripts/kibatv_build.sh'
  pull_request:
    paths:
      - 'scripts/kibatv_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Pmbootstrap Init
        run: |
          if grep "pmbootstrap" scripts/kibatv_build.sh | grep " init" | grep -v "\-\-assume-yes"; then
            echo "Error: pmbootstrap init should use --assume-yes"
            exit 1
          fi
