name: "Audit Markdown No Fixme"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          ! grep -ri 'FIXME' . --include='*.md' --exclude-dir=node_modules | grep . || (echo "::error::FIXME found in documentation" && exit 1)
