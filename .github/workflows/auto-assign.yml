name: Auto Assign
on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: kentaro-m/auto-assign-action@v2.0.0
        with:
          configuration-path: ".github/auto_assign.yml"
