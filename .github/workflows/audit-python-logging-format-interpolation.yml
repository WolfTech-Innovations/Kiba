name: Audit Python Logging Format Interpolation

on:
  push:
    paths:
      - '**.py'
  pull_request:
    paths:
      - '**.py'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run AST Audit
        shell: bash
        run: |
          cat << 'EOF' > audit.py
          import ast
          import sys
          import os

          LOG_METHODS = {'debug', 'info', 'warning', 'error', 'critical', 'exception'}

          def check_file(filepath):
              with open(filepath, 'r', encoding='utf-8') as f:
                  try:
                      tree = ast.parse(f.read())
                  except SyntaxError:
                      return []

              errors = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute):
                      if node.func.attr in LOG_METHODS:
                          if node.args and isinstance(node.args[0], (ast.BinOp, ast.JoinedStr)):
                              errors.append(f"{filepath}:{node.lineno}: Use lazy logging interpolation instead of f-strings or %")
              return errors

          failed = False
          for root, _, files in os.walk('.'):
              for file in files:
                  if file.endswith('.py'):
                      errs = check_file(os.path.join(root, file))
                      if errs:
                          for e in errs: print(e)
                          failed = True
          if failed: sys.exit(1)
          EOF
          python3 audit.py
