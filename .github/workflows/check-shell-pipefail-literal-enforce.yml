name: Check Shell Pipefail Literal

on:
  push:
    paths:
      - "scripts/*.sh"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Pipefail
        run: |
          grep -L "set -o pipefail" scripts/*.sh && false || true
