name: Audit Workflow Ssh Host Key
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check SSH host key verification
        run: |
          if grep -rn "StrictHostKeyChecking=no" .github/workflows/; then
            echo "Error: Do not disable StrictHostKeyChecking. Use ssh-keyscan instead."
            exit 1
          fi
          if grep -rn "ssh" .github/workflows/ | grep -v "ssh-keyscan" | grep -v "sshpass"; then
             echo "Warning: Ensure SSH operations are accompanied by host key verification using ssh-keyscan."
          fi
