name: "Audit: X11 Leftovers"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: X11 Leftovers"
        run: |
          ! find . -name "xorg.conf*" | grep .
