name: Audit Kiba Welcome Discovery Loop

on:
  push:
    paths:
      - 'scripts/kibaos_build.sh'
  pull_request:
    paths:
      - 'scripts/kibaos_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Discovery Loop
        run: |
          grep "&" scripts/kibaos_build.sh | grep "zenity" || (echo "Informational actions in Zenity menus should be backgrounded" && exit 1)
