name: TODO Persistence Tracking
on:
  push:
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  track-todos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0 # Full history needed for 'git blame'
      - name: Analyze TODO Longevity
        run: |
          echo "### TODO Persistence Audit" >> $GITHUB_STEP_SUMMARY
          echo "| File | Age (Days) | Content |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------------|---------|" >> $GITHUB_STEP_SUMMARY

          # Find TODOs and get their age via git blame
          grep -rnH "TODO" . --exclude-dir=".github" | head -n 20 | while read line; do
            FILE=$(echo $line | cut -d: -f1)
            LNUM=$(echo $line | cut -d: -f2)
            TEXT=$(echo $line | cut -d: -f3-)

            DATE=$(git blame -L $LNUM,$LNUM --porcelain $FILE | grep "^author-time" | cut -d' ' -f2)
            NOW=$(date +%s)
            AGE=$(( (NOW - DATE) / 86400 ))

            echo "| $FILE | $AGE | $TEXT |" >> $GITHUB_STEP_SUMMARY
          done
