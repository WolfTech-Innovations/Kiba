name: Check CONTRIBUTING.md Existence
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  check-contributing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify CONTRIBUTING.md exists
        run: |
          if [ ! -f "CONTRIBUTING.md" ]; then
            echo "CONTRIBUTING.md is missing from the repository root"
            exit 1
          fi
