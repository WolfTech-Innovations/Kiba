name: Python No Bare Except V3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python_no_bare_except_v3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strict bare except check
        run: |
          grep -r "except:" . --include="*.py" && exit 1 || exit 0
