name: Audit Workflow Env Naming

on:
  push:
    paths:
      - '.github/workflows/**.yml'
  pull_request:
    paths:
      - '.github/workflows/**.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Check environment variable naming
        run: |
          # Robust check for lowercase env vars in workflows
          grep -rnE "^[[:space:]]+[a-z_][a-z0-9_]*:" .github/workflows/ | grep -B1 "env:" && (echo "Workflow environment variables should be UPPER_CASE" && exit 1) || exit 0
