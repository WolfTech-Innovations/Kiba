name: Audit Shell Portable Command V

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Run Shell Audit
        shell: bash
        run: |
          if grep -rnE "^[^#]*\bwhich\b" . --include="*.sh"; then
            echo "Error: Use 'command -v' instead of 'which' for portability"
            exit 1
          fi
