name: Audit Python Print Statements

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit_python_print_statements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discourage print() in favor of logging
        run: |
          grep -r "print(" . --include="*.py" --exclude="generate*" && exit 1 || exit 0
