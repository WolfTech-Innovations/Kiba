name: Audit Workflow YQ Batching
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check yq batching
        run: |
          if grep -rn "yq" .github/workflows/ | grep -vE "yq .* \.github/workflows/\*\.yml"; then
             echo "Warning: Batching multiple YAML files in a single yq command is preferred over loops for performance."
          fi
