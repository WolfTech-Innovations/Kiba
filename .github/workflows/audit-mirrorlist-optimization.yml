name: "Audit: Mirrorlist Optimization"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Mirrorlist Optimization"
        run: |
          grep -q "reflector" build.sh || { echo 'Error: Reflector missing for mirrorlist optimization'; exit 1; }
