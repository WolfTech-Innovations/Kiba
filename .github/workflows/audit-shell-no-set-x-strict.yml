name: Audit Shell No Set X Strict

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
        with:
          persist-credentials: false
      - name: Check for set -x usage
        run: |
          # Robust check for set -x, ignoring comments
          grep -rnE "^[^#]*set -x" . --include="*.sh" && (echo "Avoid 'set -x' in production scripts; use 'set -v' or proper logging" && exit 1) || exit 0
