name: "Release Notes Autodraft"

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  save-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Save and commit release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
        shell: bash
        run: |
          chmod +x scripts/save_release_notes.sh
          ./scripts/save_release_notes.sh
