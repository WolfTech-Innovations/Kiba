name: Audit Workflow Job Needs Circularity
on:
  push:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Needs
        run: |
          grep -r "needs:" .github/workflows/ | while read -r line; do
            JOB=$(echo "$line" | grep -oP '^[[]]+\K[^:]+')
            DEPENDENCY=$(echo "$line" | cut -d: -f2 | xargs)
            [ "$JOB" == "$DEPENDENCY" ] && (echo "Circular dependency in $line" && exit 1) || true
          done
