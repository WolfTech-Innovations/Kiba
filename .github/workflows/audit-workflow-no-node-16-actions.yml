name: Audit Workflow No Node 16 Actions

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Workflow No Node 16 Actions
        run: bash scripts/repo_audit.sh --check workflow_no_node_16_actions
        shell: bash
