name: "Audit Workflow Node 16"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for Node 16 actions
        run: |
          ! grep -r 'uses: actions/setup-node@' .github/workflows/ | grep -v '@v4'
        shell: bash
