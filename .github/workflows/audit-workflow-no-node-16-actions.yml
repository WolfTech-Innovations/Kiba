name: Audit Workflow No Node 16 Actions
on:
  push:
    paths: [ '.github/workflows/*.yml' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Node 16
        run: |
          if grep -rE "uses: actions/(upload-artifact|download-artifact|setup-node)@v3" .github/workflows/; then
            echo "Warning: Found actions likely using Node 16 (v3)."
          fi
        shell: bash
