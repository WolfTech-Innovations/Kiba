name: Audit Build Os Release Pretty Name

on:
  push:
    paths:
      - 'scripts/kibatv_build.sh'
  pull_request:
    paths:
      - 'scripts/kibatv_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Pretty Name
        run: |
          if ! grep -q "PRETTY_NAME=\"KibaTV 1.0\"" scripts/kibatv_build.sh; then
            echo "Error: os-release PRETTY_NAME should be 'KibaTV 1.0'"
            exit 1
          fi
