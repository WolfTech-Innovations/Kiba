name: Audit Build Os Release Pretty Name

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Pretty Name
        run: |
          if ! grep -q "PRETTY_NAME=\"KibaOS 1.0\"" .github/workflows/kiba.yml; then
            echo "Error: os-release PRETTY_NAME should be 'KibaOS 1.0'"
            exit 1
          fi
