name: Audit Workflow Untrusted Context Mapping Check
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check untrusted context mapping
        run: |
          # Scans for direct usage of github context in run steps
          if grep -rnE "run:.*(\$\{\{ github\.event\.pull_request\.title \}\}|\$\{\{ github\.event\.pull_request\.body \}\}|\$\{\{ github\.event\.issue\.title \}\}|\$\{\{ github\.event\.issue\.body \}\})" .github/workflows/; then
            echo "Error: Untrusted GitHub context variables must be mapped to environment variables to prevent command injection."
            exit 1
          fi
