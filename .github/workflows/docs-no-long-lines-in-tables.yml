name: Docs No Long Lines in Tables
on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
heckout@11bd71901bbe5b1630ceea73d27597364c9af683/a         with:
          persist-credentials: false
      - name: Check table line length
        run: |
          grep -rnE "^\|.*\|$" . --include="*.md" | while read -r line; do
            len=$(echo "$line" | wc -c)
            if [ "$len" -gt 200 ]; then
              echo "Table line too long in $line"
              exit 1
            fi
          done
