name: Check package.json Repository Field
on:
  push:
    paths:
      - 'package.json'
  pull_request:
    paths:
      - 'package.json'
jobs:
  check-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify repository presence
        run: |
          repo=$(jq -r '.repository' package.json)
          if [ "$repo" = "null" ] || [ -z "$repo" ]; then
            echo "repository field is missing in package.json"
            exit 1
          fi
