name: Enforce Branch Naming
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-name:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: echo "Branch is $HEAD_REF"
