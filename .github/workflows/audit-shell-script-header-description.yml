name: Audit Shell Script Header Description

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check header comment
        run: |
          failed=0
          while IFS= read -r f; do
            if ! head -n 5 "$f" | grep -v "#!" | grep -q "#"; then
              echo "$f is missing description header"
              failed=1
            fi
          done < <(find . -name "*.sh")
          exit "$failed"
