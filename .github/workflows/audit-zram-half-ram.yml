name: Audit Zram Half Ram
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Verify zram-generator size configuration
        run: |
          grep -q 'zram-size = ram / 2' build.sh
