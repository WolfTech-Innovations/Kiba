name: Verify APT Repo GPG Signed Strict
true:
  push:
    paths:
    - .github/workflows/kiba.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Check signed-by
      run: '# All external repos must use signed-by keyring

        grep "sources.list.d" .github/workflows/kiba.yml -A 5 | grep -v "signed-by" |
        grep "http" && exit 1 || exit 0

        '
    timeout-minutes: 5
