name: Enforce Md List Marker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  enforce_md_list_marker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce - as list marker
        run: |
          grep -r "^* " . --include="*.md" && exit 1 || exit 0
