name: Audit WF Dispatch Desc

on:
  push:
    paths:
      - ".github/workflows/*.yml"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check Descriptions
        run: |
          grep -A 1 "inputs:" .github/workflows/*.yml | grep -v "description:" || true
