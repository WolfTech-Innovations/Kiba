name: "Audit Build SH PaperDE ldconfig"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check ldconfig after build
        run: |
          if grep -q 'paperde' build.sh; then grep -A 20 'ninja -C paperde-src/build install' build.sh | grep -q 'ldconfig'; else echo 'No PaperDE found'; fi
        shell: bash
