name: "Audit Build Sh Paperde Ldconfig"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          if grep -q "ninja -C paperde-src/build install" build.sh; then grep -A 20 "ninja -C paperde-src/build install" build.sh | grep -q "ldconfig"; else echo "PaperDE not found, skipping"; fi
