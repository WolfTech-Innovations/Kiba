name: Audit Build SH PaperDE ldconfig
on:
  push:
    paths:
      - 'build.sh'
  pull_request:
    paths:
      - 'build.sh'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify ldconfig after PaperDE build
        shell: bash
        run: |
          if grep -q "paperde-src" build.sh; then
            grep -A 20 "ninja -C paperde-src/build install" build.sh | grep -q "ldconfig"
          fi
