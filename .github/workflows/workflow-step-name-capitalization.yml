name: Workflow Step Name Capitalization
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify step name capitalization
        run: |
          for file in .github/workflows/*.yml; do
            unnamed=$(yq '.jobs | .[] | .steps | .[] | .name' "$file" | grep -vE "^[A-Z]|null")
            if [ -n "$unnamed" ]; then
              echo "Error: $file contains step names not starting with a capital letter: $unnamed"
              exit 1
            fi
          done
