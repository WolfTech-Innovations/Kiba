name: Audit GitHub Actions Cache Key
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify cache keys use hashes
        run: |
          for file in .github/workflows/*.yml; do
            grep -q "actions/cache" "$file" && (grep -q "hashFiles" "$file" || { echo "Cache usage in $file should use hashFiles in key"; exit 1; })
          done
          echo "Cache key check complete"
