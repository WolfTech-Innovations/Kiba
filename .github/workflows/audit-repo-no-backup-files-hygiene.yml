name: Audit Repo No Backup Files Hygiene

on:
  push:
    paths:
      - '**'
  pull_request:
    paths:
      - '**'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for backup files
        run: |
          # Robust check for common backup and swap files
          find . -type f \( -name "*~" -o -name "*.bak" -o -name "*.swp" -o -name "*.old" -o -name "*.tmp" \) | grep . && (echo "Remove backup and temporary files from the repository" && exit 1) || exit 0
