name: Audit Build Rm No V

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
        with:
          persist-credentials: false
      - name: Check for rm verbose
        run: |
          # Robust check for rm -v or --verbose
          grep -rnE "^[^#]*rm " scripts/ | grep -E "(\-v|\-\-verbose)" && (echo "Avoid 'rm -v' in build scripts to keep logs clean" && exit 1) || exit 0
