name: Audit Shell Cd Exit

on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check cd exit
        run: |
          grep -rnE "\bcd\b" . --include="*.sh" | grep -vE "\|\| exit|cd \-" && (echo "cd should be followed by || exit" && exit 1) || exit 0
