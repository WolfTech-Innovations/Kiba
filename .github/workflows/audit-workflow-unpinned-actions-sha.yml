name: Audit Workflow Unpinned Actions Sha

on:
  push:
    paths:
      - '.github/workflows/**.yml'
  pull_request:
    paths:
      - '.github/workflows/**.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for pinned actions
        run: |
          # Robust check for actions/ checkout without SHA-1 pinning
          grep -rn "uses: actions/" .github/workflows/ | grep -vE "@[a-f0-9]{40}" && (echo "Use full SHA-1 pins for actions/ checkout and other official actions" && exit 0) || exit 0
          # Setting to soft-fail for now to avoid breaking existing workflows, but notifying.
