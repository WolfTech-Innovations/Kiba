name: Stale Closer
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-message: "This issue has been inactive for 60 days and will be closed in 7 days."
          close-issue-message: "Closing inactive issue."
          stale-issue-label: "stale"
          exempt-issue-labels: "keep"
          days-before-pr-stale: -1
          days-before-pr-close: -1
