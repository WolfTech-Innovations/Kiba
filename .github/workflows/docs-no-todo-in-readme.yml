name: Docs No Todo In Readme

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs_no_todo_in_readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure no TODOs in README.md
        run: |
          grep "TODO" README.md && exit 1 || exit 0
