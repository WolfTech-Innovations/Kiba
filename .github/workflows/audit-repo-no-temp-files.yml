name: "Audit Repo No Temp Files"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for temp files
        run: |
          [ -z "$(find . -name '*.tmp' -o -name '*.swp')" ]
        shell: bash
