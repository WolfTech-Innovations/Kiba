name: Audit Workflow Job ID Naming

on:
  push:
    paths:
      - '.github/workflows/**.yml'
  pull_request:
    paths:
      - '.github/workflows/**.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check job ID kebab-case
        run: |
          grep -rnE "^\s+[a-zA-Z0-9_]+:" .github/workflows | grep -vE "name:|runs-on:|steps:|uses:|with:|env:|if:|strategy:|matrix:|timeout-minutes:|outpu[t]s:|needs:|pull_request:|workflow_dispatch:|workflow_run:|pull_request_target:|schedule:|on:|permissions:|concurrency:" | grep "_" && (echo "Job IDs should use kebab-case (hyphens), not underscores" && exit 1) || exit 0
