name: Audit Build Eatmydata Usage

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check eatmydata
        run: |
          grep -q "eatmydata" .github/workflows/kiba.yml || (echo "eatmydata missing" && exit 1)
