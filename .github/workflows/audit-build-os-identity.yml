name: Audit Build OS Identity

on:
  push:
    paths:
      - "scripts/kibatv_build.sh"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check OS Release
        run: |
          grep "PRETTY_NAME=\"KibaTV 1.0\"" scripts/kibatv_build.sh
