name: Audit Build OS Identity

on:
  push:
    paths:
      - ".github/workflows/kiba.yml"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check OS Release
        run: |
          grep "PRETTY_NAME=\"KibaOS 1.0\"" .github/workflows/kiba.yml
