name: Audit Build OS Identity

on:
  push:
    paths:
      - "scripts/kibatv-build.sh"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check OS Release
        run: |
          grep "PRETTY_NAME=\"KibaTV 1.0\"" scripts/kibatv-build.sh
