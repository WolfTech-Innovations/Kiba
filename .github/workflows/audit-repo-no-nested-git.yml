name: "Audit Repo No Nested Git"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          ! find . -mindepth 2 -name '.git' -type d | grep . || (echo "::error::Nested .git directories found" && exit 1)
