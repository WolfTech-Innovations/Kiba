name: Verify README Hero Accessibility
on:
  push:
    paths:
      - 'README.md'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Alt Text
        run: |
          grep -oP 'alt="[^"]*"' README.md | head -1 | grep -qv 'alt=""' || (echo "Hero image must have descriptive alt text" && exit 1)
