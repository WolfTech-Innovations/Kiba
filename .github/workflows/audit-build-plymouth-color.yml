name: Audit Build Plymouth Color

on:
  push:
    paths:
      - "scripts/kibatv-build.sh"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Color
        run: |
          grep "Window.SetBackgroundTopColor(0.157, 0.165, 0.212);" scripts/kibatv-build.sh
