name: "Audit Repo Lowercase Dirs"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check directory naming
        run: |
          [ "$(find . -maxdepth 2 -type d -name '*[A-Z]*' -not -path './.git*' -not -path './Notes*' -not -path '.' | wc -l)" -eq 0 ]
        shell: bash
