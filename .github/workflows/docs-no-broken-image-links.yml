name: Docs No Broken Image Links
on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for broken local image links
        run: |
          grep -roE "!\[.*\]\(.*\)" . --include="*.md" | while read -r line; do
            file_path=$(echo "$line" | cut -d: -f1)
            dir_path=$(dirname "$file_path")
            img_path=$(echo "$line" | sed -E 's/.*!\[.*\]\((.*)\)/\1/')

            if [[ "$img_path" != http* ]]; then
              if [[ "$img_path" == /* ]]; then
                # Root-relative
                [ -f ".${img_path}" ] || { echo "Broken root-relative image link: $img_path in $file_path"; exit 1; }
              else
                # Relative to file
                [ -f "${dir_path}/${img_path}" ] || [ -f "$img_path" ] || { echo "Broken relative image link: $img_path in $file_path"; exit 1; }
              fi
            fi
          done
