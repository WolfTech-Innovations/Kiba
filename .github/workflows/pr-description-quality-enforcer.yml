name: PR Description Quality Enforcer

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-description:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate PR Description
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BODY="$PR_BODY"
          LENGTH=${#BODY}
          if [ "$LENGTH" -lt 50 ]; then
            echo "PR description is too short ($LENGTH characters). Please provide more context."
            exit 1
          fi
          if ! echo "$BODY" | grep -qiE "closes|fixes|resolves"; then
             echo "PR description should link to an issue (Closes #123)."
          fi
