name: Audit Workflow Kebab Filenames Strict
on:
  push:
    paths: [ '.github/workflows/*.yml' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify filename
        run: |
          for f in .github/workflows/*.yml; do
            base=$(basename "$f")
            if [[ "$base" =~ [^a-z0-9.-] ]]; then
              echo "Error: Filename $base is not kebab-case."
              exit 1
            fi
          done
        shell: bash
