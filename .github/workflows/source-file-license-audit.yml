name: Source File License Audit
on:
  pull_request:
    paths-ignore:
      - '.github/**'
      - 'branding/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  license-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify MIT Header Presence
        run: |
          echo "### Source License Audit" >> $GITHUB_STEP_SUMMARY

          MISSING_FILES=""
          # Only check scripts and configs
          for f in $(find . -maxdepth 2 -name "*.sh" -o -name "*.py" -o -name "*.js" | grep -v ".github"); do
            if ! grep -q "MIT License" "$f"; then
              MISSING_FILES="$MISSING_FILES\n- $f"
            fi
          done

          if [ -n "$MISSING_FILES" ]; then
            echo "The following source files are missing the MIT License header:" >> $GITHUB_STEP_SUMMARY
            echo -e "$MISSING_FILES" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "-  All source files contain the mandatory license header." >> $GITHUB_STEP_SUMMARY
          fi
