name: Audit Workflow Timeout Reasonable
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          if ! grep -r "timeout-minutes:" .github/workflows/; then
             echo "ERROR: Workflows should have explicit timeout-minutes"
             exit 1
          fi
