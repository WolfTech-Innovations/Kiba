name: Audit Workflow Timeout Reasonable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Workflow Timeout Reasonable
        run: bash scripts/repo_audit.sh --check workflow_timeout_reasonable
        shell: bash
