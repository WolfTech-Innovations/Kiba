name: Audit Workflow Timeout Reasonable
on:
  push:
    paths: [ '.github/workflows/*.yml' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify timeout
        run: |
          BAD=$(grep -rhE "timeout-minutes: [0-9]{3,}" .github/workflows/ | awk '$2 > 360 {print $0}' || true)
          if [ -n "$BAD" ]; then
            echo "Error: Found excessively high timeout-minutes (> 360)."
            exit 1
          fi
        shell: bash
