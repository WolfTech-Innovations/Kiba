name: Auto Welcome New Contributor
true:
  pull_request_target:
    types:
    - opened
jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Check for first PR
      id: check
      uses: actions/github-script@v7
      with:
        script: "const { data: pulls } = await github.rest.pulls.list({\n  owner:\
          \ context.repo.owner,\n  repo: context.repo.repo,\n  state: 'all',\n  creator:\
          \ context.payload.pull_request.user.login\n});\nif (pulls.length === 1)\
          \ {\n  core.setOutput('is_first', 'true');\n}\n"
    - name: Post Welcome Comment
      if: steps.check.outputs.is_first == 'true'
      uses: actions/github-script@v7
      with:
        script: "github.rest.issues.createComment({\n  owner: context.repo.owner,\n\
          \  repo: context.repo.repo,\n  issue_number: context.issue.number,\n  body:\
          \ \"\U0001F680 Welcome to KibaTV! We're thrilled to see your first contribution.\
          \ Please make sure you've read our [CONTRIBUTING.md](CONTRIBUTING.md).\
          \ \u2728\"\n})\n"
    timeout-minutes: 5
