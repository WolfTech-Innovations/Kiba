name: Audit Python No Print

on:
  push:
    paths:
      - '**.py'
  pull_request:
    paths:
      - '**.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: tr""ue
      - name: Check for print calls
        run: |
          grep -rnE "^\s*print\(" . --include="*.py" && (echo "Use logging instead of print()" && exit 1) || exit 0
