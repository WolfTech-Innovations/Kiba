name: Audit Markdown KibaOS Consistency

on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check KibaOS brand consistency
        run: |
          grep -rnEi "KibaOS|kibaos" . --include="*.md" | grep -v "KibaOS" && (echo "Ensure KibaOS brand consistency (not 'KibaOS' or 'kibaos')" && exit 1) || exit 0
