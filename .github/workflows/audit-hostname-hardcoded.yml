name: "Audit: Hostname Hardcoded"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Audit: Hostname Hardcoded"
        run: |
          ! grep -r "hostname" airootfs/etc/hostname 2>/dev/null
