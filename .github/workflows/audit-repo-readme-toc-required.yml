name: Audit Repo README TOC Required

on:
  push:
    paths:
      - 'README.md'
  pull_request:
    paths:
      - 'README.md'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check TOC
        run: |
          line_count=$(wc -l < README.md)
          if [ "$line_count" -gt 100 ]; then
            grep -qi "Table of Contents" README.md || (echo "README > 100 lines needs TOC" && exit 1)
          fi
