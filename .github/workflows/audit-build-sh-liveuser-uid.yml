name: Audit Build SH Liveuser UID
on:
  push:
    paths: [ 'build.sh' ]
  pull_request:
    paths: [ 'build.sh' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify UID
        run: |
          if ! grep -q "liveuser:x:1000:1000" build.sh; then
             echo "Error: liveuser UID/GID 1000 mismatch."
             exit 1
          fi
        shell: bash
