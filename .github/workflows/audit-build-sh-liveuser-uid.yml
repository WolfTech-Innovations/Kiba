name: Audit Build SH Liveuser UID
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit liveuser UID
        shell: bash
        run: |
          if [ -f "build.sh" ]; then
            if grep -q "liveuser" build.sh; then
              if ! grep -q "1000:1000" build.sh; then
                echo "ERROR: liveuser found in build.sh but UID/GID 1000 is not explicitly set"
                exit 1
              fi
            fi
          fi
