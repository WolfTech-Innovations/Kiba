name: Audit Build Sh Liveuser Uid
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          if grep -q "liveuser" build.sh; then grep -q "1000:1000" build.sh || (echo "Error: liveuser UID/GID is not 1000" && exit 1); fi
