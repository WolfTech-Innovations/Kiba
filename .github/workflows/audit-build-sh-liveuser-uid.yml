name: "Audit Build Sh Liveuser Uid"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          if grep -q "liveuser" build.sh; then grep -q "1000:1000" build.sh; else echo "liveuser not found"; fi
