name: Audit Build Kwin Blur 12

on:
  push:
    paths:
      - 'scripts/kibaos_build.sh'
  pull_request:
    paths:
      - 'scripts/kibaos_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Kwin Blur Strength
        run: |
          if ! grep -q "BlurStrength=12" scripts/kibaos_build.sh; then
            echo "Error: KWin blur strength should be set to 12"
            exit 1
          fi
