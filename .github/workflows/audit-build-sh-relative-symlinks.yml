name: Audit Build SH Relative Symlinks
on:
  push:
    paths: [ 'build.sh' ]
  pull_request:
    paths: [ 'build.sh' ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify symlinks
        run: |
          if grep "ln -sf /usr/lib/systemd/system/" build.sh; then
            echo "Warning: Absolute symlinks found in build.sh."
          fi
        shell: bash
