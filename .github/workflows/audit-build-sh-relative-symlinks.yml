name: "Audit Build SH Relative Symlinks"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for absolute symlinks
        run: |
          ! grep -r "ln -sf /" build.sh | grep -v "/usr/lib/systemd/system/"
        shell: bash
