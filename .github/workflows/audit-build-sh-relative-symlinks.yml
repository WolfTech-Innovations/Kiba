name: Audit build.sh Relative Symlinks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run audit
        shell: bash
        run: |
          if [ -f "build.sh" ]; then
            if grep -q "ln -s /" build.sh; then
              echo "WARN: Absolute symlinks found in build.sh, consider relative ones"
              # Non-fatal for now unless strict
            fi
          fi
