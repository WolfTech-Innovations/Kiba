name: Starship Init Quoted Eval

on:
  push:
    paths:
      - "scripts/kibaos_build.sh"
  pull_request:
    paths:
      - "scripts/kibaos_build.sh"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Starship Init Quoted Eval
        run: |
          grep -q "starship init" scripts/kibaos_build.sh && ! grep -q "\'eval\' \"\$(starship init zsh)\"" scripts/kibaos_build.sh && { echo "Error: unquoted eval"; false; } || true
