name: Starship Init Quoted Eval

on:
  push:
    paths:
      - ".github/workflows/kiba.yml"
  pull_request:
    paths:
      - ".github/workflows/kiba.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Starship Init Quoted Eval
        run: |
          grep -q "starship init" .github/workflows/kiba.yml && ! grep -q "\'eval\' \"\$(starship init zsh)\"" .github/workflows/kiba.yml && { echo "Error: unquoted eval"; false; } || true
