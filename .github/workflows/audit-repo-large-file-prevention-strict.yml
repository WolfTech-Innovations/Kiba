name: Audit Repo Large File Prevention Strict
true:
  push:
    branches:
    - main
  pull_request: null
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Scan Files
      run: '# Strict 1MB threshold for non-image files

        find . -type f -size +1M ! -path "./.git/*" ! -name "*.png" | grep . && exit
        1 || exit 0

        '
    timeout-minutes: 5
