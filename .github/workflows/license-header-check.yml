name: License Header Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for License Headers
        run: |
          for f in scripts/*.sh build.sh; do
            if ! head -n 5 "$f" | grep -q "MIT"; then
              echo "Missing MIT license header in $f"
              exit 1
            fi
          done
