name: Audit Build Kdeglobals Single Click

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Single Click
        run: |
          if ! grep -q "SingleClick=true" .github/workflows/kiba.yml; then
            echo "Error: SingleClick should be enabled in kdeglobals"
            exit 1
          fi
