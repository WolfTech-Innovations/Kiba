name: "Audit Repo Gitkeep Empty"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check .gitkeep is empty
        run: |
          [ -z "$(find . -name '.gitkeep' -type f -size +0)" ]
        shell: bash
