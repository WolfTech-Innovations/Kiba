name: "Audit Repo Gitkeep Empty"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          ! find . -name '.gitkeep' -type f -size +0 | grep . || (echo "::error::.gitkeep files must be empty" && exit 1)
