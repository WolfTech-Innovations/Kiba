name: Check JSON Syntax
on: [push, pull_request]

permissions:
  contents: read

jobs:
  json-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - name: Lint JSON
        run: find . -name "*.json" -not -path "*/node_modules/*" | xargs -I {} pnpm exec jsonlint -q {}
