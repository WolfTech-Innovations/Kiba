name: JSON Lint
on: [push, pull_request]

jobs:
  json-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - name: JSON Lint
        run: find . -name "*.json" -not -path "*/node_modules/*" | xargs pnpm exec jsonlint -q
