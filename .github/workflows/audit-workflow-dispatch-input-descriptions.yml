name: Audit Workflow Dispatch Input Descriptions
on:
  push:
    paths:
      - '.github/workflows/*.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Inputs
        run: |
          python3 -c "
          import yaml, os, sys
          failed = False
          for root, dirs, files in os.walk('.github/workflows'):
              for file in files:
                  if not (file.endswith('.yml') or file.endswith('.yaml')): continue
                  with open(os.path.join(root, file)) as f:
                      try:
                          data = yaml.safe_load(f)
                      except: continue
                      if not data or 'on' not in data: continue
                      triggers = data['on']
                      if isinstance(triggers, dict) and 'workflow_dispatch' in triggers:
                          inputs = triggers['workflow_dispatch'].get('inputs', {})
                          if inputs:
                              for name, info in inputs.items():
                                  if 'description' not in info:
                                      print(f'Missing description for input {name} in {file}')
                                      failed = True
          if failed: sys.exit(1)
          "
