name: Audit Workflow No Secrets In Run Name

on:
  push:
    paths:
      - '.github/workflows/**.yml'
  pull_request:
    paths:
      - '.github/workflows/**.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for secrets in run-name
        run: |
          grep -rn "run-name:" .github/workflows | grep "secrets\." && (echo "Avoid using secrets in workflow run-name" && exit 1) || exit 0
