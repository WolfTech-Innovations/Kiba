name: "Branch Name Enforcer"
on:
  pull_request:
    types: [ opened ]

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check branch name
        run: "[[ \"${{ github.head_ref }}\" =~ ^(feat|fix|docs|refactor|test|chore)/ ]] || exit 1"
