name: Github Actions Cache Usage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  github_actions_cache_usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Encourage actions/cache@v4
        run: |
          grep "actions/cache@" .github/workflows/*.yml | grep -v "v4" && exit 1 || exit 0
