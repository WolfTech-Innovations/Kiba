name: "Audit Markdown Ordered List Consistency"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run audit
        shell: bash
        run: |
          ! grep -rE '^[0-9]\) ' . --include='*.md' --exclude-dir=node_modules | grep . || (echo "::error::Use '1.' for ordered lists, not '1)'" && exit 1)
