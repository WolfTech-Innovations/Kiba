name: Audit Markdown Ordered List Consistency

on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check list numbering
        run: |
          grep -Pr "^1\. " . --include="*.md" || (echo "Ordered lists should start with 1." && exit 1)
