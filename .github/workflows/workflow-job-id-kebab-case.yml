name: Workflow Job ID Kebab Case
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify job IDs
        run: |
          for file in .github/workflows/*.yml; do
            # Extremely simple check for top-level keys under 'jobs'
            # Since we can't trust yq version, use a simple grep/sed
            bad_jobs=$(grep -A 100 "jobs:" "$file" | grep "^  [a-zA-Z0-9_-]*:" | sed 's/  //;s/://' | grep -vE "^[a-z0-9-]+$")
            if [ -n "$bad_jobs" ]; then
               echo "Error: $file contains job IDs not in kebab-case: $bad_jobs"
               exit 1
            fi
          done
