name: Workflow Job ID Kebab Case
on:
  push:
    paths:
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify job IDs are kebab-case
        run: |
          # Use optimized python script if PyYAML is available, otherwise fallback to yq
          if python3 -c "import yaml" 2>/dev/null; then
            python3 scripts/audit_workflow_job_ids.py
          else
            for file in .github/workflows/*.yml; do
              bad_jobs=$(yq '.jobs | keys | .[]' "$file" | grep -vE "^[a-z0-9-]+$")
              if [ -n "$bad_jobs" ]; then
                echo "Error: $file contains job IDs not in kebab-case: $bad_jobs"
                exit 1
              fi
            done
          fi
