name: Audit Python Open Encoding UTF8

on:
  push:
    paths:
      - '**.py'
  pull_request:
    paths:
      - '**.py'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
        with:
          persist-credentials: false
      - name: Check encoding
        run: |
          grep -r "open(" . --include="*.py" | grep -v "encoding=" && (echo "Explicit encoding required in open()" && exit 1) || exit 0
