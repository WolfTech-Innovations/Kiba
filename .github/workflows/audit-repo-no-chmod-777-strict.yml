name: Audit Repo No Chmod 777 Strict
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit chmod 777
        shell: bash
        run: |
          if grep -rE "chmod (0?777|777)" . --exclude-dir=.git; then
            echo "ERROR: Found dangerous chmod 777"
            exit 1
          fi
