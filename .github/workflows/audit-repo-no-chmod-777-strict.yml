name: "Audit Repo No Chmod 777"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for chmod 777
        run: |
          ! grep -rE 'chmod (0?777|777)' . --exclude-dir=.git --exclude='repo_audit.sh' --exclude-dir='.github'
        shell: bash
