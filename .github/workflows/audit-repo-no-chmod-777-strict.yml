name: Audit Repo No Chmod 777 Strict

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Audit Repo No Chmod 777 Strict
        run: bash scripts/repo_audit.sh --check repo_no_chmod_777_strict
        shell: bash
