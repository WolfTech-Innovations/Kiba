name: "Audit Repo no chmod 777"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Audit Repo no chmod 777
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          ! grep -rE "chmod (0?777|777)" . --exclude-dir=.git --exclude-dir=.github --exclude="scripts/repo_audit.sh" || (echo "chmod 777 found" && exit 1)
