name: Stale Issue Cleanup Notifier

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale-notifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Notify Stale Issues
        uses: actions/stale@5bef6a0d0d6110292728422615953739622d6f04
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been stale for 30 days. It will be closed in 7 days if no further activity occurs."
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: "stale"
