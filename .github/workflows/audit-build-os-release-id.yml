name: Audit Build Os Release Id

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Os Release Id
        run: |
          if ! grep -q "ID=kibaos" .github/workflows/kiba.yml; then
            echo "Error: os-release ID should be set to kibaos"
            exit 1
          fi
