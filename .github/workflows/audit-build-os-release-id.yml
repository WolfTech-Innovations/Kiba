name: Audit Build Os Release Id

on:
  push:
    paths:
      - 'scripts/kibaos_build.sh'
  pull_request:
    paths:
      - 'scripts/kibaos_build.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Os Release Id
        run: |
          if ! grep -q "ID=kibatv" scripts/kibaos_build.sh; then
            echo "Error: os-release ID should be set to kibatv"
            exit 1
          fi
