name: Audit Build Gzip 9

on:
  push:
    paths:
      - 'scripts/**.sh'
  pull_request:
    paths:
      - 'scripts/**.sh'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check for gzip max compression
        run: |
          # Robust check for gzip without -9 or --best
          grep -rnE "^[^#]*gzip " scripts/ | grep -vE "(\-9|\-\-best)" && (echo "Use 'gzip -9' for maximum compression in build artifacts" && exit 1) || exit 0
