name: Shell Script No Eval
on:
  push:
    paths:
      - '**.sh'
  pull_request:
    paths:
      - '**.sh'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check for eval usage
        run: |
          grep -rnE "^[[:space:]]*eval[[:space:]]+" . --include="*.sh" && { echo "eval usage found in shell scripts; avoid eval for security"; exit 1; } || echo "No eval usage found"
