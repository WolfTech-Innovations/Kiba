name: Monitor Kora Icons
on:
  schedule:
    - cron: '0 3 * * *'
permissions:
  issues: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Get
        run: curl -s https://api.github.com/repos/bikass/kora/releases/latest | jq -r .tag_name
