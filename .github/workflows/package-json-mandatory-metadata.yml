name: Package JSON Mandatory Metadata

on:
  push:
    paths:
      - "package.json"
  pull_request:
    paths:
      - "package.json"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
heckout@11bd71901bbe5b1630ceea73d27597364c9af683/a         with:
          persist-credentials: false

      - name: Package JSON Mandatory Metadata
        run: |
          ERR=0; for f in description repository; do grep -q "\"$f\":" package.json || { echo "Error: missing $f"; ERR=1; }; done; [ $ERR -eq 0 ]
