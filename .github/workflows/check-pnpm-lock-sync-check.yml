name: Check PNPM Lock Sync

on:
  push:
    paths:
      - "package.json"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify Lockfile
        run: |
          test -f pnpm-lock.yaml
