name: Check Workflows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        shell: bash
        run: pip install PyYAML
      - name: Run check_workflows.py
        shell: bash
        run: python3 check_workflows.py
        env:
          PYTHONUNBUFFERED: 1
          PYYAML_CSAFELOADER: 1
