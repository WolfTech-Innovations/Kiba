name: Audit Build Grub Timeout 5

on:
  push:
    paths:
      - '.github/workflows/kiba.yml'
  pull_request:
    paths:
      - '.github/workflows/kiba.yml'

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Grub Timeout
        run: |
          if ! grep -q "set timeout=5" .github/workflows/kiba.yml; then
            echo "Error: GRUB timeout should be set to 5 seconds"
            exit 1
          fi
