name: Zshrc Prompt Optimization

on:
  push:
    paths:
      - ".github/workflows/kiba.yml"
  pull_request:
    paths:
      - ".github/workflows/kiba.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Zshrc Prompt Optimization
        run: |
          grep -q "vcs_info" .github/workflows/kiba.yml && ! grep -q "if command -v starship" .github/workflows/kiba.yml && { echo "Warning: missing skip"; } || true
