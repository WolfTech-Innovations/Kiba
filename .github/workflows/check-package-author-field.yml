name: Check Package Author Field

on:
  push:
    paths:
      - "package.json"

jobs:
  audit:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Author
        run: |
          grep "\"author\":" package.json
